/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   G1LESSON — the نبع/موازي lesson-methodology shell
   ──────────────────────────────────────────────────────────────────────────────────────────────────────
   The Fikr engine is the user's verbatim template and is never edited. This layer attaches to the
   DOM around it and supplies the parts of the ten-section lesson frame that a practice game cannot
   carry on its own:

     الآية      a mushaf-verified verse anchor
     الجذور     the three-letter Quranic roots of the unit
     القصة      the story frame and its link to prior learning
     الأهداف    five stated objectives (the game's own objective is the fifth)
     المحطات    the three levels reframed as lesson stations with differentiation notes
     الخروج     an exit card of four items أ–هـ with a success criterion
     الواجب     two homework items
     المراجعة   a reflection prompt
     P2         the mandatory "draft, not classroom-tested" status line

   It reads a LESSON object authored beside each GAME (see any games/gradeN/src/*.js). If a game has
   no LESSON object it still works: the shell degrades to the P2 line and the game's own objective,
   so nothing breaks and the claim boundary is never silently dropped.

   Hard rules copied from the source lesson documents:
     • The verse frames VALUE. It is never a description of an algorithm. Every unit carries an
       explicit "الآية ليست وصفًا لـ…" caution and we render it.
     • No attribution to the Prophet ﷺ beyond verbatim quoted hadith with a source line.
     • No brain-function claims. No student photos. Nothing loads from the network.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */

const G1LESSON = (() => {
  const P2 = 'مسوّدة — نموذج أولي لم يُجرَّب صفيًا ولم يُعتمد منهجيًا';

  /* ---------- tiny DOM helpers (the engine's UI.h is not exposed; do not depend on it) ---------- */
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach((c) => c && n.appendChild(c));
    return n;
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- resolve the LESSON for this game, then its UNIT, with safe defaults ----------
     Precedence: an inline LESSON object in the game's own source wins (so a single lesson can override
     anything), then the shared LESSONS registry, then a minimal frame built from GAME itself. The unit
     supplies the verse, the Quranic roots and the anti-overreach caution; the lesson supplies the rest. */
  function read() {
    const g = (typeof GAME !== 'undefined' && GAME) || {};
    const inline = (typeof LESSON !== 'undefined' && LESSON) || null;
    const registry = (typeof LESSONS !== 'undefined' && LESSONS) || {};
    const units = (typeof LESSON_UNITS !== 'undefined' && LESSON_UNITS) || {};
    const own = registry[g.id] || null;
    const base = inline || own || null;

    if (!base) {
      return {
        code: g.code, title: g.title, story: g.welcome, objectives: [g.objective].filter(Boolean),
        note: null, roots: [], verse: null, stations: [], exit: [], homework: [], reflect: null, blocks: [],
      };
    }

    const unitId = base.unit || (inline && inline.unit) || null;
    const unit = (unitId && units[unitId]) || {};
    const merged = Object.assign({}, unit, base);
    /* the unit's verse/roots/note win only where the lesson did not override them */
    if (!merged.verse && unit.verse) merged.verse = unit.verse;
    if ((!merged.roots || !merged.roots.length) && unit.roots) merged.roots = unit.roots;
    if (!merged.note && unit.note) merged.note = unit.note;
    if (!merged.code) merged.code = g.code;
    if (!merged.title) merged.title = g.title;
    return merged;
  }

  /* ---------- the shell, rendered as a panel at the foot of the home screen ---------- */
  function panel() {
    const L = read();
    /* The frame is teacher/parent-facing, so it sits BELOW the play cards and collapsed. The child reaches
       the game immediately; the adult can open the plan. The P2 claim boundary stays outside the fold and is
       always visible — it must never be something you have to expand to discover. */
    const shell = el('section', { class: 'lesson-shell', 'aria-label': 'إطار الدرس' });

    const p2 = el('p', { class: 'ls-p2', text: P2 });
    shell.appendChild(p2);

    const details = el('details', { class: 'ls-details' });
    const summary = el('summary', { class: 'ls-summary' });
    /* a drawn icon rather than a raw emoji, for the same reason the game chrome uses G1ICON: an emoji
       becomes an empty box on a device whose font lacks it, and this is the control the teacher taps. */
    const sumIc = el('span', { class: 'ls-sum-ic' });
    const drawnIc = (typeof G1ICON !== 'undefined' && G1ICON.big('📋', 20)) || '';
    if (drawnIc) sumIc.innerHTML = drawnIc; else sumIc.textContent = '📋';
    summary.appendChild(sumIc);
    summary.appendChild(el('b', { text: 'إطار الدرس' }));
    if (L.code) summary.appendChild(el('span', { class: 'ls-code', text: L.code }));
    if (L.title) summary.appendChild(el('span', { class: 'ls-title', text: L.title }));
    summary.appendChild(el('span', { class: 'ls-chev', text: '▾' }));
    details.appendChild(summary);

    const wrap = el('div', { class: 'ls-body' });
    details.appendChild(wrap);
    shell.appendChild(details);

    /* ── الآية + الجذور ── */
    if (L.verse || (L.roots && L.roots.length)) {
      const v = el('div', { class: 'ls-sec ls-verse' });
      v.appendChild(el('h4', { text: 'الآية والجذور' }));
      if (L.verse) {
        v.appendChild(el('p', { class: 'ls-ayah', text: L.verse.text }));
        v.appendChild(el('p', { class: 'ls-ref', text: L.verse.ref }));
      }
      if (L.roots && L.roots.length) {
        const r = el('div', { class: 'ls-roots' });
        r.appendChild(el('span', { class: 'ls-lbl', text: 'الجذور القرآنية' }));
        L.roots.forEach((x) => r.appendChild(el('span', { class: 'ls-root', text: x })));
        v.appendChild(r);
      }
      /* the anti-overreach caution — this is the rule the source documents insist on */
      if (L.note) v.appendChild(el('p', { class: 'ls-note', text: L.note }));
      wrap.appendChild(v);
    }

    /* ── القصة + الأهداف ── */
    const o = el('div', { class: 'ls-sec' });
    o.appendChild(el('h4', { text: 'الأهداف' }));
    if (L.story) o.appendChild(el('p', { class: 'ls-story', text: L.story }));
    if (L.objectives && L.objectives.length) {
      const ol = el('ol', { class: 'ls-objs' });
      L.objectives.forEach((x) => ol.appendChild(el('li', { text: x })));
      o.appendChild(ol);
    }
    wrap.appendChild(o);

    /* ── المحطات: the levels, reframed ── */
    const lv = (typeof GAME !== 'undefined' && GAME.levels) || [];
    if (lv.length) {
      const s = el('div', { class: 'ls-sec' });
      s.appendChild(el('h4', { text: 'المحطات — ثلاث مستويات تمايز' }));
      const grid = el('div', { class: 'ls-stations' });
      lv.forEach((L2, i) => {
        const note = (L.stations && L.stations[i]) || L2.blurb || '';
        const c = el('div', { class: 'ls-station' });
        c.appendChild(el('b', { text: `المحطة ${['١', '٢', '٣', '٤', '٥'][i] || i + 1} · ${L2.name || ''}` }));
        if (note) c.appendChild(el('small', { text: note }));
        grid.appendChild(c);
      });
      s.appendChild(grid);
      if (L.blocks && L.blocks.length) {
        s.appendChild(el('p', { class: 'ls-blocks', text: 'التسلسل الزمني: ' + L.blocks.join(' ← ') }));
      }
      wrap.appendChild(s);
    }

    /* ── الخروج ── */
    if (L.exit && L.exit.length) {
      const x = el('div', { class: 'ls-sec' });
      x.appendChild(el('h4', { text: 'بطاقة الخروج' }));
      const ol = el('ol', { class: 'ls-exit' });
      L.exit.forEach((item) => {
        const li = el('li');
        li.appendChild(el('span', { class: 'ls-grade', text: (item.grade || '') }));
        li.appendChild(el('span', { text: item.text }));
        ol.appendChild(li);
      });
      x.appendChild(ol);
      if (L.criterion) x.appendChild(el('p', { class: 'ls-crit', text: 'معيار النجاح: ' + L.criterion }));
      wrap.appendChild(x);
    }

    /* ── الواجب + المراجعة ── */
    if ((L.homework && L.homework.length) || L.reflect) {
      const hw = el('div', { class: 'ls-sec' });
      if (L.homework && L.homework.length) {
        hw.appendChild(el('h4', { text: 'الواجب — بلا شاشات' }));
        const ul = el('ul', { class: 'ls-hw' });
        L.homework.forEach((t) => ul.appendChild(el('li', { text: t })));
        hw.appendChild(ul);
      }
      if (L.reflect) {
        hw.appendChild(el('h4', { text: 'المراجعة' }));
        hw.appendChild(el('p', { class: 'ls-reflect', text: L.reflect }));
      }
      wrap.appendChild(hw);
    }

    return shell;
  }

  /* ---------- mount on every home render ---------- */
  function mount() {
    const home = document.querySelector('#stage .home');
    if (!home || home.querySelector('.lesson-shell')) return;
    home.appendChild(panel());
  }

  function start() {
    mount();
    const stage = document.getElementById('stage');
    if (stage && !start.__obs) {
      start.__obs = new MutationObserver(() => { try { mount(); } catch (e) { /* never break the game */ } });
      start.__obs.observe(stage, { childList: true, subtree: true });
    }
    setTimeout(() => { try { mount(); } catch (e) { /* fine */ } }, 60);
    setTimeout(() => { try { mount(); } catch (e) { /* fine */ } }, 420);
  }

  return { start, panel, P2 };
})();

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1LESSON.start(); } catch (e) { /* never break the game */ } }, 0));
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 9 · Arc Table · reading a quadratic from a table of values, its zero heights vs its greatest
   height, and components of a vector
   Source: G09-U01-L03 — «نبع | نقرأ المسار ولا ندّعي رحلة حقيقية» — الدالة التربيعية والمتجهات،
   مسودة رياضيات، الوحدة الأولى، الترم الأول.

   DOCUMENT CAVEAT, carried into the build — this bundle says of itself: «مسودة منتجة تحتاج مراجعة
   وتطويرًا، غير معتمدة. HTML وتنفيذ الألعاب الرقمية مؤجلان», and it also says its numbers and drawings are
   hypothetical and prove no real aircraft performance. So game 04 is the prototype the document asks for,
   the caveat travels with it, and the fictional path is never presented as a measurement.

   SCOPE — this lesson's own pathway is: substitute into a quadratic, read the roots / vertex / axis from
   the domain given, distinguish a ZERO height from a GREATEST height, and combine two vectors by their
   components while explaining the sign and the unit. The first two are a build-the-table activity, which
   is why this game leads with a table and only then shows the curve; the vector third is found in NO
   other Grade 9 document, so it is this game's alone. The root/vertex reading on a supplied picture is
   game 01's ground; here the student produces the numbers that make the picture.
   Named misconceptions: «zero height is the maximum height», «negative components are impossible», and
   «a vector is the same as its length».
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const GAME = {
  id: 'g9-arc-table', code: 'G09-U01-L03', title: 'Arc Table', emoji: '📊',
  accent: '#8a5a1c', accentDeep: '#6b4413', skyA: '#fdf7ec', skyB: '#f0e0c2',
  topic: 'Table of values, zero vs greatest height, and vector components', band: 'g912', lang: 'en',
  objective: 'I can build a table for a quadratic and separate a zero height from the greatest height.',
  welcome: 'A model path is measured at fixed steps and written in a table. The table is where the story actually is. 📊',
  learnBlurb: 'Substitute each x, then read the shape: the zeros are at the ends, the peak is in the middle.',
  how: {
    what: 'To read a quadratic from a table, substitute each x and record y. A y of zero means the path touches the ground; the largest y in the table is the peak. For a vector, add the two components separately and keep the sign and the unit.',
    steps: ['📊 Substitute each x into the rule and fill the row.', 'A zero is a landing point; the biggest value is the top.', '✅ Add vectors component by component, sign and unit included.'],
  },

  learn: [
    { say: 'The rule is <b>y = −x² + 4x</b>. Substituting gives 0, 3, 4, 3, 0 for x = 0…4. The two zeros are landings; the 4 in the middle is the peak.',
      draw(el) { el.append(UI.h('div', { html: SCENE9.valueTable([0, 1, 2, 3, 4], (x) => -x * x + 4 * x, { rowA: 'x', rowB: 'y', caption: 'y = −x² + 4x' }) })); } },
    { say: 'Those five readings draw this curve. The same numbers, seen instead of written.',
      draw(el) { el.append(UI.h('div', { html: SCENE9.parabola({ a: -1, h: 2, k: 4, ymin: -1, ymax: 6, roots: true, caption: 'the table drawn' }) })); } },
    { say: 'Your turn. At <b>x = 3</b> the rule <b>y = −x² + 4x</b> gives what height?', wait: true,
      draw(el, L) {
        el.append(UI.h('div', { html: SCENE9.valueTable([0, 1, 2, 3, 4], (x) => -x * x + 4 * x, { ask: 3, rowA: 'x', rowB: 'y', caption: 'fill the dashed cell' }) }));
        const row = UI.h('div', { class: 'opts' });
        [['3', true], ['4', false], ['−3', false]].forEach(([t, ok]) => row.append(UI.h('button', {
          class: 'opt', text: t,
          onclick: (e) => (ok ? (e.target.classList.add('good'), L.ok('Yes — −(3)² + 4(3) = −9 + 12 = 3.'))
            : (UI.shake(e.target), SFX.play('wrong'), COACH.say(t === '4' ? 'That is the peak at x = 2, not x = 3.' : 'Square first, then add.', 'bad'))),
        }))); el.append(row);
      } },
    { say: 'Ghubar says the height of <b>0</b> at x = 4 must be the greatest height, because zero is the bottom of the table. Is it?', wait: true,
      draw(el, L) {
        GHUBAR.pop('Zero is the biggest drop, so it is the greatest height.', 5200);
        el.append(UI.h('div', { html: SCENE9.valueTable([0, 1, 2, 3, 4], (x) => -x * x + 4 * x, { rowA: 'x', rowB: 'y', caption: 'where is the peak?' }) }));
        const row = UI.h('div', { class: 'opts' });
        [['No — zero is the ground; the greatest height is 4 at x = 2.', true], ['Yes — zero is the greatest height.', false], ['The greatest height is 0 at both ends.', false]].forEach(([t, ok]) => row.append(UI.h('button', {
          class: 'opt', text: t,
          onclick: (e) => (ok ? (e.target.classList.add('good'), L.ok('Right. Zero height is a landing; the peak is the largest value in the row.'))
            : (UI.shake(e.target), SFX.play('wrong'), COACH.say('Read the y row and find the largest number.', 'bad'))),
        }))); el.append(row);
      } },
  ],

  fixOpts(q) {
    if (!q || !q.options || q.type === 'order' || q.type === 'bars') return q;
    const ans = String(q.answer);
    const seen = new Set();
    let kept = false;
    q.options = q.options.map((o) => {
      let s = String(o);
      if (s === ans && !kept) { kept = true; seen.add(s); return o; }
      if (!seen.has(s)) { seen.add(s); return o; }
      const num = s.match(/-?\d+(?:\.\d+)?/);
      if (num) {
        const v = Number(num[0]);
        const alt = [v + 1, v - 1, v + 2, v * 2, v - 2].find((c) => {
          const cand = s.replace(num[0], String(c));
          return c !== v && cand !== ans && !seen.has(cand);
        });
        if (alt != null) s = s.replace(num[0], String(alt));
      }
      while (seen.has(s) || s === ans) s = s + '·';
      seen.add(s);
      return s;
    });
    return q;
  },

  levels: [
    { name: 'Fill the table', icon: '📊', blurb: 'Substitute and record.', rounds: 6, think: false,
      say: '📊 Square the x first, then apply the rule.',
      round(i) { return GAME.fixOpts(this.roundRaw(i)); },
      roundRaw(i) {
        const k = UI.rint(2, 5);
        const xs = [0, 1, 2, 3, 4];
        const ask = UI.rint(1, 3);
        const val = (x) => -x * x + 2 * k * x;
        return {
          type: 'choice',
          prompt: G1.art(SCENE9.valueTable(xs, val, { ask, rowA: 'x', rowB: 'y', caption: 'y = −x² + ' + (2 * k) + 'x' }),
            `For <b>y = −x² + ${2 * k}x</b>, what is y when x = <b>${xs[ask]}</b>?`),
          options: [String(val(xs[ask])), String(val(xs[ask]) + 2), String(-val(xs[ask]))],
          answer: String(val(xs[ask])),
          why: (v) => Number(v) === -val(xs[ask]) ? 'That flips the sign — the minus belongs to x² only.'
            : 'Square x first, then subtract it from the linear term.',
          hints: [`x² is ${xs[ask] * xs[ask]}.`, `−${xs[ask] * xs[ask]} + ${2 * k}×${xs[ask]}.`, `That is ${val(xs[ask])}.`],
          solution: `−(${xs[ask]})² + ${2 * k}(${xs[ask]}) = <b>${val(xs[ask])}</b>.`,
        };
      } },
    { name: 'Zero or peak', icon: '⛰️', blurb: 'Separate the landings from the top.', rounds: 6, think: false,
      say: '⛰️ Two different questions, one table.',
      round(i) { return GAME.fixOpts(this.roundRaw(i)); },
      roundRaw(i) {
        const r = UI.rint(2, 5);
        const val = (x) => -(x) * (x - 2 * r);
        const peakX = r, peakY = r * r;
        /* the distractors are built to be wrong AND distinct: the landing (always 0) and the last x
           (which is 2r and could otherwise coincide with the peak when r = 2) */
        const wrongLast = 2 * r === peakY ? 2 * r + 1 : 2 * r;
        return {
          type: 'choice',
          prompt: G1.art(SCENE9.valueTable([0, r, 2 * r], val, { rowA: 'x', rowB: 'y', caption: 'read the shape' }),
            `The table shows zero heights at both ends. What is the <b>greatest</b> height in the row?`),
          options: [String(peakY), '0', String(wrongLast)],
          answer: String(peakY),
          why: (v) => Number(v) === 0 ? 'Zero is a landing, not the top.' : 'The greatest height is the largest y value, not the last x.',
          hints: ['The zeros are the ends.', 'The peak sits halfway between them.', `At x = ${peakX} the height is ${peakY}.`],
          solution: `The greatest height is <b>${peakY}</b>, reached at x = ${peakX}; the zeros are landings.`,
        };
      } },
    { name: 'Add the vectors', icon: '➡️', blurb: 'Components, sign and unit.', rounds: 6, think: true,
      say: '➡️ Think first: are the components displacements or speeds?',
      round(i) { return GAME.fixOpts(this.roundRaw(i)); },
      roundRaw(i) {
        const ax = UI.rint(1, 5), ay = UI.rint(-4, 4), bx = UI.rint(-3, 3), by = UI.rint(-4, 4);
        const fx = ax + bx, fy = ay + by;
        /* the classic wrong move mixes the components: across+up. Keep it only when it really differs
           from the correct sum, otherwise use a plain sign slip instead. */
        const mixed = `(${ax + by}, ${ay + bx}) m`;
        const right = `(${fx}, ${fy}) m`;
        const w2 = mixed !== right ? mixed : `(${fx}, ${fy + 2}) m`;
        const w3 = `(${ax - bx}, ${ay - by}) m` !== right && `(${ax - bx}, ${ay - by}) m` !== w2
          ? `(${ax - bx}, ${ay - by}) m` : `(${fx + 1}, ${fy}) m`;
        return {
          type: 'choice',
          problem: {
            sentences: ['A model path is written with displacements in metres, not speeds.',
              'Displacements add component by component, and a negative component means the opposite direction.',
              `The two displacements are (${ax}, ${ay}) and (${bx}, ${by}) metres.`],
            question: 1, keys: ['displacement', 'component'], extras: [2],
          },
          prompt: G1.art(SCENE9.valueTable([1, 2], (k) => k, { rowA: 'vector', rowB: 'id', caption: `(${ax}, ${ay}) + (${bx}, ${by})` }),
            `What is the sum of the two displacements?`),
          options: [right, w2, w3],
          answer: right,
          why: (v) => /^-?\d+, -?\d+$/.test(String(v).replace(/[() m]/g, '').replace(/,\s/, ','))
            ? 'Check whether you added across-to-across and up-to-up, or mixed them.'
            : 'Re-add the components one column at a time.',
          hints: [`Add the first components: ${ax} + (${bx}) = ${fx}.`, `Add the second: ${ay} + (${by}) = ${fy}.`, `Keep the unit: metres.`],
          solution: `<b>(${fx}, ${fy}) m</b> — a displacement, not a speed.`,
        };
      } },
  ],

  ghubar: ['Zero height is the greatest height.', 'Negative components are impossible.', 'A vector is the same as its length.'],
  praise: ['Table filled!', 'Peak found!', 'Landings read!', 'Vectors added!'],
  finale: 'Build the table, then read the shape — landings at the ends, the peak in the middle. 📊',
};

window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1THEME.start(); } catch (e) { /* never break the game for a missing icon */ } }, 0));
window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1LESSON.start(); } catch (e) { /* never break the game for a missing lesson shell */ } }, 0));
</script>

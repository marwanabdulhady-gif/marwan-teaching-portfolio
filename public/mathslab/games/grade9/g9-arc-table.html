      body += label(String(bottom[k]), x, y2 + 28, 15, bottom[k] === '' ? WARM : B2);
    }
    /* the shared ticks are joined by a faint dotted line so the two scales read as one measure */
    for (let k = 0; k <= n; k += 1) {
      const x = ox + (span * k) / n;
      body += `<line x1="${x}" y1="${y1 + 9}" x2="${x}" y2="${y2 - 9}" stroke="${GRID}" stroke-width="1.4" stroke-dasharray="4 5"/>`;
    }
    if (opts.topName) body += txt(opts.topName, ox, 24, 14, '#41525f');
    if (opts.bottomName) body += txt(opts.bottomName, ox, y2 + 52, 14, '#8a5a1f');
    if (opts.caption) body += label(opts.caption, W / 2, H - 12, 14, '#5b6b7a');
    return wrap(W, H, opts.label || 'a double number line with two aligned scales', body, opts.max);
  }

  /* ── unitRateCart: two carts with quantity and price; the child finds the per-one price ──────────
     opts.a = {n, price, label}, opts.b = {n, price, label}. Only the pack sizes and totals print. */
  function unitRateCart(a, b, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 300;
    let body = blank(W, H, opts.fill || '#fbfdff');
    const cart = (o, cx, fill, fill2) => {
      let g = '';
      /* body */
      g += `<path d="M${cx - 62} ${118}h124l-14 66a10 10 0 0 1-10 8h-76a10 10 0 0 1-10-8Z" fill="${fill}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
      /* handle + wheels */
      g += `<path d="M${cx + 62} 118l16-26h22" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
      g += `<circle cx="${cx - 34}" cy="204" r="12" fill="${fill2}" stroke="${INK}" stroke-width="2.4"/>`;
      g += `<circle cx="${cx + 34}" cy="204" r="12" fill="${fill2}" stroke="${INK}" stroke-width="2.4"/>`;
      /* the goods: one small crate per unit, capped so the drawing stays legible */
      const shown = Math.min(o.n, 6);
      for (let k = 0; k < shown; k += 1) {
        const x = cx - 44 + (k % 3) * 30, y = 150 - Math.floor(k / 3) * 26;
        g += `<rect x="${x}" y="${y}" width="${22}" height="${20}" rx="3" fill="#fff" stroke="${INK}" stroke-width="1.8"/>`;
      }
      g += label(`${o.label}`, cx, 60, 17, INK);
      g += label(`Qty ${o.n}`, cx, 250, 16, '#41525f');
      g += label(`Total ${o.price}`, cx, 274, 16, BRAND);
      return g;
    };
    body += cart(a, W / 4, A, A2);
    body += cart(b, (W * 3) / 4, B, B2);
    body += `<line x1="${W / 2}" y1="150" x2="${W / 2}" y2="270" stroke="${GRID}" stroke-width="1.6" stroke-dasharray="5 6"/>`;
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 14, '#5b6b7a');
    return wrap(W, H, opts.label || 'two carts with different pack sizes and totals', body, opts.max);
  }

  /* ── fitModel: how many groups of b fit inside a — the dividing-fractions model ──────────────────
     opts.a = whole length in thirds-ish units, opts.b = size of one group. Both are counts of the
     same unit fraction, so the picture is exact; the quotient is never printed. */
  function fitModel(a, b, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 250;
    const n = Math.max(a, 1);
    const cw = Math.min(56, 470 / n);
    const ox = (W - cw * n) / 2;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += txt(opts.aName || 'the quantity you have', ox, 46, 14, '#41525f');
    for (let k = 0; k < n; k += 1) {
      body += `<rect x="${ox + k * cw}" y="${56}" width="${cw}" height="42" rx="4" fill="${A}" stroke="${INK}" stroke-width="1.8"/>`;
    }
    body += `<rect x="${ox}" y="${56}" width="${cw * n}" height="42" rx="6" fill="none" stroke="${INK}" stroke-width="2.8"/>`;
    body += txt(opts.bName || 'one group', ox, 156, 14, '#8a5a1f');
    for (let k = 0; k < Math.min(b, n); k += 1) {
      body += `<rect x="${ox + k * cw}" y="${166}" width="${cw}" height="34" rx="4" fill="${B}" stroke="${INK}" stroke-width="1.8"/>`;
    }
    body += `<rect x="${ox}" y="${166}" width="${cw * Math.min(b, n)}" height="34" rx="6" fill="none" stroke="${WARM}" stroke-width="2.4"/>`;
    /* bracket showing one group lifted out of the whole */
    const gx = ox, gw = cw * Math.min(b, n);
    body += `<path d="M${gx} 118v10h${gw}v-10" fill="none" stroke="${WARM}" stroke-width="2.4" stroke-linecap="round"/>`;
    if (opts.caption) body += label(opts.caption, W / 2, H - 22, 14, '#5b6b7a');
    return wrap(W, H, opts.label || `a bar of ${a} parts with one group of ${b} marked below it`, body, opts.max);
  }

  /* ── integerLine: a horizontal number line for integer work ─────────────────────────────────────
     opts.from/to bound the axis, opts.mark = the value to show, opts.marks = extra values */
  function integerLine(from, to, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 150;
    const ox = 56, span = W - 112, y = 88;
    const step = span / Math.max(1, to - from);
    const X = (v) => ox + (v - from) * step;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<line x1="${ox - 18}" y1="${y}" x2="${ox + span + 18}" y2="${y}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${ox + span + 24} ${y}l-9-6v12Z" fill="${INK}"/><path d="M${ox - 24} ${y}l9-6v12Z" fill="${INK}"/>`;
    for (let v = from; v <= to; v += 1) {
      body += `<line x1="${X(v)}" y1="${y - 6}" x2="${X(v)}" y2="${y + 6}" stroke="${INK}" stroke-width="2"/>`;
      body += label(String(v), X(v), y + 28, 13, '#41525f');
    }
    const dot = (v, fill, name) => {
      let g = `<circle cx="${X(v)}" cy="${y}" r="9" fill="${fill}" stroke="${INK}" stroke-width="2"/>`;
      if (name) g += label(name, X(v), y - 22, 13, INK);
      return g;
    };
    (opts.marks || []).forEach((m) => { body += dot(m.v, m.fill || B, m.name); });
    if (opts.mark != null) body += dot(opts.mark, opts.fill || WARM, opts.markName);
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#5b6b7a');
    return wrap(W, H, opts.label || `a number line from ${from} to ${to}`, body, opts.max);
  }

  /* ── balance: a two-pan balance for one-step equations ───────────────────────────────────────────
     opts.left = 'x + 4' style sprite list, opts.right = value. Renders pans and weights, not x. */
  function balance(left, right, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 300;
    let body = blank(W, H, opts.fill || '#fbfdff');
    const cy = 118;
    body += `<path d="M300 118v96" stroke="${INK}" stroke-width="4"/>`;
    body += `<path d="M236 218h128l-12 22H248Z" fill="${A}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    body += `<line x1="120" y1="${cy}" x2="480" y2="${cy}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
    body += `<circle cx="300" cy="${cy}" r="10" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
    const pan = (cx, items, fill) => {
      let g = '';
      g += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy + 44}" stroke="${INK}" stroke-width="2.2"/>`;
      g += `<path d="M${cx - 62} ${cy + 44}h124l-16 30H${cx - 46}Z" fill="${fill}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
      items.forEach((it, k) => {
        const x = cx - 44 + (k % 4) * 30, y = cy + 14 - Math.floor(k / 4) * 30;
        if (it === 'x') {
          g += `<rect x="${x}" y="${y}" width="24" height="26" rx="4" fill="#fff" stroke="${WARM}" stroke-width="2.4"/>`;
          g += label('x', x + 12, y + 19, 16, WARM);
        } else {
          g += `<circle cx="${x + 12}" cy="${y + 14}" r="12" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
          g += label(String(it), x + 12, y + 19, 13, INK);
        }
      });
      return g;
    };
    body += pan(170, left, A);
    body += pan(430, right, B);
    body += label('balanced', 300, H - 22, 15, '#5b6b7a');
    if (opts.caption) body += label(opts.caption, 300, 40, 16, INK);
    return wrap(W, H, opts.label || 'a balance with two pans', body, opts.max);
  }

  /* ── polygon: a named polygon drawn to its side lengths, vertices and angles ────────────────────
     opts.sides = [n numbers], opts.kind = 'triangle' | 'rect' | 'parallelogram' | 'trapezoid' | 'regular'
     opts.angles = [degrees to mark] . Labels are the side lengths, drawn on the edges. */
  function polygon(opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 320;
    const cx = 300, cy = 168;
    let body = blank(W, H, opts.fill || '#fbfdff');
    let pts = [], names = opts.sides || [];
    const kind = opts.kind || 'triangle';
    if (kind === 'rect') {
      const b0 = Number(opts.w) > 0 ? Number(opts.w) : 8, h0 = Number(opts.hh) > 0 ? Number(opts.hh) : 5;
      const k0 = Math.min(320 / b0, 170 / h0);
      const w = b0 * k0, h = h0 * k0;
      pts = [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]];
    } else if (kind === 'parallelogram') {
      /* base and height come from the numbers, on one scale, so the picture cannot contradict its labels.
         The slant is cosmetic — it must not change the height. */
      const b = Number(opts.w) > 0 ? Number(opts.w) : 7, hh = Number(opts.hh) > 0 ? Number(opts.hh) : 4;
      const k = Math.min(300 / b, 160 / hh);
      const w = b * k, h = hh * k, sk = Math.min(62, w * 0.22);
      const x0 = cx - (w + sk) / 2, y0 = cy - h / 2;
      pts = [[x0 + sk, y0], [x0 + sk + w, y0], [x0 + w, y0 + h], [x0, y0 + h]];
      opts._altitude = { x: x0 + sk + w * 0.52, y0: y0 + h, y1: y0, base: b, height: hh, x0: x0, x1: x0 + w, yb: y0 + h };
    } else if (kind === 'trapezoid') {
      /* the two parallel edges are the labelled ones; height is the perpendicular gap */
      const b1 = Number(opts.w) > 0 ? Number(opts.w) : 4;
      const b2 = Number(opts.b2) > 0 ? Number(opts.b2) : 9;
      const hh = Number(opts.hh) > 0 ? Number(opts.hh) : 4;
      const k = Math.min(320 / Math.max(b1, b2), 150 / hh);
      const t = b1 * k, bot2 = b2 * k, h = hh * k;
      const x0 = cx - bot2 / 2, y0 = cy - h / 2;
      pts = [[x0 + (bot2 - t) / 2, y0], [x0 + (bot2 + t) / 2, y0], [x0 + bot2, y0 + h], [x0, y0 + h]];
      opts._altitude = { x: x0 + bot2 / 2, y0: y0 + h, y1: y0, base: b2, height: hh, x0: x0, x1: x0 + bot2, yb: y0 + h, top: b1 };
    } else if (kind === 'regular') {
      const n = opts.n || 6, r = 130;
      for (let k = 0; k < n; k += 1) {
        const a = (-90 + (360 / n) * k) * Math.PI / 180;
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
    } else if (kind === 'triangle' && Number(opts.base) > 0 && Number(opts.height) > 0) {
      /* A triangle given as base + height. The two numbers are DIFFERENT quantities — the base is an edge,
         the height is the perpendicular gap to the opposite vertex — so they are not drawn as two sides.
         One scale for both axes, so the drawn base : height ratio equals the labelled one. */
      const b = Number(opts.base), h2 = Number(opts.height);
      const k = Math.min(300 / b, 170 / h2);
      const bw = b * k, hh = h2 * k;
      const x0 = cx - bw / 2, yb = cy + 92;
      pts = [[x0, yb], [x0 + bw, yb], [x0 + bw * 0.62, yb - hh]];
      opts._altitude = { x: x0 + bw * 0.62, y0: yb, y1: yb - hh, base: b, height: h2, x0: x0, x1: x0 + bw, yb: yb };
    } else if (opts.sides && opts.sides.length === 3 && opts.sides.every((n) => Number(n) > 0)) {
      /* build a REAL triangle from the three side lengths, so the picture and the labels agree.
         Sides go round as A-B (bottom), B-C (right), C-A (left) — the same order the labels are drawn in.
         Work in model units first, then scale once and centre: mixing scaled and unscaled lengths is
         what produces a shape whose sides contradict its own numbers. */
      const [ab, bc, ca] = opts.sides.map(Number);
      const mx = [0, ab];                       /* A, B on the base */
      const cX = (ca * ca - bc * bc + ab * ab) / (2 * ab);
      const cY = -Math.sqrt(Math.max(0, ca * ca - cX * cX));
      const model = [[mx[0], 0], [mx[1], 0], [cX, cY]];
      const w = Math.max(...model.map((p) => p[0])) - Math.min(...model.map((p) => p[0]));
      const h = Math.max(...model.map((p) => p[1])) - Math.min(...model.map((p) => p[1]));
      /* fit inside the panel without distorted proportions — one scale for both axes */
      const k = Math.min(300 / (w || 1), 190 / (h || 1));
      const midX = (Math.max(...model.map((p) => p[0])) + Math.min(...model.map((p) => p[0]))) / 2;
      const midY = (Math.max(...model.map((p) => p[1])) + Math.min(...model.map((p) => p[1]))) / 2;
      pts = model.map(([x, y]) => [cx + (x - midX) * k, cy + (y - midY) * k]);
    } else {
      /* a scalene triangle that stays pleasant to look at */
      pts = [[cx - 130, cy + 90], [cx + 150, cy + 90], [cx - 20, cy - 110]];
    }
    body += `<path d="M${pts.map((p) => p.join(' ')).join('L')}Z" fill="${A}" fill-opacity="0.55" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    if (opts._altitude) {
      const al = opts._altitude;
      body += `<line x1="${al.x}" y1="${al.y0}" x2="${al.x}" y2="${al.y1}" stroke="${WARM}" stroke-width="2.4" stroke-dasharray="7 5"/>`;
      /* right-angle mark where the altitude meets the base */
      body += `<path d="M${al.x} ${al.y0 - 16}h16v16" fill="none" stroke="${WARM}" stroke-width="2.2"/>`;
      body += label(String(al.height), al.x + 20, (al.y0 + al.y1) / 2 + 5, 16, WARM);
      body += label(String(al.base), (al.x0 + al.x1) / 2, al.yb + 30, 16, '#41525f');
      body += label('height', al.x + 22, (al.y0 + al.y1) / 2 + 24, 12, WARM);
      body += label('base', (al.x0 + al.x1) / 2, al.yb + 48, 12, '#5b6b7a');
    }
    /* side labels, offset outward from the centroid */
    pts.forEach((p, k) => {
      const q = pts[(k + 1) % pts.length];
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
      const lx = mx + (dx / d) * 26, ly = my + (dy / d) * 22;
      if (names[k] != null && names[k] !== '') body += label(String(names[k]), lx, ly + 5, 15, '#41525f');
    });
    pts.forEach((p, k) => {
      body += label(String.fromCharCode(65 + k), p[0], p[1] - 12, 14, BRAND);
    });
    (opts.angles || []).forEach((a) => {
      const p = pts[a.at];
      body += `<path d="M${p[0] - 22} ${p[1] + 12}a26 26 0 0 1 32 4" fill="none" stroke="${WARM}" stroke-width="2.4"/>`;
      if (a.text) body += label(a.text, p[0] + 6, p[1] + 34, 13, WARM);
    });
    if (opts.caption) body += label(opts.caption, W / 2, H - 18, 14, '#5b6b7a');
    return wrap(W, H, opts.label || `a ${kind} with its side lengths marked`, body, opts.max);
  }

  /* ── dotPlot: a dot plot of a small data set, for mean / median / MAD ───────────────────────────
     opts.vals = [numbers]. The dots are drawn; the mean is never printed. */
  function dotPlot(vals, opts) {
    opts = opts || {};
    const vals2 = vals.slice().sort((x, y) => x - y);
    const lo = Math.min.apply(null, vals2), hi = Math.max.apply(null, vals2);
    const W = 600, H = opts.h || 240;
    const ox = 60, span = W - 120, y = H - 70;
    const steps = Math.max(1, hi - lo);
    const step = span / steps;
    const X = (v) => ox + (v - lo) * step;
    const counts = {};
    vals2.forEach((v) => { counts[v] = (counts[v] || 0) + 1; });
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<line x1="${ox - 18}" y1="${y}" x2="${ox + span + 18}" y2="${y}" stroke="${INK}" stroke-width="2.6"/>`;
    for (let v = lo; v <= hi; v += 1) {
      body += `<line x1="${X(v)}" y1="${y - 6}" x2="${X(v)}" y2="${y + 6}" stroke="${INK}" stroke-width="2"/>`;
      body += label(String(v), X(v), y + 26, 13, '#41525f');
    }
    Object.keys(counts).forEach((k) => {
      const v = Number(k);
      for (let h2 = 0; h2 < counts[k]; h2 += 1) {
        body += `<circle cx="${X(v)}" cy="${y - 16 - h2 * 26}" r="10" fill="${opts.dot || BRAND}" stroke="${INK}" stroke-width="1.8"/>`;
      }
    });
    if (opts.caption) body += label(opts.caption, W / 2, 36, 15, INK);
    return wrap(W, H, opts.label || `a dot plot of ${vals2.length} values`, body, opts.max);
  }

  /* ── barModel6: a solved-example bar model used in the representational step ─────────────────────
     opts.segs = [{n, label, fill}]. Draws equal cells with a total bracket underneath. */
  function barModel6(segs, opts) {
    opts = opts || {};
    const total = segs.reduce((s, x) => s + x.n, 0);
    const W = 600, H = opts.h || 220;
    const cw = Math.min(60, 470 / Math.max(1, total));
    const ox = (W - cw * total) / 2;
    let body = blank(W, H, opts.fill || '#fbfdff');
    let x = ox;
    const segSpans = [];
    segs.forEach((s) => {
      const x0 = x;
      for (let k = 0; k < s.n; k += 1) {
        body += `<rect x="${x}" y="54" width="${cw}" height="46" rx="4" fill="${s.fill || A}" stroke="${INK}" stroke-width="1.8"/>`;
        x += cw;
      }
      segSpans.push({ x0, x1: x, label: s.label });
    });
    body += `<rect x="${ox}" y="54" width="${cw * total}" height="46" rx="6" fill="none" stroke="${INK}" stroke-width="2.8"/>`;
    /* one bracket per segment, so a 4 : 3 split is visibly 4 cells and 3 cells and not just two words */
    segSpans.forEach((sp) => {
      body += `<path d="M${sp.x0 + 2} 110v9h${sp.x1 - sp.x0 - 4}v-9" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
      body += label(sp.label || '', (sp.x0 + sp.x1) / 2, 140, 14, '#41525f');
    });
    const by = 166;
    body += `<path d="M${ox} ${by - 9}v9h${cw * total}v-9" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`;
    if (opts.totalLabel) body += label(opts.totalLabel, ox + (cw * total) / 2, by + 26, 15, INK);
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 14, '#5b6b7a');
    return wrap(W, H, opts.label || `a bar model of ${total} equal parts`, body, opts.max);
  }

  return { tapeStrip, ratioTable, doubleLine, unitRateCart, fitModel, integerLine, balance,
    polygon, dotPlot, barModel6, wrap, label };
})();

/* scenes-7.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   SCENES7 — the Grade 7 picture library (proportional relationships, signed numbers, circles, angles)

   Same rules as scenes.js … scenes-6.js: a picture is generated from the numbers the question is about,
   and it never prints a value the child is meant to work out. The graph shows the plotted points, not the
   constant of proportionality; the number line shows the two positions, not the distance between them.

   NOTE — no generic top-level name lives here: this file declares only SCENE7, because a grade-7 source
   file may declare its own `UNITS` or `K`.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE7 = (() => {
  const INK = '#26303f', PAPER = '#fffdf6', BRAND = '#35507a';
  const A = '#9dc0e6', B = '#f2cb96', A2 = '#5f8cbe', B2 = '#d7a45f';
  const GRID = '#c6d0dc', SHADE = '#3f6aa8', WARM = '#b23b2e', GOOD = '#2f7d64';

  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (t, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}"${extra || ''}>${t}</text>`;
  const txt = (t, x, y, size, color, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-size="${size || 15}" font-weight="700" fill="${color || INK}">${t}</text>`;

  /* ── proportionGraph: points on a coordinate plane, and whether they lie on one line through (0,0) ──
     opts.points = [[x,y], …]. The line is drawn ONLY when opts.showLine is true, and never with k printed.
     opts.askK highlights the point (1, k) with a dashed drop so the child reads k off the graph. */
  function proportionGraph(points, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 340;
    const pad = 56;
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const maxX = Math.max(opts.maxX || 0, ...xs, 1), maxY = Math.max(opts.maxY || 0, ...ys, 1);
    /* round the axis up to a tidy step so the ticks are readable */
    const stepX = Math.max(1, Math.ceil(maxX / 8)), stepY = Math.max(1, Math.ceil(maxY / 8));
    const spanX = stepX * Math.ceil(maxX / stepX), spanY = stepY * Math.ceil(maxY / stepY);
    const x0 = pad, y0 = H - pad;
    const px = (v) => x0 + (v / spanX) * (W - pad - x0);
    const py = (v) => y0 - (v / spanY) * (y0 - pad);
    let body = blank(W, H, opts.fill || '#fbfdff');
    /* grid */
    for (let v = 0; v <= spanX; v += stepX) {
      body += `<line x1="${px(v)}" y1="${y0}" x2="${px(v)}" y2="${pad}" stroke="${GRID}" stroke-width="1.1"/>`;
    }
    for (let v = 0; v <= spanY; v += stepY) {
      body += `<line x1="${x0}" y1="${py(v)}" x2="${px(spanX)}" y2="${py(v)}" stroke="${GRID}" stroke-width="1.1"/>`;
    }
    body += `<line x1="${x0}" y1="${y0}" x2="${px(spanX) + 14}" y2="${y0}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${pad - 14}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${px(spanX) + 14} ${y0}l-9-4v8Z" fill="${INK}"/>`;
    body += `<path d="M${x0} ${pad - 14}l-4 9h8Z" fill="${INK}"/>`;
    for (let v = 0; v <= spanX; v += stepX) body += label(String(v), px(v), y0 + 24, 13, '#54636f');
    for (let v = stepY; v <= spanY; v += stepY) body += label(String(v), x0 - 16, py(v) + 4, 13, '#54636f');
    body += txt(opts.xName || 'x', W - pad + 6, H - pad + 26, 14, BRAND);
    body += txt(opts.yName || 'y', x0 - 40, pad + 4, 14, BRAND);
    /* the line, when the relationship really is proportional */
    if (opts.showLine) {
      body += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(spanX)}" y2="${py((spanY / spanX) * spanX)}" stroke="${SHADE}" stroke-width="2.6" opacity=".55" stroke-dasharray="8 5"/>`;
    }
    /* the points, and a cross for any pair that is NOT on the line */
    points.forEach((p, k) => {
      const on = opts.offLine && opts.offLine.indexOf(k) >= 0;
      body += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="8.5" fill="${on ? WARM : SHADE}" stroke="${INK}" stroke-width="2"/>`;
      if (on) body += label('✕', px(p[0]), py(p[1]) - 16, 15, WARM);
    });
    if (opts.askK) {
      const q = opts.askK;
      body += `<line x1="${px(q[0])}" y1="${py(q[1])}" x2="${px(q[0])}" y2="${y0}" stroke="${WARM}" stroke-width="2" stroke-dasharray="6 4"/>`;
      body += `<line x1="${px(q[0])}" y1="${py(q[1])}" x2="${x0}" y2="${py(q[1])}" stroke="${WARM}" stroke-width="2" stroke-dasharray="6 4"/>`;
      body += label(`(${q[0]}, ${q[1]})`, px(q[0]) + 34, py(q[1]) - 12, 14, WARM);
    }
    if (opts.caption) body += label(opts.caption, W / 2, 30, 16, INK);
    return wrap(W, H, opts.label || `a graph of ${points.length} plotted points`, body, opts.max);
  }

  /* ── signedLine: a horizontal number line for signed arithmetic, with hop arcs ───────────────────
     opts.from/to bound the axis. opts.start = where the hop begins; opts.hop = signed length of the arc.
     opts.marks = [{v, fill, name}] to pin values. The RESULT is never printed — only the hop is drawn. */
  function signedLine(from, to, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 190;
    const oy = 100, span = W - 120, ox = 60;
    const step = span / Math.max(1, to - from);
    const X = (v) => ox + (v - from) * step;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<line x1="${ox - 20}" y1="${oy}" x2="${ox + span + 20}" y2="${oy}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${ox + span + 26} ${oy}l-10-4.5v9Z" fill="${INK}"/>`;
    body += `<path d="M${ox - 26} ${oy}l10-4.5v9Z" fill="${INK}"/>`;
    for (let v = from; v <= to; v += 1) {
      body += `<line x1="${X(v)}" y1="${oy - 7}" x2="${X(v)}" y2="${oy + 7}" stroke="${INK}" stroke-width="2"/>`;
      body += label(String(v), X(v), oy + 30, 13, '#54636f');
    }
    /* the hop: an arc from start to start+hop, with the arrow head at the landing point */
    if (opts.hop != null && opts.start != null) {
      const a = X(opts.start), b = X(opts.start + opts.hop);
      const lift = Math.min(62, 18 + Math.abs(opts.hop) * 7);
      const mid = (a + b) / 2, up = oy - lift;
      const dir = b > a ? 1 : -1;
      body += `<path d="M${a} ${oy - 6}Q${mid} ${up} ${b} ${oy - 6}" fill="none" stroke="${opts.hopColor || WARM}" stroke-width="2.8" stroke-linecap="round"/>`;
      body += `<path d="M${b} ${oy - 4}l${-8 * dir} ${-2}l${2 * dir} 8Z" fill="${opts.hopColor || WARM}"/>`;
      body += label(opts.hopName != null ? opts.hopName : (opts.hop > 0 ? `+${opts.hop}` : String(opts.hop)), mid, up - 8, 16, opts.hopColor || WARM);
    }
    (opts.marks || []).forEach((m) => {
      body += `<circle cx="${X(m.v)}" cy="${oy}" r="8" fill="${m.fill || A}" stroke="${INK}" stroke-width="2.2"/>`;
      if (m.name) body += label(m.name, X(m.v), oy - 20, 14, INK);
    });
    if (opts.start != null && opts.showStart !== false) {
      body += `<circle cx="${X(opts.start)}" cy="${oy}" r="8" fill="${B}" stroke="${INK}" stroke-width="2.2"/>`;
    }
    if (opts.caption) body += label(opts.caption, W / 2, 30, 16, INK);
    return wrap(W, H, opts.label || 'a number line with one signed hop', body, opts.max);
  }

  /* ── circleFig: radius / diameter / circumference / area, drawn to the radius given ───────────────
     opts.r = radius (any unit). opts.show = 'r' | 'd' | 'arc' | 'sector' | 'none'.
     opts.sweep = degrees of the drawn sector. Nothing is ever printed except the numbers passed in. */
  function circleFig(opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 320;
    const r = Math.min(118, 210 / Math.max(1, Number(opts.r) || 1) * (Number(opts.r) || 1) / Math.max(1, Number(opts.r) || 1));
    const R = opts.px || Math.min(116, 300 / Math.max(1, (Number(opts.r) || 1)));
    const cx = W / 2, cy = H / 2 + 6;
    let body = blank(W, H, opts.fill || '#fbfdff');
    if (opts.show === 'sector') {
      const deg = Number(opts.sweep) || 90;
      const a0 = -Math.PI / 2, a1 = a0 + (deg * Math.PI) / 180;
      const x1 = cx + R * Math.cos(a0), y1 = cy + R * Math.sin(a0);
      const x2 = cx + R * Math.cos(a1), y2 = cy + R * Math.sin(a1);
      const large = deg > 180 ? 1 : 0;
      body += `<path d="M${cx} ${cy}L${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}Z" fill="${A}" fill-opacity=".6" stroke="${INK}" stroke-width="2.4"/>`;
    }
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${opts.show === 'sector' ? 'none' : A}" fill-opacity=".28" stroke="${INK}" stroke-width="2.8"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="3.6" fill="${INK}"/>`;
    if (opts.show === 'r' || opts.show === 'd') {
      const ang = opts.show === 'd' ? Math.PI : -Math.PI / 4;
      const ex = cx + R * Math.cos(ang), ey = cy + R * Math.sin(ang);
      body += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${WARM}" stroke-width="2.6"/>`;
      if (opts.show === 'd') {
        const fx = cx - R * Math.cos(ang), fy = cy - R * Math.sin(ang);
        body += `<line x1="${cx}" y1="${cy}" x2="${fx}" y2="${fy}" stroke="${WARM}" stroke-width="2.6"/>`;
        body += label(opts.dLabel || 'diameter', cx, cy - 10, 15, WARM);
      } else {
        body += label(opts.rLabel || 'radius', cx + R * 0.42, cy - 14, 15, WARM);
      }
    }
    if (opts.show === 'arc') {
      const a0 = -Math.PI * 0.86, a1 = -Math.PI * 0.14;
      const x1 = cx + R * Math.cos(a0), y1 = cy + R * Math.sin(a0);
      const x2 = cx + R * Math.cos(a1), y2 = cy + R * Math.sin(a1);
      body += `<path d="M${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${GOOD}" stroke-width="4.4" stroke-linecap="round"/>`;
      body += label(opts.arcLabel || 'circumference', cx, cy - R - 16, 15, GOOD);
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#54636f');
    return wrap(W, H, opts.label || 'a circle with one measurement marked', body, opts.max);
  }

  /* ── anglePair: two angles that share a vertex — complementary, supplementary or vertical ─────────
     opts.kind = 'supp' | 'comp' | 'vert'. opts.known = the angle printed; the other is marked x or ?.
     The unknown is ALWAYS drawn as an arc with "?" — never as a number. */
  function anglePair(opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 300;
    const cx = W / 2 - 40, cy = H / 2 + 40;
    const L = 190;
    let body = blank(W, H, opts.fill || '#fbfdff');
    const known = Number(opts.known) || 45;
    const rad = (d) => (d * Math.PI) / 180;
    const P = (deg, len) => [cx + (len || L) * Math.cos(rad(deg)), cy - (len || L) * Math.sin(rad(deg))];
    const ray = (deg, color) => {
      const p = P(deg);
      return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="${color || INK}" stroke-width="2.8" stroke-linecap="round"/>`;
    };
    const arc = (a0, a1, rr, color) => {
      const p0 = P(a0, rr), p1 = P(a1, rr);
      const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
      const sweep = a1 > a0 ? 0 : 1;
      return `<path d="M${p0[0]} ${p0[1]}A${rr} ${rr} 0 ${large} ${sweep} ${p1[0]} ${p1[1]}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
    };
    if (opts.kind === 'vert') {
      body += ray(30, INK) + ray(210, INK) + ray(120, SHADE) + ray(300, SHADE);
      body += arc(120, 210, 54, WARM) + arc(300, 390, 54, WARM);
      body += label(String(known), ...P(165, 78).map((v, i) => (i ? v : v)), 15, WARM);
      body += label('?', ...P(345, 78), 18, SHADE);
    } else if (opts.kind === 'comp') {
      body += ray(0, INK) + ray(90, INK) + ray(known, SHADE);
      body += arc(known, 90, 52, WARM);
      body += label(`${known}°`, ...P(known / 2, 74), 15, WARM);
      body += arc(0, known, 74, SHADE);
      body += label('?', ...P(known / 2, 96), 18, SHADE);
      body += `<path d="M${cx + 16} ${cy}h14v-14" fill="none" stroke="${INK}" stroke-width="2.2"/>`;
    } else {
      /* supplementary: two angles on a straight line */
      body += ray(180, INK) + ray(0, INK) + ray(known, SHADE);
      body += arc(0, known, 74, SHADE);
      body += label(`${known}°`, ...P(known / 2, 96), 15, SHADE);
      body += arc(known, 180, 52, WARM);
      body += label('?', ...P((known + 180) / 2, 74), 18, WARM);
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#54636f');
    return wrap(W, H, opts.label || 'a pair of angles with one unknown', body, opts.max);
  }

  /* ── tablePairs: a two-row table with one blank cell, for testing proportionality from a table ────
     opts.a / opts.b are the row values; opts.askCol highlights the cell to fill with a dashed box. */
  function tablePairs(a, b, opts) {
    opts = opts || {};
    const cols = Math.max(a.length, b.length);
    const cw = Math.min(cols <= 2 ? 150 : 92, 460 / cols), ch = 44;
    const W = 600, H = opts.h || 130 + ch * 2;
    const ox = (W - cw * cols) / 2, oy = 44;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += txt(opts.rowA || 'x', ox - 14, oy + 30, 14, '#41525f', 'end');
    body += txt(opts.rowB || 'y', ox - 14, oy + ch + 30, 14, '#41525f', 'end');
    for (let k = 0; k < cols; k += 1) {
      const x = ox + k * cw;
      const ask = opts.askCol === k;
      const top = a[k] == null ? '?' : a[k];
      const bot = b[k] == null ? '?' : b[k];
      body += `<rect x="${x}" y="${oy}" width="${cw}" height="${ch}" fill="${ask ? '#fff3d6' : (k % 2 ? '#ffffff' : '#f3f7fb')}" stroke="${GRID}" stroke-width="1.6"/>`;
      body += `<rect x="${x}" y="${oy + ch}" width="${cw}" height="${ch}" fill="${ask ? '#fff3d6' : (k % 2 ? '#f3f7fb' : '#ffffff')}" stroke="${GRID}" stroke-width="1.6"/>`;
      body += label(String(top), x + cw / 2, oy + 30, 17, INK);
      body += label(String(bot), x + cw / 2, oy + ch + 30, 17, INK);
      if (ask) body += `<rect x="${x - 2}" y="${oy - 2}" width="${cw + 4}" height="${ch * 2 + 4}" rx="6" fill="none" stroke="${WARM}" stroke-width="2.6" stroke-dasharray="6 4"/>`;
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 18, 14, '#5b6b7a');
    return wrap(W, H, opts.label || 'a table of paired values', body, opts.max);
  }

  /* ── priceStack: a marked price with one or more discounts applied in sequence ────────────────────
     opts.steps = [{label, pct}]; drawn as stacked bars, each open at the bottom. The final price is
     NEVER printed — the child must compute the chain. */
  function priceStack(opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 300;
    const steps = opts.steps || [];
    let body = blank(W, H, opts.fill || '#fbfdff');
    const bx = 120, bw = 340, top = 66;
    const rowH = Math.min(64, 190 / Math.max(1, steps.length));
    body += txt(opts.startLabel || 'marked price', bx - 14, top + rowH / 2 + 6, 14, '#41525f', 'end');
    body += `<rect x="${bx}" y="${top}" width="${bw}" height="${rowH - 8}" rx="6" fill="${A}" stroke="${INK}" stroke-width="2.4"/>`;
    steps.forEach((s, k) => {
      const y = top + (k + 1) * rowH;
      const shrink = bw * (1 - Math.pow(1 - (Number(s.pct) || 0) / 100, 1));
      body += txt(s.label, bx - 14, y + rowH / 2, 14, '#41525f', 'end');
      body += `<rect x="${bx}" y="${y}" width="${bw}" height="${rowH - 12}" rx="6" fill="${k === 0 ? B : B2}" fill-opacity=".55" stroke="${GRID}" stroke-width="2" stroke-dasharray="7 5"/>`;
      body += `<rect x="${bx}" y="${y}" width="${Math.max(20, bw - shrink)}" height="${rowH - 12}" rx="6" fill="${k === 0 ? B : B2}" stroke="${INK}" stroke-width="2.2"/>`;
      body += label(`−${s.pct}%`, bx + bw + 30, y + rowH / 2, 15, WARM);
      body += `<path d="M${bx - 6} ${top + (k + 1) * rowH - rowH / 2}l-12 6 12 6Z" fill="${WARM}"/>`;
    });
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#5b6b7a');
    return wrap(W, H, opts.label || 'a price with successive discounts', body, opts.max);
  }

  /* ── wrap / label re-exported for source files that build their own tiny figures ───────────────── */
  return { proportionGraph, signedLine, circleFig, anglePair, tablePairs, priceStack, wrap, label };
})();

/* scenes-8.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   SCENES8 — the Grade 8 picture library (lines, slope triangles, right triangles, plotted distance)

   Same rule as the earlier libraries: a figure is generated from the numbers the question is about, and
   it never prints a value the child is meant to work out. A slope triangle shows the two legs but not the
   quotient; a right triangle labels the legs but leaves the hypotenuse as "?"; two plotted points show
   the dashed legs but not the distance.

   NOTE — no generic top-level name lives here: this file declares only SCENE8.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE8 = (() => {
  const INK = '#26303f', PAPER = '#fffdf6', BRAND = '#35507a';
  const A = '#9dc0e6', B = '#f2cb96', A2 = '#5f8cbe', B2 = '#d7a45f';
  const GRID = '#c6d0dc', SHADE = '#3f6aa8', WARM = '#b23b2e', GOOD = '#2f7d64';

  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (t, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 15}" font-weight="800" fill="${color || INK}"${extra || ''}>${t}</text>`;
  const txt = (t, x, y, size, color, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-size="${size || 14}" font-weight="700" fill="${color || INK}">${t}</text>`;

  /* ── a coordinate plane with the four axes, tidied to whole steps ─────────────────────────────────
     Returns { px, py, body, W, H } so the callers below can draw on the same frame. */
  function plane(opts) {
    opts = opts || {};
    const W = opts.W || 600, H = opts.H || 360, pad = 52;
    const xmin = opts.xmin != null ? opts.xmin : 0, xmax = opts.xmax != null ? opts.xmax : 8;
    const ymin = opts.ymin != null ? opts.ymin : 0, ymax = opts.ymax != null ? opts.ymax : 10;
    const boxL = pad, boxR = W - pad, boxT = pad - 14, boxB = H - pad;
    const sx = (boxR - boxL) / (xmax - xmin), sy = (boxB - boxT) / (ymax - ymin);
    const px = (x) => boxL + (x - xmin) * sx;
    const py = (y) => boxB - (y - ymin) * sy;
    let body = blank(W, H, opts.fill || '#fbfdff');
    const stepX = Math.max(1, Math.ceil((xmax - xmin) / 10));
    const stepY = Math.max(1, Math.ceil((ymax - ymin) / 9));
    for (let v = Math.ceil(xmin / stepX) * stepX; v <= xmax; v += stepX) {
      body += `<line x1="${px(v)}" y1="${py(ymin)}" x2="${px(v)}" y2="${py(ymax)}" stroke="${GRID}" stroke-width="1.1"/>`;
    }
    for (let v = Math.ceil(ymin / stepY) * stepY; v <= ymax; v += stepY) {
      body += `<line x1="${px(xmin)}" y1="${py(v)}" x2="${px(xmax)}" y2="${py(v)}" stroke="${GRID}" stroke-width="1.1"/>`;
    }
    /* the two axes, wherever zero actually falls */
    const ax = Math.min(Math.max(0, xmin), xmax), ay = Math.min(Math.max(0, ymin), ymax);
    body += `<line x1="${px(xmin)}" y1="${py(ay)}" x2="${px(xmax) + 12}" y2="${py(ay)}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<line x1="${px(ax)}" y1="${py(ymin)}" x2="${px(ax)}" y2="${py(ymax) - 12}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${px(xmax) + 12} ${py(ay)}l-9-4v8Z" fill="${INK}"/>`;
    body += `<path d="M${px(ax)} ${py(ymax) - 12}l-4 9h8Z" fill="${INK}"/>`;
    for (let v = Math.ceil(xmin / stepX) * stepX; v <= xmax; v += stepX) {
      if (v !== 0) body += label(String(v), px(v), py(ay) + 20, 12, '#54636f');
    }
    for (let v = Math.ceil(ymin / stepY) * stepY; v <= ymax; v += stepY) {
      if (v !== 0) body += label(String(v), px(ax) - 15, py(v) + 4, 12, '#54636f');
    }
    body += txt(opts.xName || 'x', px(xmax) + 4, py(ay) + 36, 13, BRAND);
    body += txt(opts.yName || 'y', px(ax) - 34, py(ymax) + 10, 13, BRAND);
    return { px, py, body, W, H, sx, sy, xmin, xmax, ymin, ymax };
  }

  /* ── slopeLine: one straight line with its slope triangle ────────────────────────────────────────
     opts.m, opts.b; opts.tri = [x1, x2] draws a right triangle between the two points on the line.
     The run and the rise are labelled as lengths; the quotient is never printed. */
  function slopeLine(opts) {
    opts = opts || {};
    const m = Number(opts.m) || 1, b = Number(opts.b) || 0;
    const P = plane(Object.assign({}, opts, {
      xmin: opts.xmin != null ? opts.xmin : 0,
      xmax: opts.xmax != null ? opts.xmax : 8,
      ymin: opts.ymin != null ? opts.ymin : Math.min(0, b),
      ymax: opts.ymax != null ? opts.ymax : Math.max(m * 8 + b, b + 2),
    }));
    let body = P.body;
    const x0 = P.xmin, x1 = P.xmax;
    body += `<line x1="${P.px(x0)}" y1="${P.py(m * x0 + b)}" x2="${P.px(x1)}" y2="${P.py(m * x1 + b)}" stroke="${SHADE}" stroke-width="3.2" stroke-linecap="round"/>`;
    /* the intercept, always marked: it is the thing the child reads off */
    if (opts.showB !== false) {
      body += `<circle cx="${P.px(0)}" cy="${P.py(b)}" r="7" fill="${WARM}" stroke="${INK}" stroke-width="2"/>`;
      body += label(`(0, ${opts.bLabel != null ? opts.bLabel : b})`, P.px(0) + 44, P.py(b) - 12, 13, WARM);
    }
    if (opts.tri) {
      const [t1, t2] = opts.tri;
      const y1 = m * t1 + b, y2 = m * t2 + b;
      body += `<line x1="${P.px(t1)}" y1="${P.py(y1)}" x2="${P.px(t2)}" y2="${P.py(y1)}" stroke="${GOOD}" stroke-width="2.6" stroke-dasharray="7 5"/>`;
      body += `<line x1="${P.px(t2)}" y1="${P.py(y1)}" x2="${P.px(t2)}" y2="${P.py(y2)}" stroke="${GOOD}" stroke-width="2.6" stroke-dasharray="7 5"/>`;
      body += `<circle cx="${P.px(t1)}" cy="${P.py(y1)}" r="6.5" fill="${GOOD}" stroke="${INK}" stroke-width="1.8"/>`;
      body += `<circle cx="${P.px(t2)}" cy="${P.py(y2)}" r="6.5" fill="${GOOD}" stroke="${INK}" stroke-width="1.8"/>`;
      if (opts.runLabel !== false) body += label(`run ${t2 - t1}`, (P.px(t1) + P.px(t2)) / 2, P.py(y1) + 22, 13, GOOD);
      if (opts.riseLabel !== false) body += label(`rise ${y2 - y1}`, P.px(t2) + 46, (P.py(y1) + P.py(y2)) / 2, 13, GOOD);
    }
    if (opts.caption) body += label(opts.caption, P.W / 2, 26, 15, INK);
    return wrap(P.W, P.H, opts.label || 'a straight line on a coordinate plane', body, opts.max);
  }

  /* ── twoLines: two straight lines and the point where they meet ─────────────────────────────────
     opts.a = {m, b}, opts.b = {m, b}. The crossing point is marked with a ring, never with its value. */
  function twoLines(opts) {
    opts = opts || {};
    const A1 = opts.a || { m: 1, b: 0 }, B1 = opts.b || { m: 0.5, b: 3 };
    const xmax = opts.xmax != null ? opts.xmax : 10;
    const yTop = Math.max(A1.m * xmax + A1.b, B1.m * xmax + B1.b) + 1;
    const P = plane(Object.assign({}, opts, { xmin: 0, xmax, ymin: 0, ymax: opts.ymax != null ? opts.ymax : yTop }));
    let body = P.body;
    const draw = (L, color, name) => {
      let g = '';
      g += `<line x1="${P.px(0)}" y1="${P.py(L.b)}" x2="${P.px(xmax)}" y2="${P.py(L.m * xmax + L.b)}" stroke="${color}" stroke-width="3.2" stroke-linecap="round"/>`;
      if (name) {
        const lx = xmax * 0.88, ly = L.m * lx + L.b;
        g += `<rect x="${P.px(lx) - 46}" y="${P.py(ly) - 30}" width="92" height="22" rx="6" fill="#fff" fill-opacity=".82"/>`;
        g += txt(name, P.px(lx) - 44, P.py(ly) - 13, 13, color);
      }
      return g;
    };
    body += draw(A1, SHADE, opts.aName);
    body += draw(B1, WARM, opts.bName);
    /* the intersection, drawn from the two equations themselves */
    if (A1.m !== B1.m) {
      const xi = (B1.b - A1.b) / (A1.m - B1.m);
      const yi = A1.m * xi + A1.b;
      if (xi >= 0 && xi <= xmax) {
        body += `<circle cx="${P.px(xi)}" cy="${P.py(yi)}" r="9" fill="none" stroke="${INK}" stroke-width="3"/>`;
        body += `<circle cx="${P.px(xi)}" cy="${P.py(yi)}" r="3.5" fill="${INK}"/>`;
        body += txt(opts.markLabel || 'meeting point', P.px(xi) + 15, P.py(yi) - 14, 13, INK);
      }
    }
    if (opts.caption) body += label(opts.caption, P.W / 2, 26, 15, INK);
    return wrap(P.W, P.H, opts.label || 'two straight lines and their meeting point', body, opts.max);
  }

  /* ── rightTri: a right triangle with its legs given and the hypotenuse as "?" (or the reverse) ──
     opts.a / opts.b are the legs, opts.hyp is the hypotenuse when it is the known one. Labels are
     printed for what is GIVEN only; the unknown is always "?". */
  function rightTri(opts) {
    opts = opts || {};
    const a = Number(opts.a) || 3, b = Number(opts.b) || 4;
    const W = 560, H = opts.h || 330;
    const ox = 120, oy = H - 78;
    const k = Math.min(300 / a, 190 / b);
    const ax = a * k, bx = b * k;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<path d="M${ox} ${oy} L${ox + ax} ${oy} L${ox + ax} ${oy - bx} Z" fill="${A}" fill-opacity=".45" stroke="${INK}" stroke-width="2.8" stroke-linejoin="round"/>`;
    /* the right-angle marker */
    body += `<path d="M${ox + ax - 20} ${oy}v-20h20" fill="none" stroke="${INK}" stroke-width="2.2"/>`;
    if (!opts.hypKnown) {
      body += label(String(a), ox + ax / 2, oy + 26, 16, INK);
      body += label(String(b), ox + ax + 30, oy - bx / 2, 16, INK);
      body += label('?', ox + ax / 2 - 14, oy - bx / 2 + 6, 20, WARM);
    } else {
      body += label(opts.aLabel || String(a), ox + ax / 2, oy + 26, 16, INK);
      body += label('?', ox + ax + 26, oy - bx / 2, 20, WARM);
      const c = Math.sqrt(a * a + b * b);
      body += label(opts.hypLabel || String(opts.hyp || c), ox + ax / 2 - 30, oy - bx / 2 + 4, 16, INK);
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 20, 14, '#54636f');
    return wrap(W, H, opts.label || 'a right triangle with one side unknown', body, opts.max);
  }

  /* ── pointsDist: two points with the two dashed legs, for distance in the plane ──────────────── */
  function pointsDist(p, q, opts) {
    opts = opts || {};
    const P = plane(Object.assign({
      xmin: Math.min(0, p[0] - 1, q[0] - 1),
      xmax: Math.max(p[0], q[0]) + 1,
      ymin: Math.min(0, p[1] - 1, q[1] - 1),
      ymax: Math.max(p[1], q[1]) + 1,
    }, opts));
    let body = P.body;
    /* the right triangle the two points make with the axes */
    body += `<line x1="${P.px(p[0])}" y1="${P.py(p[1])}" x2="${P.px(q[0])}" y2="${P.py(p[1])}" stroke="${GOOD}" stroke-width="2.4" stroke-dasharray="7 5"/>`;
    body += `<line x1="${P.px(q[0])}" y1="${P.py(p[1])}" x2="${P.px(q[0])}" y2="${P.py(q[1])}" stroke="${GOOD}" stroke-width="2.4" stroke-dasharray="7 5"/>`;
    body += `<line x1="${P.px(p[0])}" y1="${P.py(p[1])}" x2="${P.px(q[0])}" y2="${P.py(q[1])}" stroke="${WARM}" stroke-width="3.2" stroke-linecap="round"/>`;
    body += `<circle cx="${P.px(p[0])}" cy="${P.py(p[1])}" r="8" fill="${SHADE}" stroke="${INK}" stroke-width="2"/>`;
    body += `<circle cx="${P.px(q[0])}" cy="${P.py(q[1])}" r="8" fill="${B2}" stroke="${INK}" stroke-width="2"/>`;
    body += txt(opts.pLabel || `(${p[0]}, ${p[1]})`, P.px(p[0]) - 8, P.py(p[1]) - 16, 13, SHADE, 'end');
    body += txt(opts.qLabel || `(${q[0]}, ${q[1]})`, P.px(q[0]) + 10, P.py(q[1]) - 14, 13, WARM);
    if (opts.legs !== false) {
      body += label(String(Math.abs(q[0] - p[0])), (P.px(p[0]) + P.px(q[0])) / 2, P.py(p[1]) + 20, 13, GOOD);
      body += label(String(Math.abs(q[1] - p[1])), P.px(q[0]) + 20, (P.py(p[1]) + P.py(q[1])) / 2, 13, GOOD);
    }
    body += label(opts.distLabel || '?', (P.px(p[0]) + P.px(q[0])) / 2 - 16, (P.py(p[1]) + P.py(q[1])) / 2 - 8, 18, WARM);
    if (opts.caption) body += label(opts.caption, P.W / 2, 26, 15, INK);
    return wrap(P.W, P.H, opts.label || 'two plotted points and the distance between them', body, opts.max);
  }

  /* ── squareProof: the four-corners picture behind a² + b² = c² ────────────────────────────────
     A big square of side (a + b) with the four copies of the right triangle at its corners, so the
     tilted inner square is c². No numbers are printed unless asked for. */
  function squareProof(opts) {
    opts = opts || {};
    const a = Number(opts.a) || 3, b = Number(opts.b) || 4;
    const W = 560, H = 400;
    const k = 250 / (a + b);
    const s = (a + b) * k;
    const ox = (W - s) / 2, oy = (H - s) / 2 - 12;
    const A1 = [ox, oy], B1 = [ox + s, oy], C1 = [ox + s, oy + s], D1 = [ox, oy + s];
    const p1 = [ox + a * k, oy], p2 = [ox + s, oy + a * k], p3 = [ox + s - a * k, oy + s], p4 = [ox, oy + s - a * k];
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<rect x="${ox}" y="${oy}" width="${s}" height="${s}" fill="#ffffff" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} L${p3[0]} ${p3[1]} L${p4[0]} ${p4[1]} Z" fill="${A}" fill-opacity=".5" stroke="${SHADE}" stroke-width="2.6"/>`;
    const tri = (m, n, o, fill) => `<path d="M${m[0]} ${m[1]}L${n[0]} ${n[1]}L${o[0]} ${o[1]}Z" fill="${fill}" fill-opacity=".5" stroke="${INK}" stroke-width="2.2"/>`;
    body += tri(A1, p1, p4, B);
    body += tri(B1, p2, p1, B);
    body += tri(C1, p3, p2, B);
    body += tri(D1, p4, p3, B);
    if (opts.tagA) body += label(opts.tagA, (A1[0] + p1[0]) / 2, A1[1] - 10, 14, BRAND);
    if (opts.tagB) body += label(opts.tagB, (A1[0] + p4[0]) / 2 - 18, (A1[1] + p4[1]) / 2, 14, BRAND);
    if (opts.tagC) body += label(opts.tagC, (p1[0] + p2[0]) / 2 + 6, (p1[1] + p2[1]) / 2 - 12, 14, SHADE);
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#54636f');
    return wrap(W, H, opts.label || 'a big square cut into four right triangles and a tilted inner square', body, opts.max);
  }

  /* ── stepTable: a worked-equation strip, one row per step ─────────────────────────────────────
     opts.rows = [[left, right], …] rendered as a two-column balance history with an operation column. */
  function stepTable(rows, opts) {
    opts = opts || {};
    const W = 600, rowH = 42;
    const H = 54 + rows.length * rowH;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += txt(opts.colA || 'left side', 150, 32, 13, '#54636f', 'middle');
    body += txt(opts.colB || 'right side', 380, 32, 13, '#54636f', 'middle');
    if (opts.colOp) body += txt(opts.colOp, 532, 32, 13, '#54636f', 'middle');
    rows.forEach((r, k) => {
      const y = 54 + k * rowH;
      body += `<rect x="40" y="${y}" width="520" height="${rowH - 6}" rx="8" fill="${k % 2 ? '#ffffff' : '#f3f7fb'}" stroke="${GRID}" stroke-width="1.4"/>`;
      body += label(String(r[0]), 150, y + 26, 16, INK);
      body += label(String(r[1]), 380, y + 26, 16, INK);
      if (r[2]) body += label(String(r[2]), 532, y + 24, 13, WARM);
    });
    if (opts.caption) body += label(opts.caption, W / 2, H - 10, 13, '#54636f');
    return wrap(W, H, opts.label || 'a table of equation steps', body, opts.max);
  }

  return { plane, slopeLine, twoLines, rightTri, pointsDist, squareProof, stepTable, wrap, label };
})();

/* scenes-9.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   SCENES9 — the Grade 9 picture library (parabolas, their roots and vertex, factored forms, and the
   solution region of a pair of linear inequalities)

   Same rule as scenes-7 and scenes-8: a figure is generated from the numbers in the question and never
   prints a value the student is meant to work out. A parabola shows its curve and its marked crossings as
   points; it does not label the roots unless asked. A sign chart shows the factors but not the sign
   conclusion. A region shows two boundary lines and the shaded overlap, not its corner coordinates.

   NOTE — no generic top-level name lives here: this file declares only SCENE9.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE9 = (() => {
  const INK = '#26303f', PAPER = '#fffdf6', BRAND = '#35507a';
  const A = '#9dc0e6', B = '#f2cb96', A2 = '#5f8cbe', B2 = '#d7a45f';
  const GRID = '#c6d0dc', SHADE = '#3f6aa8', WARM = '#b23b2e', GOOD = '#2f7d64', VIOLET = '#6b4a7a';

  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (t, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 15}" font-weight="800" fill="${color || INK}"${extra || ''}>${t}</text>`;
  const txt = (t, x, y, size, color, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-size="${size || 14}" font-weight="700" fill="${color || INK}">${t}</text>`;

  /* ── plane: axes on a chosen window, shared by everything below ─────────────────────────────────── */
  function plane(opts) {
    opts = opts || {};
    const W = opts.W || 620, H = opts.H || 400, pad = 46;
    const xmin = opts.xmin != null ? opts.xmin : -6, xmax = opts.xmax != null ? opts.xmax : 6;
    const ymin = opts.ymin != null ? opts.ymin : -4, ymax = opts.ymax != null ? opts.ymax : 10;
    const boxL = pad, boxR = W - pad, boxT = 26, boxB = H - pad;
    const px = (x) => boxL + ((x - xmin) / (xmax - xmin)) * (boxR - boxL);
    const py = (y) => boxB - ((y - ymin) / (ymax - ymin)) * (boxB - boxT);
    let body = blank(W, H, opts.fill || '#fbfdff');
    const stepX = Math.max(1, Math.ceil((xmax - xmin) / 12));
    const stepY = Math.max(1, Math.ceil((ymax - ymin) / 9));
    for (let v = Math.ceil(xmin / stepX) * stepX; v <= xmax; v += stepX) {
      body += `<line x1="${px(v)}" y1="${py(ymin)}" x2="${px(v)}" y2="${py(ymax)}" stroke="${GRID}" stroke-width="1.1"/>`;
      if (v !== 0) body += label(String(v), px(v), py(Math.min(Math.max(0, ymin), ymax)) + 19, 12, '#54636f');
    }
    for (let v = Math.ceil(ymin / stepY) * stepY; v <= ymax; v += stepY) {
      body += `<line x1="${px(xmin)}" y1="${py(v)}" x2="${px(xmax)}" y2="${py(v)}" stroke="${GRID}" stroke-width="1.1"/>`;
      if (v !== 0) body += label(String(v), px(Math.min(Math.max(0, xmin), xmax)) - 16, py(v) + 4, 12, '#54636f');
    }
    const ax = Math.min(Math.max(0, xmin), xmax), ay = Math.min(Math.max(0, ymin), ymax);
    body += `<line x1="${px(xmin)}" y1="${py(ay)}" x2="${px(xmax) + 10}" y2="${py(ay)}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<line x1="${px(ax)}" y1="${py(ymin)}" x2="${px(ax)}" y2="${py(ymax) - 10}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${px(xmax) + 10} ${py(ay)}l-9-4v8Z" fill="${INK}"/>`;
    body += `<path d="M${px(ax)} ${py(ymax) - 10}l-4 9h8Z" fill="${INK}"/>`;
    body += txt(opts.xName || 'x', px(xmax) + 2, py(ay) + 34, 13, BRAND);
    body += txt(opts.yName || 'y', px(ax) - 32, py(ymax) + 6, 13, BRAND);
    return { px, py, body, W, H, xmin, xmax, ymin, ymax };
  }

  /* ── parabola: y = a(x − h)² + k drawn through the window ─────────────────────────────────────────
     opts.a, opts.h, opts.k. opts.roots = true marks the x-crossings; opts.vertex = true marks the vertex.
     Neither label prints coordinates unless asked: the student reads them off the grid. */
  function parabola(opts) {
    opts = opts || {};
    const a = Number(opts.a) || 1, h = Number(opts.h) || 0, k = Number(opts.k) || 0;
    const xmin = opts.xmin != null ? opts.xmin : Math.floor(h - 5);
    const xmax = opts.xmax != null ? opts.xmax : Math.ceil(h + 5);
    const ys = [xmin, xmax, h].map((x) => a * (x - h) * (x - h) + k);
    const ymin = opts.ymin != null ? opts.ymin : Math.min(0, ...ys) - 2;
    const ymax = opts.ymax != null ? opts.ymax : Math.max(0, ...ys) + 2;
    const P = plane({ W: opts.W, H: opts.H, xmin, xmax, ymin, ymax, xName: opts.xName, yName: opts.yName });
    let body = P.body;
    /* sample the curve densely so it is smooth at any window size */
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const x = xmin + ((xmax - xmin) * i) / 160;
      const y = a * (x - h) * (x - h) + k;
      if (y < ymin - 2 || y > ymax + 2) { d += ''; continue; }
      d += (d === '' ? 'M' : 'L') + P.px(x).toFixed(1) + ' ' + P.py(y).toFixed(1) + ' ';
    }
    body += `<path d="${d.trim()}" fill="none" stroke="${SHADE}" stroke-width="3.4" stroke-linecap="round"/>`;
    if (opts.axis !== false) {
      body += `<line x1="${P.px(h)}" y1="${P.py(ymin)}" x2="${P.px(h)}" y2="${P.py(ymax)}" stroke="${VIOLET}" stroke-width="1.8" stroke-dasharray="6 5"/>`;
    }
    if (opts.vertex !== false) {
      body += `<circle cx="${P.px(h)}" cy="${P.py(k)}" r="7" fill="${B2}" stroke="${INK}" stroke-width="2.2"/>`;
    }
    if (opts.roots) {
      /* the roots only exist when the parabola reaches the x-axis from the correct side */
      if (a * k <= 0) {
        const r = Math.sqrt(-k / a);
        [h - r, h + r].forEach((x) => {
          if (x >= xmin && x <= xmax) body += `<circle cx="${P.px(x)}" cy="${P.py(0)}" r="6.5" fill="#fff" stroke="${WARM}" stroke-width="2.6"/>`;
        });
      }
    }
    if (opts.caption) body += label(opts.caption, P.W / 2, P.H - 12, 14, '#54636f');
    return wrap(P.W, P.H, opts.label || 'a parabola on a coordinate plane', body, opts.max);
  }

  /* ── vertices / mode: a table of values for a quadratic, with the requested column as "?" ──────────
     opts.fn = (x) => y  — the values are computed, and the ask column is blanked. */
  function valueTable(xs, fn, opts) {
    opts = opts || {};
    const W = opts.W || 600;
    const cols = xs.length;
    const colW = (W - 80) / cols;
    const H = 118;
    let body = blank(W, H, opts.fill || '#fbfdff');
    if (opts.caption) body += label(opts.caption, W / 2, 26, 14, '#54636f');
    body += txt(opts.rowA || 'x', 40, 62, 14, BRAND);
    body += txt(opts.rowB || 'y', 40, 96, 14, BRAND);
    xs.forEach((x, i) => {
      const cx = 80 + colW * i + colW / 2;
      body += `<rect x="${80 + colW * i + 3}" y="40" width="${colW - 6}" height="26" rx="6" fill="${i === opts.ask ? '#fff4d6' : '#f3f7fb'}" stroke="${GRID}" stroke-width="1.2"/>`;
      body += `<rect x="${80 + colW * i + 3}" y="72" width="${colW - 6}" height="26" rx="6" fill="${i === opts.ask ? '#fff4d6' : '#ffffff'}" stroke="${GRID}" stroke-width="1.2"/>`;
      body += label(String(x), cx, 58, 14, INK);
      body += label(i === opts.ask ? '?' : String(fn(x)), cx, 90, 14, i === opts.ask ? WARM : INK);
    });
    return wrap(W, H, opts.label || 'a table of values for a quadratic', body, opts.max);
  }

  /* ── factPair: a product written as the two factors it came from, for factoring rounds ────────────
     Shows "x² + bx + c" above, and two empty brackets below. No numbers are revealed except b and c. */
  function factBox(c, sum, opts) {
    opts = opts || {};
    const W = 600, H = 150;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += label(opts.expr || `x² + ${sum}x + ${c}`, W / 2, 46, 24, INK);
    body += label('=', W / 2, 82, 20, '#8b98a6');
    body += label(`(x + ?)(x + ?)`, W / 2, 120, 22, WARM);
    if (opts.caption) body += label(opts.caption, W / 2, 144, 12, '#54636f');
    return wrap(W, H, opts.label || 'a quadratic expression and two empty brackets', body, opts.max);
  }

  /* ── rootPair: the factored form with its two crossings marked, for reading roots off a graph ───── */
  function rootsGraph(r1, r2, opts) {
    opts = opts || {};
    const a = opts.a || 1;
    const h = (r1 + r2) / 2;
    const k = -a * ((r2 - r1) / 2) * ((r2 - r1) / 2);
    return parabola(Object.assign({ a, h, k, roots: true, vertex: opts.vertex !== false }, opts));
  }

  /* ── signChart: two factor columns and a product row, with one cell blank ───────────────────────── */
  function signChart(vals, opts) {
    opts = opts || {};
    const W = 620, H = 176;
    const cols = vals.length;
    const colW = (W - 130) / cols;
    let body = blank(W, H, opts.fill || '#fbfdff');
    const rows = [opts.f1 || '(x − 2)', opts.f2 || '(x + 3)', opts.prod || 'product'];
    rows.forEach((name, r) => {
      const y = 34 + r * 44;
      body += txt(name, 24, y + 20, 14, r === 2 ? INK : BRAND);
      vals.forEach((v, i) => {
        const cx = 130 + colW * i + colW / 2;
        const ask = r === 2 && i === (opts.ask | 0);
        const sign = r === 0 ? (v - 2) : r === 1 ? (v + 3) : (v - 2) * (v + 3);
        const text = ask ? '?' : (r === 2 ? (sign > 0 ? '+' : sign < 0 ? '−' : '0') : (sign > 0 ? '+' : sign < 0 ? '−' : '0'));
        const fill = /\+/.test(text) ? '#e7f4ec' : /−/.test(text) ? '#fdeaea' : ask ? '#fff4d6' : '#f3f7fb';
        body += `<rect x="${130 + colW * i + 3}" y="${y}" width="${colW - 6}" height="32" rx="6" fill="${fill}" stroke="${GRID}" stroke-width="1.2"/>`;
        body += label(text, cx, y + 23, 18, text === '?' ? WARM : INK);
      });
      body += txt(opts.colFor ? '' : '', 0, 0, 10, INK);
    });
    body += txt('x =', 24, 168, 13, '#54636f');
    vals.forEach((v, i) => {
      const cx = 130 + colW * i + colW / 2;
      body += label(String(v).replace('-', '−'), cx, 168, 13, '#54636f');
    });
    return wrap(W, H, opts.label || 'a sign chart for a product of two factors', body, opts.max);
  }

  /* ── region: two boundary lines and the shading of the half-planes that both allow ────────────────
     opts.l1 / opts.l2 = {m, b, op} where op is '≤' or '≥'. The shading is computed point by point, so
     the picture is true for whatever pair is passed in. No corner coordinates are ever printed. */
  function region(l1, l2, opts) {
    opts = opts || {};
    const xmax = opts.xmax != null ? opts.xmax : 10;
    const ymax = opts.ymax != null ? opts.ymax : Math.max(
      l1.m * xmax + l1.b, l2.m * xmax + l2.b, 6) + 2;
    const P = plane({ W: 620, H: 430, xmin: 0, xmax, ymin: 0, ymax, xName: opts.xName, yName: opts.yName });
    let body = P.body;
    /* The admissible set of one half-plane is the rectangle clipped by that boundary; the set of both is
       the rectangle clipped twice (Sutherland–Hodgman). That keeps the wash an exact polygon — a few
       hundred bytes — instead of a tiled approximation, and it is correct for any pair of boundaries. */
    const clip = (poly, L) => {
      const inside = (pt) => (L.op === '≤' ? pt[1] <= L.m * pt[0] + L.b + 1e-9 : pt[1] >= L.m * pt[0] + L.b - 1e-9);
      const cross = (p1, p2) => {
        const x1 = p1[0], y1 = p1[1], x2 = p2[0], y2 = p2[1];
        const d1 = y1 - (L.m * x1 + L.b), d2 = y2 - (L.m * x2 + L.b);
        const t = d1 / (d1 - d2);
        return [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
      };
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const cur = poly[i], prev = poly[(i + poly.length - 1) % poly.length];
        const cin = inside(cur), pin = inside(prev);
        if (cin && pin) out.push(cur);
        else if (cin && !pin) { out.push(cross(prev, cur)); out.push(cur); }
        else if (!cin && pin) out.push(cross(prev, cur));
      }
      return out;
    };
    const box = [[0, 0], [xmax, 0], [xmax, ymax], [0, ymax]];
    const only1 = clip(box, l1);
    const only2 = clip(box, l2);
    const both = clip(only1, l2);
    const polyPath = (poly, fill, op) => (poly.length < 3 ? '' :
      `<path d="M${poly.map((pt) => P.px(pt[0]).toFixed(1) + ' ' + P.py(pt[1]).toFixed(1)).join('L')}Z" fill="${fill}" fill-opacity="${op}"/>`);
    body += polyPath(only1, SHADE, '.10');
    body += polyPath(only2, WARM, '.10');
    body += polyPath(both, GOOD, '.26');
    const drawLine = (L, color, name) => {
      let g = `<line x1="${P.px(0)}" y1="${P.py(L.b)}" x2="${P.px(xmax)}" y2="${P.py(L.m * xmax + L.b)}" stroke="${color}" stroke-width="3.2" stroke-linecap="round" ${L.op === '≤' || L.op === '≥' ? '' : 'stroke-dasharray="8 6"'}/>`;
      if (name) {
        const lx = xmax * 0.12, ly = L.m * lx + L.b;
        g += `<rect x="${P.px(lx) - 40}" y="${P.py(ly) - 30}" width="130" height="24" rx="6" fill="#fff" fill-opacity=".86"/>`;
        g += txt(name, P.px(lx) - 34, P.py(ly) - 12, 13, color);
      }
      return g;
    };
    body += drawLine(l1, SHADE, opts.n1);
    body += drawLine(l2, WARM, opts.n2);
    if (opts.caption) body += label(opts.caption, P.W / 2, P.H - 10, 13, '#54636f');
    return wrap(P.W, P.H, opts.label || 'two boundary lines and the region where both conditions hold', body, opts.max);
  }

  /* ── squareStep: the completing-the-square diagram, an (x + b/2)² square beside the left-over ────
     A visual for the algebra: the x² square, the two bx/2 strips, and what must be added to close the
     corner. The added corner is drawn hollow because that is exactly the quantity being found. */
  function squareStep(b, opts) {
    opts = opts || {};
    const W = 560, H = 380;
    const side = 250, ox = 96, oy = 62;
    const half = b / 2;
    const total = 1 + half;               /* in units of x */
    const unit = side / total;
    const xLen = unit, sLen = half * unit;
    let body = blank(W, H, opts.fill || '#fbfdff');
    /* x² square */
    body += `<rect x="${ox}" y="${oy}" width="${xLen}" height="${xLen}" fill="${A}" fill-opacity=".55" stroke="${INK}" stroke-width="2.4"/>`;
    body += label('x²', ox + xLen / 2, oy + xLen / 2 + 6, 16, INK);
    /* the two strips, one along the top and one along the side */
    body += `<rect x="${ox + xLen}" y="${oy}" width="${sLen}" height="${xLen}" fill="${B}" fill-opacity=".6" stroke="${INK}" stroke-width="2.2"/>`;
    body += `<rect x="${ox}" y="${oy + xLen}" width="${xLen}" height="${sLen}" fill="${B}" fill-opacity=".6" stroke="${INK}" stroke-width="2.2"/>`;
    /* the hollow corner that has to be added */
    body += `<rect x="${ox + xLen}" y="${oy + xLen}" width="${sLen}" height="${sLen}" fill="none" stroke="${WARM}" stroke-width="2.8" stroke-dasharray="7 5"/>`;
    body += label('?', ox + xLen + sLen / 2, oy + xLen + sLen / 2 + 7, 20, WARM);
    body += txt(opts.stripLabel || `x · ${half}`, ox + xLen + sLen / 2, oy - 12, 13, '#54636f', 'middle');
    body += txt(opts.sideLabel || `x · ${half}`, ox - 16, oy + xLen + sLen / 2, 13, '#54636f', 'end');
    body += label('x', ox + xLen / 2, oy + xLen + sLen + 26, 15, BRAND);
    body += label(String(half), ox + xLen + sLen / 2, oy + xLen + sLen + 26, 15, BRAND);
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 14, '#54636f');
    return wrap(W, H, opts.label || 'a square being completed, with the missing corner marked', body, opts.max);
  }

  return { plane, parabola, valueTable, factBox, rootsGraph, signChart, region, squareStep, wrap, label };
})();

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   LESSONS / LESSON_UNITS — the ten-section نبع/موازي frame, keyed by game id.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────
   Structure mirrors the curriculum documents rather than inventing an anchor per game:

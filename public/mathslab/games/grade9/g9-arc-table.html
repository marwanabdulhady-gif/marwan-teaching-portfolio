      /* keypad keys, the Check button and a star row are drawn by the engine as raw symbols; a missing glyph
         font turns them into boxes on a Chromebook, so they get icon markup too */
      document.querySelectorAll('.pad button, .cbtn.go, .dlg .stars, .card .st').forEach((el) => {
        if (el.querySelector('svg')) return;
        const t = el.textContent.trim();
        if (t === '⌫') { el.innerHTML = svg('backspace', 22); return; }
        if (/^check\s*✓$/i.test(t)) { el.innerHTML = `${t.replace(/✓/, '')}${svg('check', 18)}`; return; }
        if (/^[★☆\s]+$/.test(t) && t) {
          el.innerHTML = t.replace(/[★☆]/g, (c) => {
            const star = '<svg class="g1i" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true" focusable="false" style="color:inherit">';
            return star + (c === '★'
              ? '<path d="M32 8l7.6 15.4 17 2.5-12.3 12 2.9 17-15.2-8-15.2 8 2.9-17-12.3-12 17-2.5Z" fill="#f0b429"/>'
              : '<path d="M32 8l7.6 15.4 17 2.5-12.3 12 2.9 17-15.2-8-15.2 8 2.9-17-12.3-12 17-2.5Z" fill="none" stroke="#c9b083" stroke-width="3.5" stroke-linejoin="round"/>') + '</svg>';

         raw emoji character survives anywhere in the page (same guard as the dialog picture below) */
      const ge = document.querySelector('#g-emoji');
      if (ge && !ge.querySelector('svg') && ge.textContent.trim()) {
        const drawn = big(ge.textContent.trim(), 26);
        if (drawn) ge.innerHTML = drawn;
      }
      /* the code chip and coach face are text; leave the coach SVG alone */
      /* the coach's mood badge is drawn by the engine as <text>💡</text> (or ✓ / !) inside its own face SVG;
         an SVG <text> cannot be replaced by a nested <svg>, so swap the symbol for a stroked path instead */
      document.querySelectorAll('#coach-face text').forEach((t) => {
        const glyph = t.textContent.trim();

          bulb: '<path d="M50 12a4 4 0 0 1 3 6c-1 1-1 2-1 3h-4c0-1 0-2-1-3a4 4 0 0 1 3-6Z" fill="#f5c33d" stroke="#8a5a1f" stroke-width="1"/><path d="M49 22h2" stroke="#8a5a1f" stroke-width="1.4" stroke-linecap="round"/>',
          check: '<path d="M47 15l3 3 6-7" fill="none" stroke="#2f8a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
          cross: '<path d="M49 13l8 8M57 13l-8 8" stroke="#c62828" stroke-width="2.6" stroke-linecap="round"/>',
        };

        else t.textContent = '';

      /* the celebration burst is eight fixed-position spans the engine builds from ⭐ ✨ 🌟 and removes after
         0.9 s; drawing them as icons keeps the reward and loses the raw glyphs */
      document.querySelectorAll('.burst').forEach((b) => {
        if (b.querySelector('svg')) return;
        const g = b.textContent.trim();
        const ic = name(g) || 'sparkle';
        b.innerHTML = svg(ic === 'star' ? 'star' : 'sparkle', 30);
      });
      /* "🧠 Think first — CUBES" is a bare <b>, not a .prompt — give it the same treatment */
      document.querySelectorAll('.think > b, .think > p > b, #coach-say b').forEach((b) => walk(b));

      document.querySelectorAll('.cbtn').forEach((b) => { if (!b.querySelector('svg')) walk(b); });
      document.querySelectorAll('.home > div:first-child').forEach((d) => { if (!d.querySelector('svg') && d.textContent.trim()) d.innerHTML = big(d.textContent.trim(), 96); });
      say.forEach((el) => { if (!el.querySelector('svg')) walk(el); });
      const di = document.querySelector('.dlg .di');
      if (di && !di.querySelector('svg') && di.textContent.trim()) {
        /* big() returns '' for an emoji with no icon: writing that back would replace the node with its
           own markup, fire the observer again and loop forever, so the assignment is guarded. */
        const drawn = big(di.textContent.trim(), 68);
        if (drawn) di.innerHTML = drawn;
      }

    new MutationObserver(() => paint()).observe(document.body, { childList: true, subtree: true });
    setTimeout(paint, 60);
    setTimeout(paint, 260);
  }

})();

    'g4-ridge-angles': () => `<svg viewBox="0 0 480 230" role="img" aria-label="rock ridges meeting at an angle on the horizon">${sky('#eef1f8', '#fafbff')}${sun(398, 42, 24)}<path d="M0 168l118-74 92 52 82-34 188 60v58H0Z" fill="#c9cfdd"/><path d="M0 190l118-46 92 34 82-22 188 40v34H0Z" fill="#aab3c6"/><path d="M210 130l58 40" stroke="#4f5f8a" stroke-width="3" stroke-dasharray="7 6"/><circle cx="210" cy="130" r="5" fill="#4f5f8a"/><path d="M${210} ${130}l84 8" stroke="#ed6a5a" stroke-width="3.5" stroke-linecap="round"/><path d="M210 130l66 52" stroke="#4f5f8a" stroke-width="3.5" stroke-linecap="round"/><path d="M0 206h480v24H0Z" fill="#96a0b5"/></svg>`,
    'g4-dune-place': () => `<svg viewBox="0 0 480 230" role="img" aria-label="layered dunes in the shape of a place-value chart">${sky('#fdf1e2', '#fffaf2')}${sun(400, 46, 26, '#e8a33f')}${[0, 1, 2, 3].map((i) => `<path d="M0 ${132 + i * 24}q120-26 240-10t240-8v${240 - (132 + i * 24)}H0Z" fill="${['#f0dcb4', '#e6cd9c', '#dcc088', '#cfae74'][i]}"/>`).join('')}<path d="M0 208h480v22H0Z" fill="#b3762a" opacity=".25"/>${[96, 176, 256, 336].map((x) => `<path d="M${x} 96v112" stroke="#b3762a" stroke-width="2" opacity=".45" stroke-dasharray="5 7"/>`).join('')}</svg>`,
    'g4-pigeon-loft': () => `<svg viewBox="0 0 480 230" role="img" aria-label="a pigeon loft with birds circling above">${sky('#eaf2f8', '#f8fbfe')}${sun(400, 42, 24)}${ground('#e4dcc8')}<rect x="176" y="76" width="128" height="116" rx="6" fill="#48607a"/><path d="M168 78l72-42 72 42Z" fill="#33506b"/><rect x="212" y="124" width="56" height="68" rx="4" fill="#f0e4cf"/><path d="M240 124v68" stroke="#48607a" stroke-width="3"/><circle cx="240" cy="100" r="9" fill="#f0e4cf"/><path d="M0 190h480v40H0Z" fill="#d6cdb8"/>${[0, 1, 2, 3].map((i) => `<g transform="translate(${92 + i * 104} ${58 + (i % 2) * 22})"><path d="M-12 0c6-8 18-8 24 0-6 8-18 8-24 0Z" fill="#fff" stroke="#b9c6d1" stroke-width="2"/><path d="M-12 0l-8-4" stroke="#b9c6d1" stroke-width="2"/></g>`).join('')}</svg>`,
  };

  return {
    for: (id) => (ART[id] ? ART[id]() : ART2[id] ? ART2[id]() : ART2B[id] ? ART2B[id]() : ART3[id] ? ART3[id]() : ART4[id] ? ART4[id]() : fallback(id)),
    has: (id) => !!(ART[id] || ART2[id] || ART2B[id] || ART3[id] || ART4[id]),
  };
})();

const G1THEME = (() => {
  function start() {
    const g = (typeof GAME !== 'undefined' && GAME) || {};
    const root = document.documentElement;
    if (g.accent) {
      root.style.setProperty('--accent', g.accent);
      root.style.setProperty('--accent-deep', g.accentDeep || g.accent);
      root.style.setProperty('--paper', g.paper || '#fffaf0');
      root.style.setProperty('--sky-a', g.skyA || '#eaf8fb');
      root.style.setProperty('--sky-b', g.skyB || '#cdeaf1');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', g.accent);
    }
    /* the hero picture replaces the template's single emoji on the home screen */
    const paintHero = () => {
      const home = document.querySelector('#stage .home');
      if (!home || home.querySelector('.hero')) return;
      const first = home.firstElementChild;
      if (first && /font-size:\s*64px/.test(first.getAttribute('style') || '')) {
        first.className = 'hero';
        first.setAttribute('style', '');
        first.innerHTML = G1HERO.for(g.id);
      }
    };
    paintHero();
    const obs = new MutationObserver(() => paintHero());
    obs.observe(document.getElementById('stage') || document.body, { childList: true, subtree: true });
    setTimeout(paintHero, 40);
    setTimeout(paintHero, 400);
    /* icons last, so the chrome is already painted */
    G1ICON.replace();
  }
  return { start };
})();

/* Small game-side helpers shared by the Grade 1 lesson games. No engine code lives here. */
const G1 = {
  /* put a picture above a question, with an optional caption, without ever inventing a total */
  art(svg, caption) {
    return `<div style="display:grid;gap:6px;margin-bottom:6px">${svg}${caption ? `<p style="margin:0;text-align:center;font-size:15px;font-weight:700;color:#6b5a3a">${caption}</p>` : ''}</p></div>`;
  },
  /* 3 hints, strategy → step → near answer. The answer itself is never one of them. */
  hints: (a, b, c) => (c ? [a, b, c] : [a, b]),
  /* a distinct multiple-choice list that always contains the key */
  opts(answer, pool, n) {
    const out = [String(answer)];
    pool.forEach((v) => { const s = String(v); if (!out.includes(s) && out.length < (n || 4)) out.push(s); });
    return out;
  },
  /* pick a distractor set that is genuinely plausible for the skill */
  near(answer, deltas) { return deltas.map((d) => answer + d).filter((v) => v >= 0); },
  sayNum: (n, one, many) => `${n} ${n === 1 ? one : many}`,
};

/* scenes-2.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 2 PICTURE LIBRARY — place value, regrouping, money and arrays.
   Same rules as scenes.js: every picture is generated from the numbers the question asks about, so a caption
   can never disagree with the drawing. Nothing here fetches, and no picture prints a total the child is
   supposed to work out (blocks and notes are unnumbered; digits are only printed where the question gives them).
   ══════════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE2 = (() => {
  const INK = '#4a2f15', BRAND = '#0e7c86', PAPER = '#fffaf0';
  const FLAT = '#2a8b9c', ROD = '#4faa63', UNIT = '#e0a93f';
  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (txt, x, y, size, color) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}">${txt}</text>`;

  /* ---- base-ten pieces: a flat is 100, a rod is 10, a unit is 1 ---- */
  function flat(x, y, k, color) {
    const s = 42 * k;
    let g = `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${4 * k}" fill="${color || FLAT}" opacity=".92"/>`;
    for (let i = 1; i < 10; i++) {
      g += `<line x1="${x + (i * s) / 10}" y1="${y}" x2="${x + (i * s) / 10}" y2="${y + s}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".55"/>`;
      g += `<line x1="${x}" y1="${y + (i * s) / 10}" x2="${x + s}" y2="${y + (i * s) / 10}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".55"/>`;
    }
    return g + `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${4 * k}" fill="none" stroke="${INK}" stroke-width="${1.6 * k}"/>`;
  }
  function rod(x, y, k, color) {
    const w = 9 * k, h = 42 * k;
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${3 * k}" fill="${color || ROD}"/>`;
    for (let i = 1; i < 10; i++) g += `<line x1="${x}" y1="${y + (i * h) / 10}" x2="${x + w}" y2="${y + (i * h) / 10}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".6"/>`;
    return g + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${3 * k}" fill="none" stroke="${INK}" stroke-width="${1.4 * k}"/>`;
  }
  function unit(x, y, k, color) {
    const s = 9 * k;
    return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${2 * k}" fill="${color || UNIT}" stroke="${INK}" stroke-width="${1.3 * k}"/>`;
  }

  /* hundreds flats, tens rods and ones units laid out in three tidy groups */
  function baseTen(h, t, o, opts) {
    opts = opts || {};
    const W = 620, H = opts.h || 250;
    /* scale the blocks up so a handful of tens or ones still fills the frame: a 2-rod picture at k=1 is a
       speck in a 620-wide box, which reads as "nothing to count" to a seven-year-old */
    const natural = (h * 46) + (Math.min(t, 10) * 13) + (Math.min(o, 10) * 13) + 52;
    const k = opts.k || Math.max(1, Math.min(2.2, (W * 0.56) / Math.max(natural, 1)));
    const groups = [];
    if (h > 0) groups.push({ n: h, kind: 'flat' });
    if (t > 0) groups.push({ n: t, kind: 'rod' });
    if (o > 0) groups.push({ n: o, kind: 'unit' });
    if (!groups.length) groups.push({ n: 0, kind: 'unit' });
    /* group widths drive the layout so 9 flats and 2 rods both look balanced */
    const widths = groups.map((g) => (g.kind === 'flat' ? 5 * 44 * k : g.kind === 'rod' ? g.n * 13 * k : Math.min(g.n, 10) * 13 * k));
    const gap = 26, total = widths.reduce((a, b) => a + b, 0) + gap * (groups.length - 1);
    let x = (W - total) / 2;
    let body = blank(W, H, opts.fill || '#f4fbfc');
    /* centre the block rows vertically, leaving room for the place labels along the bottom */
    const heights = groups.map((g) => (g.kind === 'flat' ? (Math.ceil(g.n / 5) * 46 - 4) * k : g.kind === 'rod' ? 42 * k : (Math.ceil(g.n / 10) * 13) * k));
    const tallest = Math.max(...heights);
    const contentTop = 18 + (H - 44 - tallest) / 2;
    groups.forEach((g, gi) => {
      const top = contentTop + (tallest - heights[gi]) / 2;
      for (let i = 0; i < g.n; i += 1) {
        if (g.kind === 'flat') {
          const perRow = Math.min(g.n, 5);
          body += flat(x + (i % perRow) * 46 * k, top + Math.floor(i / perRow) * 46 * k, k);
        } else if (g.kind === 'rod') {
          body += rod(x + i * 13 * k, top, k);
        } else {
          body += unit(x + (i % 10) * 13 * k, top + Math.floor(i / 10) * 13 * k, k);
        }
      }
      const names = { flat: 'hundreds', rod: 'tens', unit: 'ones' };
      body += label(names[g.kind], x + widths[gi] / 2, H - 14, 15, '#55647a');
      x += widths[gi] + gap;
    });
    const say = `${h} hundreds, ${t} tens and ${o} ones drawn in base-ten blocks`;
    return wrap(W, H, opts.label || say, body, opts.max);
  }

  /* a place-value chart: three columns; a digit is printed only when the question supplies it */
  function placeChart(h, t, o, opts) {
    opts = opts || {};
    const W = 520, H = 200, cols = ['Hundreds', 'Tens', 'Ones'], vals = [h, t, o];
    const cw = 150, x0 = (W - cw * 3) / 2;
    let body = blank(W, H, opts.fill || '#f7f4ff');
    for (let i = 0; i < 3; i += 1) {
      const x = x0 + i * cw;
      body += `<rect x="${x + 6}" y="26" width="${cw - 12}" height="120" rx="14" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
      body += label(cols[i], x + cw / 2, 18, 15, '#55647a');
      const v = vals[i];
      body += label(v == null || v === '' ? '?' : String(v), x + cw / 2, 106, 46, v == null ? '#c9d6dd' : '#24303f');
    }
    const say = opts.label || 'a place-value chart with hundreds, tens and ones columns';
    return wrap(W, H, say, body, opts.max);
  }

  /* two groups side by side, for comparing */
  function compareHi(a, b, opts) {
    opts = opts || {};
    const W = 560, H = 190;
    let body = blank(W, H, '#fff8ee');
    [[a, 132, 'A'], [b, 428, 'B']].forEach(([n, cx, tag]) => {
      body += `<rect x="${cx - 104}" y="34" width="208" height="96" rx="16" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
      body += label(String(n), cx, 106, 56, '#24303f');
      body += label(tag, cx, 166, 18, '#55647a');
    });
    body += label(opts.mid || '?', W / 2, 100, 40, '#e2564a');
    return wrap(W, H, opts.label || `two number cards, A is ${a} and B is ${b}`, body, opts.max);
  }

  /* Japanese-yen style note/coin art is wrong here: Saudi riyals — notes 1, 5, 10, 50 and halala coins */
  function note(x, y, value, k) {
    const w = 96 * k, h = 46 * k;
    const cols = { 1: '#a7c7a1', 5: '#c9a86a', 10: '#8fb4d9', 50: '#c58f9e', 100: '#9bb3c7' };
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${5 * k}" fill="${cols[value] || '#c9a86a'}" stroke="${INK}" stroke-width="${1.6 * k}"/>`
      + `<rect x="${x + 5 * k}" y="${y + 5 * k}" width="${w - 10 * k}" height="${h - 10 * k}" rx="${3 * k}" fill="none" stroke="${INK}" stroke-width="${1 * k}" opacity=".45"/>`
      + `<text x="${x + w / 2}" y="${y + h / 2 + 8 * k}" text-anchor="middle" font-size="${20 * k}" font-weight="800" fill="${INK}">${value}</text>`
      + `<text x="${x + w - 12 * k}" y="${y + h - 8 * k}" text-anchor="end" font-size="${10 * k}" font-weight="800" fill="${INK}" opacity=".7">SAR</text></g>`;
  }
  function coin(x, y, value, k) {
    const r = 15 * k;
    return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="#e8dcc0" stroke="${INK}" stroke-width="${1.6 * k}"/>`
      + `<circle cx="${x}" cy="${y}" r="${r - 4 * k}" fill="none" stroke="${INK}" stroke-width="${1 * k}" opacity=".45"/>`
      + `<text x="${x}" y="${y + 4 * k}" text-anchor="middle" font-size="${11 * k}" font-weight="800" fill="${INK}">${value}</text></g>`;
  }
  /* notes and coins: `notes` is a list of note values, `coins` a list of halala values */
  function money(notes, coins, opts) {
    opts = opts || {};
    const W = 560, H = notes.length ? 190 : 120;
    let body = blank(W, H, opts.fill || '#fffaf0');
    let x = 34, y = 40;
    notes.forEach((v) => {
      if (x + 96 > W - 24) { x = 34; y += 60; }
      body += note(x, y, v, 1);
      x += 108;
    });
    if (coins && coins.length) {
      const cy = notes.length ? y + 66 : 84;
      coins.forEach((v, i) => { body += coin(46 + i * 40, cy, v, 1.1); });
      body += label('halalas', 46 + coins.length * 40 + 10, cy - 22, 14, '#55647a');
    }
    body += label(opts.caption || '', W / 2, H - 12, 15, '#55647a');
    return wrap(W, H, opts.label || 'Saudi riyal notes and halala coins', body, opts.max);
  }

  /* an array of crates: rows × columns, with the row and column counts labelled (not the total) */
  function array(rows, cols, opts) {
    opts = opts || {};
    const W = 560, H = 300, cell = Math.min(52, 330 / Math.max(rows, cols)), gx = cell * 0.9;
    const x0 = (W - cols * gx) / 2 + gx / 2, y0 = (H - rows * gx) / 2 + gx / 2 - 6;
    let body = blank(W, H, opts.fill || '#fff6e8');
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const x = x0 + c * gx, y = y0 + r * gx, s = cell * 0.72;
        body += `<rect x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}" rx="${s * 0.2}" fill="${opts.color || '#c9703f'}" stroke="${INK}" stroke-width="1.6"/>`;
        body += `<path d="M${x - s / 2} ${y} h${s} M${x} ${y - s / 2} v${s}" stroke="#fff" stroke-width="1.4" opacity=".65"/>`;
      }
    }
    body += `<path d="M${x0 - gx / 2} ${y0 + (rows - 0.5) * gx + 12} h${cols * gx}" stroke="#8a6a3d" stroke-width="2" stroke-dasharray="5 5"/>`;
    /* `bare` hides the row / column captions: used when the picture is itself an answer option, where
       printing "5 rows" would tell the child what to count instead of letting them count it */
    if (!opts.bare) {
      body += label(`${rows} rows`, W / 2, y0 + (rows - 0.5) * gx + 34, 15, '#6b5a3a');
      body += label(`${cols} in each row`, W / 2, 26, 16, '#6b5a3a');
    }
    return wrap(W, H, opts.label || `an array of crates, ${rows} rows with ${cols} in each row`, body, opts.max);
  }

  /* a skip-counting track: some numbers printed, the last slot empty */
  function skipTrack(start, step, shown, opts) {
    opts = opts || {};
    const W = 600, H = 150, n = shown, stepX = Math.min(86, (W - 60) / n);
    const x0 = (W - (n - 1) * stepX) / 2;
    let body = blank(W, H, '#effaf9');
    for (let i = 0; i < n; i += 1) {
      const x = x0 + i * stepX, v = start + i * step, last = i === n - 1;
      body += `<circle cx="${x}" cy="72" r="${stepX * 0.34}" fill="${last ? '#fff' : '#fff'}" stroke="${INK}" stroke-width="${last ? 3 : 2}" ${last ? 'stroke-dasharray="7 5"' : ''}/>`;
      body += label(last && opts.hideLast !== false ? '?' : String(v), x, 82, last ? 24 : 22, last ? INK : '#24303f');
      if (i < n - 1) body += `<path d="M${x + stepX * 0.34} 72 h${stepX * 0.32}" stroke="#b9a888" stroke-width="2" stroke-dasharray="4 4"/>`;
    }
    body += label(opts.caption || '', W / 2, H - 14, 15, '#6b5a3a');
    return wrap(W, H, opts.label || `a skip-counting track starting at ${start}`, body, opts.max);
  }

  /* a clock face at any five-minute mark. The Grade 1 scene only draws :00 and :30, which cannot show the
     five-minute marks this grade reads, so the hour hand is placed proportionally between hours. */
  function clockAt(hour, minutes, size) {
    const W = size || 230, c = W / 2, R = c - 12, k = W / 220;
    const pt = (deg, len) => [c + Math.cos(((deg - 90) * Math.PI) / 180) * len, c + Math.sin(((deg - 90) * Math.PI) / 180) * len];
    let body = `<circle cx="${c}" cy="${c}" r="${R}" fill="#fffdf6" stroke="${INK}" stroke-width="${6 * k}"/>`;
    for (let i = 1; i <= 12; i += 1) {
      const [x, y] = pt(i * 30, R * 0.78);
      body += label(i, x, y + 5 * k, 19 * k, '#3b2814');
    }
    /* ticks for every five-minute mark, longer on the quarters */
    for (let m = 0; m < 60; m += 5) {
      const [x1, y1] = pt(m * 6, R * 0.93), [x2, y2] = pt(m * 6, R * (m % 15 === 0 ? 0.84 : 0.88));
      body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b9a888" stroke-width="${2 * k}" stroke-linecap="round"/>`;
    }
    const [mx, my] = pt(minutes * 6, R * 0.72);
    const [hx, hy] = pt(((hour % 12) + minutes / 60) * 30, R * 0.46);
    body += `<line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="${BRAND}" stroke-width="${5.5 * k}" stroke-linecap="round"/>`;
    body += `<line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="#d26542" stroke-width="${8.5 * k}" stroke-linecap="round"/>`;
    body += `<circle cx="${c}" cy="${c}" r="${6.5 * k}" fill="${INK}"/>`;
    const say = `clock showing ${hour} ${minutes ? 'past ' + String(minutes).padStart(2, '0') : "o'clock"}`;
    return wrap(W, W, say, body, W);
  }

  /* a picture graph whose key and columns are the question's own — the shared scene hard-codes "1 vote",
     which would contradict a Grade 2 question about a key of 2 or 5. One circle still equals one key unit. */
  function graphKeyed(vals, opts) {
    opts = opts || {};
    const names = opts.names || ['Ibex', 'Hyrax', 'Baboons'];
    const cols = opts.colors || ['#c87839', '#4d8f7d', '#8a5fa8'];
    const W = 520, H = 258, base = 200, maxV = Math.max(4, ...vals);
    let body = blank(W, H, '#fff6e8');
    body += label(opts.key || 'each circle = 2 animals', 392, 30, 15, '#6b5a3a');
    body += `<line x1="40" y1="${base}" x2="482" y2="${base}" stroke="#b9a888" stroke-width="3" stroke-linecap="round"/>`;
    for (let r = 1; r < maxV; r += 1) body += `<line x1="58" y1="${base - r * 30}" x2="466" y2="${base - r * 30}" stroke="#e6d8c4" stroke-width="1.5" stroke-dasharray="4 6"/>`;
    vals.forEach((v, i) => {
      const cx = 122 + i * 148;
      for (let j = 0; j < v; j += 1) body += `<circle cx="${cx}" cy="${base - 14 - j * 30}" r="12.5" fill="${cols[i % cols.length]}"/>`;
      body += label(names[i] || '', cx, base + 32, 16, INK);
    });
    const say = `picture graph, key ${opts.keyValue || 2} per circle: ${names.map((n, i) => `${n} ${vals[i]} circles`).join(', ')}`;
    return wrap(W, H, say, body, opts.max);
  }

  return { baseTen, placeChart, compareHi, money, array, skipTrack, clockAt, graphKeyed, note, coin, flat, rod, unit, wrap, label };
})();

/* scenes-3.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 3 PICTURE LIBRARY — equal groups, arrays of dots, fractions on a line, area and perimeter.
   Same rules as scenes.js and scenes-2.js: a picture is generated from the numbers the question asks about,
   so a caption can never contradict the drawing, and nothing prints the total the child is meant to work out.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE3 = (() => {
  const INK = '#2c3a4a', PAPER = '#fffaf0', BRAND = '#2b6f8f';
  const GROUP = '#4faa63', GROUP2 = '#2a8b9c', DOT = '#c9703f', SHADE = '#3b6fb6';
  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (txt, x, y, size, color) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}">${txt}</text>`;

  /* a palm in a grove: used for the equal-groups picture */
  const palm = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 0c-3-9-1-17 2-24" stroke="#8a6a3d" stroke-width="3.4" fill="none" stroke-linecap="round"/><ellipse cx="-6" cy="-24" rx="9" ry="4.4" fill="${GROUP}" transform="rotate(-24 -6 -24)"/><ellipse cx="8" cy="-26" rx="9" ry="4.4" fill="#6fc17e" transform="rotate(20 8 -26)"/><ellipse cx="1" cy="-30" rx="7" ry="4" fill="${GROUP}" transform="rotate(-4 1 -30)"/><ellipse cx="0" cy="-3" rx="7" ry="3" fill="#d9c9a8"/></g>`;

  /* ---- equal groups: n circles, each holding `size` palms ---- */
  function groups(n, size, opts) {
    opts = opts || {};
    const W = 620, perRow = Math.min(n, 4), rowsN = Math.ceil(n / perRow);
    const groupW = 128, groupH = 96, gapX = 12, gapY = 12;
    const H = opts.h || Math.max(150, rowsN * (groupH + gapY) + 44);
    let body = blank(W, H, opts.fill || '#f2fbf4');
    const totalW = perRow * groupW + (perRow - 1) * gapX;
    const x0 = (W - totalW) / 2, y0 = 18;
    for (let g = 0; g < n; g += 1) {
      const gx = x0 + (g % perRow) * (groupW + gapX);
      const gy = y0 + Math.floor(g / perRow) * (groupH + gapY);
      body += `<rect x="${gx}" y="${gy}" width="${groupW}" height="${groupH}" rx="14" fill="#fff" stroke="${GROUP2}" stroke-width="2.4" stroke-dasharray="7 5"/>`;
      /* the items sit in a small grid inside the group so `size` up to 8 stays readable */
      const cols = size <= 3 ? size : 4, rr = Math.ceil(size / cols);
      for (let i = 0; i < size; i += 1) {
        const cx = gx + groupW / 2 + ((i % cols) - (cols - 1) / 2) * 26;
        const cy = gy + groupH / 2 + 8 + (Math.floor(i / cols) - (rr - 1) / 2) * 26;
        body += palm(cx, cy, 0.82);
      }
    }
    return wrap(W, H, opts.label || `${n} equal groups with ${size} palms in each group`, body, opts.max);
  }

  /* ---- an array of dots: rows × columns, unnumbered ---- */
  function dots(rows, cols, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 300;
    const step = Math.min(54, 320 / Math.max(rows, cols));
    const x0 = (W - (cols - 1) * step) / 2, y0 = (H - (rows - 1) * step) / 2 - 8;
    let body = blank(W, H, opts.fill || '#fff7ee');
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        body += `<circle cx="${x0 + c * step}" cy="${y0 + r * step}" r="${step * 0.29}" fill="${opts.color || DOT}"/>`;
      }
    }
    if (opts.rowBracket) {
      body += `<path d="M${x0 - step * 0.7} ${y0 - step * 0.6} h${(cols - 1) * step + step * 1.4}" stroke="#8a6a3d" stroke-width="2.4" stroke-dasharray="5 5"/>`;
      body += label(`one row`, W / 2, y0 - step * 0.75, 14, '#6b5a3a');
    }
    return wrap(W, H, opts.label || `an array of dots, ${rows} rows of ${cols}`, body, opts.max);
  }

  /* ---- division picture: `total` items dealt into `n` equal trays ---- */
  function share(total, n, opts) {
    opts = opts || {};
    const W = 620, H = opts.h || 210, each = Math.floor(total / n);
    const trayW = Math.min(150, (W - 60) / n - 12), gap = 12;
    const totalW = n * trayW + (n - 1) * gap, x0 = (W - totalW) / 2;
    let body = blank(W, H, '#fff8ec');
    for (let t = 0; t < n; t += 1) {
      const tx = x0 + t * (trayW + gap);
      body += `<path d="M${tx} 62h${trayW}l-${trayW * 0.12} ${H - 92} h-${trayW * 0.76}Z" fill="#e9d9bd" stroke="#8a6a3d" stroke-width="2.4"/>`;
      for (let i = 0; i < each; i += 1) {
        const cx = tx + 20 + (i % 3) * ((trayW - 40) / 3);
        const cy = 86 + Math.floor(i / 3) * 26;
        body += `<circle cx="${cx}" cy="${cy}" r="9.5" fill="${DOT}"/>`;
      }
    }
    return wrap(W, H, opts.label || `${total} dates dealt into ${n} equal trays`, body, opts.max);
  }

  /* ---- a number line from 0 to 1 cut into `den` equal parts, with an optional marker ---- */
  function fracLine(den, opts) {
    opts = opts || {};
    const W = 620, H = opts.h || 200, pad = 46, y = 120;
    const span = W - pad * 2;
    let body = blank(W, H, opts.fill || '#f3f7ff');
    body += `<line x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    for (let i = 0; i <= den; i += 1) {
      const x = pad + (span * i) / den;
      body += `<line x1="${x}" y1="${y - 11}" x2="${x}" y2="${y + 11}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
      if (i === 0) body += label('0', x, y + 38, 19, INK);
      else if (i === den) body += label('1', x, y + 38, 19, INK);
      else if (opts.numberAll) body += label(`${i}/${den}`, x, y + 38, 14, '#5b7a99');
    }
    /* the marker sits at num/den, drawn as a dot; its label is only printed when the question supplies it */
    if (opts.at != null) {
      const x = pad + (span * opts.at) / den;
      body += `<circle cx="${x}" cy="${y}" r="9" fill="${opts.markColor || SHADE}" stroke="#fff" stroke-width="2.5"/>`;
      if (opts.atLabel) body += label(opts.atLabel, x, y - 30, 20, opts.markColor || SHADE);
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a number line from 0 to 1 cut into ${den} equal parts`, body, opts.max);
  }

  /* ---- a fraction bar: den equal parts, num shaded; labels optional ---- */
  function fracBar(num, den, opts) {
    opts = opts || {};
    const W = 520, H = opts.h || 132, pad = 40, y = 44, bh = 52;
    const span = W - pad * 2;
    let body = blank(W, H, opts.fill || '#f7f4ff');
    for (let i = 0; i < den; i += 1) {
      const x = pad + (span * i) / den;
      body += `<rect x="${x}" y="${y}" width="${span / den}" height="${bh}" fill="${i < num ? SHADE : '#fff'}" stroke="${INK}" stroke-width="2.2"/>`;
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a bar cut into ${den} equal parts with ${num} shaded`, body, opts.max);
  }

  /* ---- two fraction bars stacked, for equivalence ---- */
  function fracPair(aTop, aBot, bTop, bBot, opts) {
    opts = opts || {};
    const W = 560, H = 260;
    let body = blank(W, H, '#fbf8ff');
    const bar = (num, den, y) => {
      const pad = 90, span = W - pad * 2;
      let g = '';
      for (let i = 0; i < den; i += 1) {
        const x = pad + (span * i) / den;
        g += `<rect x="${x}" y="${y}" width="${span / den}" height="48" fill="${i < num ? SHADE : '#fff'}" stroke="${INK}" stroke-width="2"/>`;
      }
      /* the equal-part ticks are the whole point, so they are drawn over both bars' edges */
      return g + `<path d="M${pad} ${y + 24}h${span}" stroke="#fff" stroke-width="0" />`;
    };
    body += bar(aTop, aBot, 52);
    body += bar(bTop, bBot, 160);
    body += `<path d="M${W / 2} 104v50" stroke="#b9a888" stroke-width="2.4" stroke-dasharray="5 5"/>`;
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'two fraction bars for comparing', body, opts.max);
  }

  /* ---- area: a rectangle tiled in unit squares, side lengths optional ---- */
  function tiles(w, h, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 300, unit = Math.min(48, 330 / Math.max(w, h));
    const gw = w * unit, gh = h * unit, x0 = (W - gw) / 2, y0 = (H - gh) / 2 + 6;
    let body = blank(W, H, opts.fill || '#fff8ef');
    for (let r = 0; r < h; r += 1) {
      for (let c = 0; c < w; c += 1) {
        body += `<rect x="${x0 + c * unit}" y="${y0 + r * unit}" width="${unit}" height="${unit}" fill="${(r + c) % 2 ? '#f6dcc0' : '#fbead7'}" stroke="${INK}" stroke-width="1.6"/>`;
      }
    }
    if (opts.sides) {
      body += label(String(w), W / 2, y0 - 12, 19, '#8a5a1f');
      body += label(String(h), x0 - 18, y0 + gh / 2 + 6, 19, '#8a5a1f');
    }
    return wrap(W, H, opts.label || `a rectangle ${w} unit squares wide and ${h} tall`, body, opts.max);
  }

  /* ---- perimeter: a fenced rectangle; the two side lengths are given, the walk is not ---- */
  function fence(w, h, opts) {
    opts = opts || {};
    const W = 560, H = 260, unit = Math.min(46, 320 / Math.max(w, h));
    const gw = w * unit, gh = h * unit, x0 = (W - gw) / 2, y0 = (H - gh) / 2;
    let body = blank(W, H, '#f2fbf4');
    body += `<rect x="${x0}" y="${y0}" width="${gw}" height="${gh}" fill="#dcf0e2" stroke="#8a6a3d" stroke-width="5" stroke-dasharray="12 7"/>`;
    body += label(`${w} m`, W / 2, y0 - 14, 20, '#3f7d4f');
    body += label(`${w} m`, W / 2, y0 + gh + 30, 20, '#3f7d4f');
    body += label(`${h} m`, x0 - 26, y0 + gh / 2 + 7, 20, '#3f7d4f');
    body += label(`${h} m`, x0 + gw + 26, y0 + gh / 2 + 7, 20, '#3f7d4f');
    return wrap(W, H, opts.label || `a rectangle ${w} metres by ${h} metres with fencing on all four sides`, body, opts.max);
  }

  /* ---- rounding: a number line between two tens/hundreds with the number marked ---- */
  function roundLine(lo, hi, n, opts) {
    opts = opts || {};
    const W = 600, H = 190, pad = 60, y = 112, span = W - pad * 2;
    const mid = (lo + hi) / 2, x = pad + (span * (n - lo)) / (hi - lo);
    let body = blank(W, H, '#fffaf0');
    body += `<line x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    body += `<line x1="${pad + span / 2}" y1="${y - 26}" x2="${pad + span / 2}" y2="${y + 26}" stroke="#c9a227" stroke-width="3" stroke-dasharray="6 5"/>`;
    [[lo, pad], [hi, W - pad]].forEach(([v, px]) => {
      body += `<line x1="${px}" y1="${y - 12}" x2="${px}" y2="${y + 12}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
      body += label(String(v), px, y + 40, 20, INK);
    });
    body += `<circle cx="${x}" cy="${y}" r="10" fill="${BRAND}" stroke="#fff" stroke-width="2.6"/>`;
    body += label(String(n), x, y - 34, 20, BRAND);
    body += label(opts.caption || `halfway is ${mid}`, W / 2, H - 14, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a number line from ${lo} to ${hi} with ${n} marked`, body, opts.max);
  }

  /* a tidy fraction glyph for prompts and option tiles */
  const frac = (a, b, size) => `<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-size:${size || 22}px;font-weight:900"><span>${a}</span><span style="border-top:3px solid currentColor;width:100%;min-width:1.1em"></span><span>${b}</span></span>`;
  const times = '<span style="font-size:20px">×</span>';
  const divide = '<span style="font-size:20px">÷</span>';

  return { groups, dots, share, fracLine, fracBar, fracPair, tiles, fence, roundLine, frac, times, divide, wrap, label };
})();

/* scenes-4.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 4 PICTURE LIBRARY — area models for multiplication, division scaffolds, hundredths grids,
   four-place charts, protractor angles and fraction sums.
   Same rules as scenes.js / scenes-2.js / scenes-3.js: a picture is generated from the numbers the question
   asks about, and nothing prints a value the child is meant to work out. A cell in an area model is blank
   until the question supplies that product; an angle carries its degrees only when the question states them.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE4 = (() => {
  const INK = '#2c3a4a', PAPER = '#fffaf0', BRAND = '#2b6f8f';
  const CELL = '#fde8cd', CELL2 = '#f7d9b4', EDGE = '#8a5a1f';
  const SHADE = '#3b6fb6', GRID = '#b9a888';
  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (txt, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}"${extra || ''}>${txt}</text>`;

  /* split a number into its place-value parts, so 24 becomes [20, 4] and 8 stays [8] */
  const parts = (n) => {
    if (n < 10) return [n];
    if (n < 100) return [Math.floor(n / 10) * 10, n % 10].filter((p) => p > 0);
    return [Math.floor(n / 100) * 100, Math.floor((n % 100) / 10) * 10, n % 10].filter((p) => p > 0);
  };

  /* ---- an area model: the rectangle split along both dimensions. Cells hold their product only when asked ---- */
  function areaModel(a, b, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 330, padX = 92, padY = 66;
    const spanX = W - padX - 48, spanY = H - padY - 58;
    const pa = parts(a), pb = parts(b);
    /* widths follow the value of each part so the model keeps its proportion, with a readable floor */
    const rawA = pa.map((p) => (p / a) * spanX);
    const rawB = pb.map((p) => (p / b) * spanY);
    const fix = (raw, total) => {
      const floor = 54;
      let out = raw.slice();
      for (let i = 0; i < out.length; i += 1) out[i] = Math.max(floor, out[i]);
      const k = total / out.reduce((s, v) => s + v, 0);
      return out.map((v) => v * k);
    };
    const wA = fix(rawA, spanX), hB = fix(rawB, spanY);
    let body = blank(W, H, opts.fill || '#fff7ec');
    let x = padX;
    pa.forEach((p, i) => {
      let y = padY;
      pb.forEach((q, j) => {
        const cellLabel = opts.show ? String(p * q) : (opts.labels === false ? '' : '');
        body += `<rect x="${x}" y="${y}" width="${wA[i]}" height="${hB[j]}" fill="${(i + j) % 2 ? CELL2 : CELL}" stroke="${INK}" stroke-width="2"/>`;
        if (cellLabel) body += label(cellLabel, x + wA[i] / 2, y + hB[j] / 2 + 8, 19, EDGE);
        y += hB[j];
      });
      body += label(String(p), x + wA[i] / 2, padY - 16, 20, EDGE);
      x += wA[i];
    });
    let y = padY;
    pb.forEach((q, j) => {
      body += label(String(q), padX - 30, y + hB[j] / 2 + 8, 20, EDGE);
      y += hB[j];
    });
    body += label(`${a} × ${b}`, W / 2, H - 16, 17, '#6b5a3a');
    return wrap(W, H, opts.label || `an area model for ${a} by ${b}`, body, opts.max);
  }

  /* ---- a division scaffold: the bracket and the dividend, with room for partial quotients underneath ---- */
  function divBracket(dividend, divisor, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 240, x0 = 168, y = 96;
    let body = blank(W, H, '#f4fbf5');
    body += `<path d="M${x0} 62v96" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    body += `<path d="M${x0} 62h${186}c14 0 20 10 24 22l12 30" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    body += label(String(dividend), x0 + 96, y, 34, INK);
    body += label(String(divisor), x0 - 34, y - 30, 30, BRAND);
    /* three ruled lines: the working space, which stays empty because the quotients are the answer */
    [124, 154, 184].forEach((ly) => { body += `<path d="M${x0 + 10} ${ly}h250" stroke="${GRID}" stroke-width="1.6" stroke-dasharray="6 5"/>`; });
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `${dividend} divided by ${divisor} written as a division scaffold`, body, opts.max);
  }

  /* ---- hundredths: a 10 × 10 grid with n cells shaded ---- */
  function decimalGrid(n, opts) {
    opts = opts || {};
    const W = 520, H = 300, cell = 22, gx = (W - cell * 10) / 2, gy = 48;
    let body = blank(W, H, '#f7f9ff');
    for (let r = 0; r < 10; r += 1) {
      for (let c = 0; c < 10; c += 1) {
        const i = r * 10 + c;
        body += `<rect x="${gx + c * cell}" y="${gy + r * cell}" width="${cell}" height="${cell}" fill="${i < n ? SHADE : '#fff'}" stroke="${INK}" stroke-width="1.1"/>`;
      }
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 18, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a hundred grid with ${n} squares shaded`, body, opts.max);
  }

  /* ---- a place-value chart to hundred-thousands; any one column can be blanked ----
     `hide` is the column index (0 = ten-thousands) so the caller never has to know the digits */
  /* A place-value chart of any width. Grade 4 needs to reach the MILLIONS, so the column count follows the
     number rather than being pinned at four or five. `hide` is a column index counted from the left of the
     visible chart, or a place name ('millions' ... 'ones'). */
  const PLACE_NAMES = ['millions', 'hundred-thousands', 'ten-thousands', 'thousands', 'hundreds', 'tens', 'ones'];
  const PLACE_SHORT = { millions: 'M', 'hundred-thousands': 'HTh', 'ten-thousands': 'TTh', thousands: 'Th', hundreds: 'H', tens: 'T', ones: 'O' };
  function placeChart4(n, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 220;
    /* choose the width: at least 4 columns, at most 7, always enough for the number given */
    const need = String(Math.abs(n)).length;
    const cols = Math.max(opts.cols || 0, need, opts.five === false ? 4 : Math.min(5, need));
    const total = Math.min(7, Math.max(4, cols));
    const names = PLACE_NAMES.slice(7 - total);
    const digits = String(Math.abs(n)).padStart(total, '0').split('').map(Number);
    const cw = Math.min(112, (W - 46) / total), x0 = (W - cw * total) / 2;
    const hideByName = typeof opts.hide === 'string' ? names.indexOf(opts.hide) : -1;
    let body = blank(W, H, '#f6fbff');
    digits.forEach((digit, i) => {
      const x = x0 + i * cw;
      const hide = opts.hide === i || hideByName === i;
      body += `<rect x="${x}" y="44" width="${cw}" height="78" fill="#fff" stroke="${INK}" stroke-width="2.4"/>`;
      body += label(hide ? '?' : String(digit), x + cw / 2, 102, 38, hide ? BRAND : INK);
      body += label(names[i], x + cw / 2, 148, total > 5 ? 10 : 11.5, '#6b7a8a');
    });
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a place-value chart for ${n}`, body, opts.max);
  }

  /* ---- one named shape, with the tick marks a geometer would draw: equal-length sides get matching ticks,
     parallel pairs get matching chevrons, and right angles get a small square. The marks are the evidence; the
     shape's name is never printed on it. `parallelogram` and `rhombus` are sheared so they do not read as
     rectangles at a glance. ---- */
  function shape(kind, opts) {
    opts = opts || {};
    const W = 340, H = 300, cx = W / 2, cy = H / 2 + 6;
    const stroke = `stroke="${INK}" stroke-width="4" fill="${opts.fill || '#dbe7f5'}" stroke-linejoin="round"`;
    const rightMark = (x, y, dx, dy, s2) =>
      `<path d="M${x} ${y}h${dx * s2}v${-dy * s2}h${-dx * s2}Z" fill="none" stroke="${BRAND}" stroke-width="2.6"/>`;
    const tick = (x1, y1, x2, y2, n) => {
      /* n ticks across the middle of a side, drawn perpendicular to it */
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len, px = -uy, py = ux;
      let g = '';
      for (let i = 0; i < n; i += 1) {
        const off = (i - (n - 1) / 2) * 9;
        const bx = mx + ux * off, by = my + uy * off;
        g += `<path d="M${bx - px * 9} ${by - py * 9}L${bx + px * 9} ${by + py * 9}" stroke="${BRAND}" stroke-width="3" stroke-linecap="round"/>`;
      }
      return g;
    };
    const chevron = (x1, y1, x2, y2, n) => {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len, px = -uy, py = ux;
      let g = '';
      for (let i = 0; i < n; i += 1) {
        const off = (i - (n - 1) / 2) * 12;
        const bx = mx + ux * off, by = my + uy * off;
        g += `<path d="M${bx - ux * 7 + px * 8} ${by - uy * 7 + py * 8}L${bx} ${by}L${bx - ux * 7 - px * 8} ${by - uy * 7 - py * 8}" fill="none" stroke="#8a5fc4" stroke-width="2.8" stroke-linejoin="round"/>`;
      }
      return g;
    };
    let body = blank(W, H, opts.fill2 || '#f7f9fd');
    if (kind === 'square') {
      const r = 76;
      body += `<rect x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}" ${stroke}/>`;
      body += rightMark(cx - r, cy - r, 1, -1, 18); body += rightMark(cx + r, cy - r, -1, -1, 18);
      body += tick(cx - r, cy - r, cx + r, cy - r, 1) + tick(cx - r, cy + r, cx + r, cy + r, 1);
      body += tick(cx - r, cy - r, cx - r, cy + r, 2) + tick(cx + r, cy - r, cx + r, cy + r, 2);
    } else if (kind === 'rectangle') {
      body += `<rect x="${cx - 108}" y="${cy - 62}" width="216" height="124" ${stroke}/>`;
      body += rightMark(cx - 108, cy - 62, 1, -1, 18) + rightMark(cx + 108, cy - 62, -1, -1, 18);
    } else if (kind === 'triangle') {
      const r = 92;
      body += `<polygon points="${cx},${cy - r} ${cx - r},${cy + r * 0.78} ${cx + r},${cy + r * 0.78}" ${stroke}/>`;
      body += tick(cx, cy - r, cx - r, cy + r * 0.78, 1) + tick(cx - r, cy + r * 0.78, cx + r, cy + r * 0.78, 1) + tick(cx, cy - r, cx + r, cy + r * 0.78, 1);
    } else if (kind === 'rhombus') {
      const a = 96, b = 62;
      body += `<polygon points="${cx},${cy - a} ${cx + b},${cy} ${cx},${cy + a} ${cx - b},${cy}" ${stroke}/>`;
      body += tick(cx, cy - a, cx + b, cy, 1) + tick(cx + b, cy, cx, cy + a, 1) + tick(cx, cy + a, cx - b, cy, 1) + tick(cx - b, cy, cx, cy - a, 1);
      body += chevron(cx, cy - a, cx + b, cy, 1) + chevron(cx - b, cy, cx, cy + a, 1);
    } else {
      /* parallelogram: sheared rectangle, both pairs parallel, no right angles */
      const w = 200, h = 108, sk = 44;
      const pts = [[cx - w / 2 + sk, cy - h / 2], [cx + w / 2 + sk, cy - h / 2], [cx + w / 2 - sk, cy + h / 2], [cx - w / 2 - sk, cy + h / 2]];
      body += `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" ${stroke}/>`;
      body += chevron(...pts[0], ...pts[1], 1) + chevron(...pts[3], ...pts[2], 1);
      body += chevron(...pts[0], ...pts[3], 2) + chevron(...pts[1], ...pts[2], 2);
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 14, '#5b6b7a');
    return wrap(W, H, opts.label || `a ${kind}`, body, opts.max);
  }

  /* ---- an angle: one ray fixed to the right, the other opened by `deg` ---- */
  function angle(deg, opts) {
    opts = opts || {};
    const W = 520, H = 300, cx = 110, cy = 232, r = 250;
    const rad = (deg * Math.PI) / 180;
    const ex = cx + r * Math.cos(rad), ey = cy - r * Math.sin(rad);
    const ar = 62;
    const ax = cx + ar * Math.cos(rad), ay = cy - ar * Math.sin(rad);
    let body = blank(W, H, '#fffaf0');
    /* protractor: a half circle with 10° ticks, no numbers, so the child reads the marks or reasons about them */
    if (opts.protractor) {
      const pr = 226;
      body += `<path d="M${cx - pr} ${cy} a${pr} ${pr} 0 0 1 ${pr * 2} 0" fill="#fdf6e6" stroke="${INK}" stroke-width="2.2"/>`;
      for (let t = 0; t <= 180; t += 10) {
        const tr = (t * Math.PI) / 180;
        const len = t % 30 === 0 ? 18 : 10;
        body += `<path d="M${cx + (pr - len) * Math.cos(tr)} ${cy - (pr - len) * Math.sin(tr)}L${cx + pr * Math.cos(tr)} ${cy - pr * Math.sin(tr)}" stroke="${t % 30 === 0 ? INK : GRID}" stroke-width="${t % 30 === 0 ? 2 : 1.3}"/>`;
      }
    }
    body += `<path d="M${cx} ${cy}L${cx + r} ${cy}" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
    body += `<path d="M${cx} ${cy}L${ex} ${ey}" stroke="${BRAND}" stroke-width="4.5" stroke-linecap="round"/>`;
    body += `<path d="M${cx + ar} ${cy}A${ar} ${ar} 0 0 ${deg > 180 ? 1 : 0} ${ax} ${ay}" fill="none" stroke="${BRAND}" stroke-width="2.6" stroke-dasharray="5 4"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="6" fill="${INK}"/>`;
    if (opts.showDeg) body += label(`${deg}°`, cx + 96 * Math.cos(rad / 2), cy - 96 * Math.sin(rad / 2) + 6, 22, BRAND);
    if (opts.caption) body += label(opts.caption, W / 2, H - 12, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `an angle of ${deg} degrees`, body, opts.max);
  }

  /* ---- two fraction bars with a plus sign between them: the sum is not printed ---- */
  function fracSum(n1, d, n2, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 190, bw = 210, bh = 54, y = 66;
    const bar = (x, num, den) => {
      let g = '';
      for (let i = 0; i < den; i += 1) {
        g += `<rect x="${x + (bw / den) * i}" y="${y}" width="${bw / den}" height="${bh}" fill="${i < num ? SHADE : '#fff'}" stroke="${INK}" stroke-width="2"/>`;
      }
      return g;
    };
    let body = blank(W, H, '#f8f6ff');
    body += bar(52, n1, d);
    body += bar(338, n2, d);
    body += label('+', 300, y + 40, 34, '#5b4a7a');
    body += label(opts.caption || '', W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `two fraction bars of the same denominator`, body, opts.max);
  }

  /* a mixed number as a whole bar plus a partial bar, drawn above the label so the words do the counting */
  function mixedBar(whole, num, den, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 170, bh = 44;
    let body = blank(W, H, '#f8f6ff');
    const drawBar = (x, y, n, d, filled) => {
      let g = '';
      for (let i = 0; i < d; i += 1) {
        g += `<rect x="${x + (140 / d) * i}" y="${y}" width="${140 / d}" height="${bh}" fill="${i < filled ? SHADE : '#fff'}" stroke="${INK}" stroke-width="2"/>`;
      }
      return g;
    };
    for (let w = 0; w < whole; w += 1) body += drawBar(40 + w * 152, 40, 0, den, den);
    body += drawBar(40 + whole * 152, 40, 0, den, num);
    body += label(opts.caption || '', W / 2, H - 20, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a mixed number drawn as wholes and a part`, body, opts.max);
  }

  return { areaModel, divBracket, decimalGrid, placeChart4, angle, fracSum, mixedBar, shape, parts, wrap, label };
})();

/* scenes-5.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 5 PICTURE LIBRARY — unit cubes and prisms, thousandths, fraction area models, a first-quadrant
   coordinate plane, a circle with a marked central angle, percent bars, an architecture grid of regular
   tiles, and a navigator's bearing rose.

   Same rules as scenes.js / scenes-2.js / scenes-3.js / scenes-4.js: a picture is generated from the numbers
   the question is about, and it never prints a value the child is meant to work out. The prism shows the
   stack, not the answer; the coordinate plane shows the points, not the ordered pair; the circle shows the
   wedge, not the degree count.

   NOTE — no `const UNITS` or other generic top-level name lives here: a grade-5 source file may declare its
   own. Everything is namespaced under SCENE5.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE5 = (() => {
  const INK = '#243244', PAPER = '#fffdf6', BRAND = '#2f6f9f', EDGE = '#8a5a1f';
  const CUBE = '#cfe4f6', CUBE2 = '#a9cdec', CUBE_TOP = '#e6f2fc', HIDDEN = '#eef3f7';
  const GRID = '#b9c6d4', SHADE = '#3b6fb6', WARM = '#f3c98b';

  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (txt, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}"${extra || ''}>${txt}</text>`;
  const txt = (t, x, y, size, color, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-size="${size || 15}" font-weight="700" fill="${color || INK}">${t}</text>`;

  /* ── a cube: three rhombi, top face lighter so the stack reads as depth ───────────────────────────── */
  function cube(x, y, s, opts) {
    opts = opts || {};
    const k = s * 0.42;
    const top = opts.fill || CUBE_TOP, left = opts.fill || CUBE, right = opts.fill2 || CUBE2;
    return `<path d="M${x} ${y - k / 2}L${x + s / 2} ${y - k / 2 - s * 0.36}L${x + s} ${y - k / 2}L${x + s / 2} ${y - k / 2 + s * 0.36}Z" fill="${top}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`
      + `<path d="M${x} ${y - k / 2}L${x + s / 2} ${y - k / 2 + s * 0.36}L${x + s / 2} ${y - k / 2 + s * 0.36 + s}L${x} ${y - k / 2 + s}Z" fill="${left}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`
      + `<path d="M${x + s} ${y - k / 2}L${x + s / 2} ${y - k / 2 + s * 0.36}L${x + s / 2} ${y - k / 2 + s * 0.36 + s}L${x + s} ${y - k / 2 + s}Z" fill="${right}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  /* ── unitCubePrism: an l × w × h prism drawn as a stack of visible unit cubes ──────────────────────
     Nothing is printed: the child counts the cubes, or counts a layer and the layers. Kept to small
     dimensions so the cubes stay legible at 390 px. */
  function unitCubePrism(l, w, h, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 360;
    const s = Math.min(46, 330 / Math.max(l, w), 190 / Math.max(1, h));
    const k = s * 0.36;
    const ox = 96, oy = H - 78;
    let body = blank(W, H, opts.fill || '#f8fbfe');
    /* back-to-front so nearer cubes overlap farther ones */
    for (let lay = 0; lay < h; lay += 1) {
      for (let row = w - 1; row >= 0; row -= 1) {
        for (let col = 0; col < l; col += 1) {
          const x = ox + col * s + row * (s * 0.5);
          const y = oy - lay * s - row * k;
          const shade = lay === h - 1 ? 0 : 6;
          body += cube(x, y, s, {
            fill: shade ? '#dbeaf8' : CUBE_TOP,
            fill2: shade ? '#bed7ef' : CUBE2,
          });
        }
      }
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 18, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a prism ${l} cubes long, ${w} wide and ${h} tall, drawn in unit cubes`, body, opts.max);
  }

  /* ── plain cuboid (no interior cubes) for the volume-formula lessons ──────────────────────────────── */
  function prism(l, w, h, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 320;
    const cx = W / 2, cy = H / 2 + 22;
    const dx = 150, dy = 86, dz = 104;              /* horizontal span, depth, height — all in px */
    /* length runs right, height runs up, width runs back-right at 30° */
    const A = [cx - dx, cy];
    const B = [cx + dx, cy];
    const C = [cx + dx + dz * 0.62, cy - dz * 0.46];
    const D = [cx - dx + dz * 0.62, cy - dz * 0.46];
    const A2 = [A[0], A[1] - dy], B2 = [B[0], B[1] - dy], C2 = [C[0], C[1] - dy], D2 = [D[0], D[1] - dy];
    const p = (pt) => `${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`;
    let body = blank(W, H, opts.fill || '#f8fbfe');
    body += `<path d="M${p(A)}L${p(B)}L${p(C)}L${p(D)}Z" fill="#c7dcef" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    body += `<path d="M${p(A2)}L${p(B2)}L${p(B)}L${p(A)}Z" fill="#e2eefa" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    body += `<path d="M${p(B2)}L${p(C2)}L${p(C)}L${p(B)}Z" fill="#adcbe6" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    body += `<path d="M${p(A2)}L${p(D2)}L${p(C2)}L${p(B2)}Z" fill="#f0f7fd" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    /* dimension marks only where the question supplies the number */
    if (opts.dims) {
      const d = opts.dims;
      if (d.l != null) body += txt(`${d.l}`, (A[0] + B[0]) / 2, cy + 30, 20, BRAND, 'middle');
      if (d.h != null) body += txt(`${d.h}`, A2[0] - 18, (A[1] + A2[1]) / 2 + 6, 20, BRAND, 'middle');
      if (d.w != null) body += txt(`${d.w}`, (C[0] + B[0]) / 2 + 14, (C[1] + B[1]) / 2 - 4, 20, BRAND, 'middle');
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'a rectangular prism with its three dimensions', body, opts.max);
  }

  /* ── compositePrism: an L-shaped solid made of two non-overlapping prisms ──────────────────────────
     opts.split=true draws the cut line, so the child sees the two pieces before adding them. Never
     prints either piece's volume. */
  function compositePrism(opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 380;
    const u = 44, ox = 118, oy = H - 84;
    /* an L: a tall left arm of 2×2 footprint and a low right arm, both 1 cube deep, arm heights given */
    const armH = opts.armH || 3, restH = opts.restH || 1, armW = opts.armW || 2, restW = opts.restW || 3;
    const dep = opts.depth || 1;
    const k = u * 0.5;
    let body = blank(W, H, '#f8fbfe');
    const draw = (colFrom, colTo, height) => {
      for (let lay = 0; lay < height; lay += 1) {
        for (let row = dep - 1; row >= 0; row -= 1) {
          for (let col = colFrom; col < colTo; col += 1) {
            body += cube(ox + col * u + row * (u * 0.5), oy - lay * u - row * k, u, {});
          }
        }
      }
    };
    draw(0, armW, armH);
    draw(armW, armW + restW, restH);
    if (opts.split) {
      const x = ox + armW * u;
      body += `<path d="M${x} ${oy - armH * u}L${x} ${oy + 6}" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>`;
      body += label('the cut', x, oy + 26, 14, '#c0392b');
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, 'an L-shaped solid drawn as two rectangular prisms side by side', body, opts.max);
  }

  /* ── thousandthsGrid: one whole cut into 1000 — a 10×10×10 block flattened into ten 10×10 sheets ────
     opts.shown = how many whole sheets to draw (usually 1 or 2); opts.shade{n,h,t} shades n hundredths,
     h tenths, t thousandths on the first sheet. The number is never printed. */
  function thousandthsGrid(shown, shade, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 300;
    const sheetW = 216, sheetH = 216, gap = 26;
    const y0 = 40;
    let body = blank(W, H, opts.fill || '#fbfdff');
    for (let s = 0; s < (shown || 1); s += 1) {
      const x0 = 34 + s * (sheetW + gap);
      for (let i = 0; i < 10; i += 1) {
        for (let j = 0; j < 10; j += 1) {
          let fill = '#fff';
          if (s === 0 && shade) {
            if (shade.t && i * 10 + j < (shade.t % 10) + (shade.h || 0) * 10) fill = '#244a75';
            else if (shade.h && i < shade.h) fill = SHADE;
          }
          body += `<rect x="${x0 + j * (sheetW / 10)}" y="${y0 + i * (sheetH / 10)}" width="${sheetW / 10}" height="${sheetH / 10}" fill="${fill}" stroke="${GRID}" stroke-width="0.9"/>`;
        }
      }
      body += `<rect x="${x0}" y="${y0}" width="${sheetW}" height="${sheetH}" fill="none" stroke="${INK}" stroke-width="2.4"/>`;
      body += label(`sheet ${['١', '٢', '٣'][s] || s + 1}`, x0 + sheetW / 2, y0 + sheetH + 26, 15, '#5b6b7a');
    }
    body += label('each sheet is 100 of 1000 · ten sheets make one whole', W / 2, H - 14, 14.5, '#5b6b7a');
    return wrap(W, H, opts.label || 'one whole cut into one thousand equal parts', body, opts.max);
  }

  /* ── powerShift: a digit card sliding along a place-value strip for ×/÷ by a power of ten ────────── */
  function powerShift(digits, from, to, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 210;
    const names = ['tens', 'ones', '.', 'tenths', 'hundredths', 'thousandths'];
    const n = names.length, cw = Math.min(88, (W - 60) / n), x0 = (W - cw * n) / 2;
    let body = blank(W, H, '#f9fcff');
    names.forEach((nm, i) => {
      const x = x0 + i * cw;
      body += `<rect x="${x}" y="46" width="${cw}" height="64" fill="${nm === '.' ? '#f5e6c8' : '#fff'}" stroke="${nm === '.' ? EDGE : INK}" stroke-width="2.2"/>`;
      body += label(nm, x + cw / 2, 132, 11.5, '#6b7a8a');
    });
    /* the card sits in `from`, a ghost shows where it lands in `to` */
    const card = (col, alpha, tag) => {
      const x = x0 + col * cw + 6;
      return `<g opacity="${alpha}"><rect x="${x}" y="54" width="${cw - 12}" height="48" rx="9" fill="${BRAND}" stroke="${INK}" stroke-width="2"/>`
        + label(digits, x + (cw - 12) / 2, 87, 24, '#fff') + `</g>`
        + (tag ? label(tag, x + (cw - 12) / 2, 40, 13, BRAND) : '');
    };
    if (to !== from) body += card(from, 0.28 + 0, '');
    body += card(to, 1, '');
    const a = x0 + from * cw + cw / 2, b = x0 + to * cw + cw / 2;
    const dir = b > a ? 1 : -1;
    body += `<path d="M${a + dir * 22} 178L${b - dir * 26} 178" stroke="${BRAND}" stroke-width="3" marker-end="url(#a5)"/>`;
    body += `<defs><marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="${BRAND}"/></marker></defs>`;
    if (opts.caption) body += label(opts.caption, W / 2, H - 12, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'a digit card moved along the place-value strip', body, opts.max);
  }

  /* ── fracArea: the product of two fractions as an overlapping area model ──────────────────────────
     a/b × c/d: a square cut into b columns and d rows; the first fraction shades a columns, the second
     shades c rows, and the overlap is the product. Nothing is simplified or printed. */
  function fracArea(a, b, c, d, opts) {
    opts = opts || {};
    const W = 400, H = opts.h || 400, pad = 40, side = Math.min(300, W - pad * 2);
    const x0 = (W - side) / 2, y0 = 34;
    let body = blank(W, H, '#fbf8ff');
    for (let i = 0; i < b; i += 1) {
      for (let j = 0; j < d; j += 1) {
        const inCols = i < a, inRows = j < c;
        const fill = inCols && inRows ? '#3b6fb6' : inCols ? '#bcd6ef' : inRows ? '#f6dfc0' : '#fff';
        body += `<rect x="${x0 + (side / b) * i}" y="${y0 + (side / d) * j}" width="${side / b}" height="${side / d}" fill="${fill}" stroke="${GRID}" stroke-width="1"/>`;
      }
    }
    body += `<rect x="${x0}" y="${y0}" width="${side}" height="${side}" fill="none" stroke="${INK}" stroke-width="2.6"/>`;
    body += label('the overlap is the product', W / 2, y0 + side + 30, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'an area model of one fraction of another', body, opts.max);
  }

  /* ── coordinatePlane: first quadrant only, 0..max, optional points ─────────────────────────────────
     opts.points = [[x,y,tag]…]; a tag only prints when the question gives it. Axes are labelled x and y
     and numbered at 1-step spacing so the child reads the pair off the grid. */
  function coordinatePlane(opts) {
    opts = opts || {};
    /* `scale` is the axis maximum, `max` is the rendered width — they must not share a name */
    const W = 480, H = opts.h || 460, max = opts.scale || 8;
    const padL = 54, padB = 52, padT = 30, padR = 34;
    const side = Math.min(W - padL - padR, H - padB - padT);
    const x0 = padL, y0 = H - padB;
    const step = side / max;
    let body = blank(W, H, '#fbfdff');
    for (let i = 1; i <= max; i += 1) {
      body += `<path d="M${x0 + i * step} ${y0}V${y0 - side}" stroke="${GRID}" stroke-width="1"/>`;
      body += `<path d="M${x0} ${y0 - i * step}H${x0 + side}" stroke="${GRID}" stroke-width="1"/>`;
      body += txt(`${i}`, x0 + i * step, y0 + 20, 13, '#6b7a8a', 'middle');
      body += txt(`${i}`, x0 - 12, y0 - i * step + 5, 13, '#6b7a8a', 'middle');
    }
    body += `<path d="M${x0} ${y0 - side - 8}V${y0}H${x0 + side + 8}" fill="none" stroke="${INK}" stroke-width="2.8"/>`;
    body += txt('y', x0 - 6, y0 - side - 12, 17, INK, 'middle');
    body += txt('x', x0 + side + 16, y0 + 6, 17, INK, 'middle');
    body += txt('0', x0 - 10, y0 + 18, 13, '#6b7a8a', 'middle');
    (opts.points || []).forEach(([px, py, tag]) => {
      const cx2 = x0 + px * step, cy2 = y0 - py * step;
      body += `<circle cx="${cx2}" cy="${cy2}" r="7" fill="${opts.dot || '#c0392b'}" stroke="#fff" stroke-width="2"/>`;
      if (tag) body += txt(tag, cx2 + 12, cy2 - 10, 15, '#c0392b');
    });
    if (opts.path && opts.path.length > 1) {
      body += `<path d="M${opts.path.map(([px, py]) => `${x0 + px * step} ${y0 - py * step}`).join('L')}" fill="none" stroke="${BRAND}" stroke-width="2.6" stroke-dasharray="6 5"/>`;
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 12, 14.5, '#5b6b7a');
    return wrap(W, H, opts.label || 'a coordinate plane in the first quadrant', body, opts.max);
  }

  /* ── circleAngle: a circle with a shaded sector of `deg`, optional protractor ticks ─────────────── */
  function circleAngle(deg, opts) {
    opts = opts || {};
    const W = 420, H = 380, cx = W / 2, cy = 176, r = 132;
    let body = blank(W, H, '#fffdf6');
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2.6"/>`;
    if (opts.ticks !== false) {
      for (let t = 0; t < 360; t += 15) {
        const a1 = (t * Math.PI) / 180, len = t % 90 === 0 ? 13 : 7;
        body += `<path d="M${cx + (r - len) * Math.cos(a1)} ${cy - (r - len) * Math.sin(a1)}L${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)}" stroke="${t % 90 === 0 ? INK : GRID}" stroke-width="${t % 90 === 0 ? 2 : 1.2}"/>`;
      }
    }
    const a0 = 0, a1 = (-deg * Math.PI) / 180;
    const big = deg > 180 ? 1 : 0;
    body += `<path d="M${cx} ${cy}L${cx + r} ${cy}A${r} ${r} 0 ${big} 0 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}Z" fill="${SHADE}" fill-opacity=".30" stroke="${BRAND}" stroke-width="2.6"/>`;
    body += `<path d="M${cx} ${cy}L${cx + r} ${cy}" stroke="${INK}" stroke-width="2.6"/>`;
    body += `<path d="M${cx} ${cy}L${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}" stroke="${BRAND}" stroke-width="2.6"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="5" fill="${INK}"/>`;
    if (opts.showDeg) body += label(`${deg}°`, cx + 62 * Math.cos(a1 / 2), cy + 62 * Math.sin(a1 / 2) + 6, 19, BRAND);
    if (opts.caption) body += label(opts.caption, W / 2, H - 16, 15, '#5b6b7a');
    return wrap(W, H, opts.label || `a circle with a sector of ${deg} degrees`, body, opts.max);
  }

  /* ── spyglass / star clock: the night-sky circle used by the astronomy lesson ────────────────────── */
  function starClock(deg, opts) {
    opts = opts || {};
    const W = 420, H = 400, cx = W / 2, cy = 190, r = 148;
    let body = blank(W, H, '#101c2e');
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#17263c" stroke="#8fb3d9" stroke-width="2"/>`;
    for (let t = 0; t < 360; t += 30) {
      const a1 = (t * Math.PI) / 180;
      body += `<path d="M${cx + (r - 14) * Math.cos(a1)} ${cy - (r - 14) * Math.sin(a1)}L${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)}" stroke="#8fb3d9" stroke-width="2"/>`;
      body += `<text x="${cx + (r - 30) * Math.cos(a1)}" y="${cy - (r - 30) * Math.sin(a1) + 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#9ec4e8">${t}°</text>`;
    }
    const a1 = (-deg * Math.PI) / 180;
    body += `<path d="M${cx} ${cy}L${cx + r} ${cy}A${r} ${r} 0 ${deg > 180 ? 1 : 0} 0 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}Z" fill="#f6c95c" fill-opacity=".22" stroke="#f6c95c" stroke-width="2.4"/>`;
    body += `<path d="M${cx} ${cy}L${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}" stroke="#f6c95c" stroke-width="2.6"/>`;
    body += `<path d="M${cx} ${cy}L${cx + r} ${cy}" stroke="#cfe4f6" stroke-width="2.6"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="5" fill="#f6c95c"/>`;
    if (opts.caption) body += `<text x="${W / 2}" y="${H - 16}" text-anchor="middle" font-size="15" font-weight="700" fill="#9ec4e8">${opts.caption}</text>`;
    return wrap(W, H, opts.label || 'a night-sky circle used as a star clock', body, opts.max);
  }

  /* ── percentBar: a 20-cell double bar for percent ↔ fraction ↔ decimal ──────────────────────────── */
  function percentBar(pct, opts) {
    opts = opts || {};
    const W = 520, H = opts.h || 176, pad = 36, y = 48, bh = 58, cells = 20;
    const span = W - pad * 2, cw = span / cells;
    const on = Math.round((pct / 100) * cells);
    let body = blank(W, H, '#f7fbfb');
    for (let i = 0; i < cells; i += 1) {
      body += `<rect x="${pad + i * cw}" y="${y}" width="${cw}" height="${bh}" fill="${i < on ? '#1f8a70' : '#fff'}" stroke="${i % 5 === 0 ? INK : GRID}" stroke-width="${i % 5 === 0 ? 2 : 1}"/>`;
    }
    for (let k = 0; k <= 100; k += 20) {
      body += txt(`${k}%`, pad + (span * k) / 100, y + bh + 24, 13, '#4a5b6a', 'middle');
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 14, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'a bar cut into twenty equal cells, five cells to every twenty percent', body, opts.max);
  }

  /* ── tileGrid: a wall of regular polygons — the zoning / zellige lesson counts tiles, edges, vertices ── */
  function tileGrid(kind, cols, rows, opts) {
    opts = opts || {};
    const W = 560, H = opts.h || 360;
    const s = Math.min(46, (W - 70) / (cols + 1), (H - 90) / (rows + 1));
    const ox = (W - cols * s * 1.02) / 2, oy = 44;
    const poly = (cx, cy, n, rot) => {
      const pts = [];
      for (let i = 0; i < n; i += 1) {
        const a = (Math.PI * 2 * i) / n + (rot || 0);
        pts.push(`${(cx + s * 0.52 * Math.cos(a)).toFixed(1)} ${(cy + s * 0.52 * Math.sin(a)).toFixed(1)}`);
      }
      return pts.join(' ');
    };
    let body = blank(W, H, '#fdf8f0');
    const n = kind === 'triangle' ? 3 : kind === 'hex' ? 6 : kind === 'octagon' ? 8 : 4;
    const rot = kind === 'square' ? Math.PI / 4 : kind === 'triangle' ? -Math.PI / 2 : Math.PI / 6;
    let count = 0;
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const cx = ox + c * s * 1.02 + ((kind === 'triangle' && r % 2) ? s * 0.5 : 0);
        const cy = oy + r * s * 0.92;
        if (kind === 'triangle' && (c + r) % 2) continue;
        const fill = (r + c) % 3 === 0 ? '#e8d3b0' : (r + c) % 3 === 1 ? '#d9e8dd' : '#efdcd6';
        body += `<polygon points="${poly(cx, cy, n, rot)}" fill="${fill}" stroke="${EDGE}" stroke-width="2"/>`;
        count += 1;
      }
    }
    body += label(opts.caption || `${count} tiles`, W / 2, H - 16, 15, '#6b5a3a');
    return wrap(W, H, opts.label || `a wall of regular ${kind}s`, body, opts.max);
  }

  /* ── bearingRose: a compass rose with a plotted course, for the navigation lesson ───────────────── */
  function bearingRose(bearing, opts) {
    opts = opts || {};
    const W = 400, H = 400, cx = W / 2, cy = H / 2, r = 148;
    let body = blank(W, H, '#f2f9ff');
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2.4"/>`;
    ['N', 'E', 'S', 'W'].forEach((d, i) => {
      const a = (Math.PI / 2) * i - Math.PI / 2;
      body += `<path d="M${cx + (r - 12) * Math.cos(a)} ${cy + (r - 12) * Math.sin(a)}L${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}" stroke="${INK}" stroke-width="3"/>`;
      body += `<text x="${cx + (r + 2) * Math.cos(a) * 1.02}" y="${cy + (r + 2) * Math.sin(a) * 1.02 + 6}" text-anchor="middle" font-size="17" font-weight="900" fill="${INK}">${d}</text>`;
    });
    for (let t = 0; t < 360; t += 15) {
      const a = ((t - 90) * Math.PI) / 180, len = t % 45 === 0 ? 12 : 6;
      body += `<path d="M${cx + (r - len) * Math.cos(a)} ${cy + (r - len) * Math.sin(a)}L${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}" stroke="${GRID}" stroke-width="1.4"/>`;
    }
    const a = ((bearing - 90) * Math.PI) / 180;
    body += `<path d="M${cx} ${cy}L${cx + r * 0.86 * Math.cos(a)} ${cy + r * 0.86 * Math.sin(a)}" stroke="${opts.color || '#c0392b'}" stroke-width="4" stroke-linecap="round" marker-end="url(#ar5)"/>`;
    body += `<defs><marker id="ar5" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="${opts.color || '#c0392b'}"/></marker></defs>`;
    body += `<circle cx="${cx}" cy="${cy}" r="5" fill="${INK}"/>`;
    if (opts.caption) body += label(opts.caption, W / 2, H - 12, 15, '#4a5b6a');
    return wrap(W, H, opts.label || 'a compass rose with a plotted bearing', body, opts.max);
  }

  /* ── barRow: a simple labelled bar chart for data questions (mean, unit rate, comparison) ───────── */
  function barRow(vals, opts) {
    opts = opts || {};
    const W = 520, H = opts.h || 280, pad = 54, y0 = H - 58;
    const maxV = Math.max.apply(null, vals.map((v) => (typeof v === 'object' ? v.v : v))) || 1;
    const bw = Math.min(64, (W - pad * 2) / vals.length * 0.7);
    const gap = (W - pad * 2) / vals.length;
    let body = blank(W, H, '#fbfdff');
    vals.forEach((raw, i) => {
      const v = typeof raw === 'object' ? raw.v : raw;
      const name = typeof raw === 'object' ? raw.name : '';
      const hgt = ((y0 - 40) * v) / maxV;
      const x = pad + i * gap + (gap - bw) / 2;
      body += `<rect x="${x}" y="${y0 - hgt}" width="${bw}" height="${hgt}" rx="7" fill="${opts.dot || '#2f6f9f'}" fill-opacity=".78" stroke="${INK}" stroke-width="2"/>`;
      if (name) body += txt(name, x + bw / 2, y0 + 22, 13.5, '#4a5b6a', 'middle');
    });
    body += `<path d="M${pad - 8} ${y0}H${W - pad + 8}" stroke="${INK}" stroke-width="2.4"/>`;
    if (opts.caption) body += label(opts.caption, W / 2, 26, 15, '#5b6b7a');
    return wrap(W, H, opts.label || 'a bar chart', body, opts.max);
  }

  return { unitCubePrism, prism, compositePrism, thousandthsGrid, powerShift, fracArea,
    coordinatePlane, circleAngle, starClock, percentBar, tileGrid, bearingRose, barRow, wrap, label };
})();

/* scenes-6.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 6 PICTURE LIBRARY — ratio tables and tape strips, a double number line, a unit-rate cart, a
   fraction-division "how many fit?" model, the integer line, an equation balance, a polygon with given
   side lengths, and a dot plot for mean / median / MAD.

   Same rules as scenes.js … scenes-5.js: a picture is generated from the numbers the question is about,
   and it never prints a value the child is meant to work out. The tape strip shows the two lengths, not
   the ratio; the balance shows the pans, not the solution; the dot plot shows the dots, not the mean.

   NOTE — no `const UNITS` or other generic top-level name lives here: a grade-6 source file may declare
   its own. Everything is namespaced under SCENE6.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE6 = (() => {
  const INK = '#243244', PAPER = '#fffdf6', BRAND = '#2f6f9f';
  const A = '#8fc4e8', B = '#f3c98b', A2 = '#5d9fd0', B2 = '#d9a55b';
  const GRID = '#b9c6d4', SHADE = '#3b6fb6', WARM = '#c0392b';

  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (t, x, y, size, color, extra) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}"${extra || ''}>${t}</text>`;
  const txt = (t, x, y, size, color, anchor) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-size="${size || 15}" font-weight="700" fill="${color || INK}">${t}</text>`;

  /* ── tapeStrip: two or three bars of matched unit width — the ratio model ─────────────────────────
     opts.parts = [[2,'water'],[3,'juice']]  (count of equal cells + its name)
     Each part is drawn as that many equal cells, so the child counts cells, not a printed ratio. */
  function tapeStrip(parts, opts) {
    opts = opts || {};
    const W = 600, H = opts.h || 150 + parts.length * 46;
    const cellW = Math.min(64, 380 / Math.max.apply(null, parts.map((p) => p[0])));
    const ox = (W - cellW * Math.max.apply(null, parts.map((p) => p[0]))) / 2;
    let body = blank(W, H, opts.fill || '#fbfdff');
    parts.forEach((p, r) => {
      const n = p[0], y = 62 + r * 58;
      body += txt(p[1], ox - 14, y + 26, 14, '#41525f', 'end');
      for (let k = 0; k < n; k += 1) {
        body += `<rect x="${ox + k * cellW}" y="${y}" width="${cellW}" height="34" rx="4" fill="${r === 0 ? A : B}" stroke="${INK}" stroke-width="1.8"/>`;
      }
      body += `<rect x="${ox}" y="${y}" width="${cellW * n}" height="34" rx="6" fill="none" stroke="${INK}" stroke-width="2.6"/>`;
    });
    body += label(opts.axisLabel || 'each cell is one equal part', W / 2, H - 22, 14, '#5b6b7a');
    if (opts.caption) body += label(opts.caption, W / 2, 34, 16, INK);
    return wrap(W, H, opts.label || `a tape strip of ${parts.map((p) => p[0] + ' ' + p[1]).join(' and ')}`, body, opts.max);
  }

  /* ── ratioTable: a two-row table with a blank column for the unknown ─────────────────────────────
     opts.a = [values], opts.b = [values]; opts.askCol = index shown as "?" */
  function ratioTable(a, b, opts) {
    opts = opts || {};
    const cols = Math.max(a.length, b.length);
    /* a one- or two-column table needs wider cells or it reads as a stray box */
    const cw = Math.min(cols <= 2 ? 150 : 92, 460 / cols), ch = 44;
    const W = 600, H = opts.h || 130 + ch * 2;
    const ox = (W - cw * cols) / 2, oy = 40;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += txt(opts.rowA || 'first', ox - 12, oy + 30, 14, '#41525f', 'end');
    body += txt(opts.rowB || 'second', ox - 12, oy + ch + 30, 14, '#41525f', 'end');
    for (let k = 0; k < cols; k += 1) {
      const x = ox + k * cw;
      const ask = opts.askCol === k;
      const top = a[k] == null ? '?' : a[k];
      const bot = b[k] == null ? '?' : b[k];
      body += `<rect x="${x}" y="${oy}" width="${cw}" height="${ch}" fill="${ask ? '#fff6d8' : (k % 2 ? '#ffffff' : '#f4f8fc')}" stroke="${GRID}" stroke-width="1.6"/>`;
      body += `<rect x="${x}" y="${oy + ch}" width="${cw}" height="${ch}" fill="${ask ? '#fff6d8' : (k % 2 ? '#f4f8fc' : '#ffffff')}" stroke="${GRID}" stroke-width="1.6"/>`;
      body += label(String(top), x + cw / 2, oy + 30, 17, INK);
      body += label(String(bot), x + cw / 2, oy + ch + 30, 17, INK);
      if (ask) body += `<rect x="${x - 2}" y="${oy - 2}" width="${cw + 4}" height="${ch * 2 + 4}" rx="6" fill="none" stroke="${WARM}" stroke-width="2.6" stroke-dasharray="6 4"/>`;
    }
    if (opts.caption) body += label(opts.caption, W / 2, H - 18, 14, '#5b6b7a');
    return wrap(W, H, opts.label || 'a ratio table with one value to find', body, opts.max);
  }

  /* ── doubleLine: a double number line — two scales aligned over the same length ───────────────────
     opts.top = [labels at ticks], opts.bottom = [labels at the same ticks]. Nothing is printed that
     the child is asked to produce; pass '' for a tick they must fill. */
  function doubleLine(top, bottom, opts) {
    opts = opts || {};
    const n = top.length - 1;
    const W = 600, H = opts.h || 170;
    const ox = 60, span = W - 120, y1 = 62, y2 = 126;
    let body = blank(W, H, opts.fill || '#fbfdff');
    body += `<line x1="${ox}" y1="${y1}" x2="${ox + span}" y2="${y1}" stroke="${INK}" stroke-width="2.4"/>`;
    body += `<line x1="${ox}" y1="${y2}" x2="${ox + span}" y2="${y2}" stroke="${INK}" stroke-width="2.4"/>`;
    for (let k = 0; k <= n; k += 1) {
      const x = ox + (span * k) / n;
      body += `<line x1="${x}" y1="${y1 - 8}" x2="${x}" y2="${y1 + 8}" stroke="${INK}" stroke-width="2.4"/>`;
      body += `<line x1="${x}" y1="${y2 - 8}" x2="${x}" y2="${y2 + 8}" stroke="${INK}" stroke-width="2.4"/>`;
      body += label(String(top[k]), x, y1 - 16, 15, top[k] === '' ? WARM : INK);

    /* grade 5 */
    '📋': 'clipboard', '🧊': 'icecube', '🌙': 'moon',
    '🦅': 'falcon', '👣': 'steps', '💯': 'hundred', '🪙': 'coin', '🍊': 'orange',
    '⌫': 'backspace', '📈': 'chart', '🕐': 'clock5', '🕑': 'clock5', '🕒': 'clock5', '🗂️': 'divider', '🗂': 'divider',
    /* grade 3 */
    '🌴': 'palm', '🧺': 'tray', '🟠': 'dots', '🛒': 'cart', '💧': 'drop', '🪟': 'window',
    '🟫': 'tile', '🚧': 'fence', '🛣️': 'road', '🛣': 'road', '🔁': 'repeat', '🧮': 'abacus3',
    '📐': 'ruler2', '🍽️': 'plates', '🍽': 'plates', '📍': 'pin', '🧾': 'receipt',
    /* grade 4 — these eight were used in the authored sources but never mapped, so they fell through the
       replacement pass and rendered as tofu boxes in the how-to list and the level chips */
    '🧶': 'yarn', '🕊️': 'dove', '🕊': 'dove', '🫖': 'pot', '🚌': 'bus',
    '➗': 'divide', '🔗': 'link', '🌉': 'trench', '🏜️': 'dune', '🏜': 'dune',
  };
  const name = (emoji) => MAP[String(emoji).trim()] || null;

  /* one symbol or one surrogate-pair emoji; the same pattern tests a node before we touch it */
  /* U+1F000–U+1FAFF is the whole emoji-pictograph block (the old pattern only covered U+1F300+ surrogate pairs,
     so 🧠 in the template's "Think first" heading and co. slipped through and rendered as a box) */
  /* a trailing U+FE0F makes an emoji render as a picture on some systems; it is matched with the glyph it
     belongs to, so the icon replacement does not leave an orphan variation selector behind as a stray box */
  const EMOJI = /([\u2190-\u21ff\u2300-\u27bf\u2b00-\u2bff\u25a0-\u25ff\u2600-\u26ff\u3030\u303d]|[\ud83c-\ud83e][\udc00-\udfff]|\ud83e[\udd00-\udfff])\ufe0f?/g;
  const HAS = new RegExp(EMOJI.source);

  /* replace one text node's emoji with icons; keeps the words.
     An icon's own art may contain emoji (the bulb has a 💡 glyph in its SVG text), and it is still the parent's
     textContent, so a second pass would wrap the icon inside another icon. Nodes already inside a mapped icon are
     therefore left alone — this is what put a stray empty box beside the coach's face. */
  function inline(text) {
    return String(text)
      .replace(EMOJI, (m) => {
        const icon = name(m);
        return icon ? svg(icon, 20) : m;
      })
      /* any variation selector left on a character that has no icon: it renders as a box, so drop it */
      .replace(/\ufe0f/g, '');
  }
  const insideIcon = (node) => {
    const el = node.parentElement;
    return !!(el && el.closest('svg.g1i'));
  };

  /* icon for a whole emoji string (used for the level-card top pictures) */
  function big(emoji, size) { const n = name(emoji); return n ? svg(n, size || 58) : ''; }

  function walk(root) {
    const it = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentNode && /^(SCRIPT|STYLE|svg)$/i.test(n.parentNode.tagName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (it.nextNode()) nodes.push(it.currentNode);
    nodes.forEach((n) => {
      if (!HAS.test(n.nodeValue)) return;
      if (insideIcon(n)) return;
      const out = inline(n.nodeValue);
      /* nothing was mapped: leave the node alone, or the observer would repaint it forever */
      if (out === n.nodeValue) return;
      const span = document.createElement('span');
      span.innerHTML = out;
      n.parentNode.replaceChild(span, n);
    });
  }

  /* swap emoji for icons everywhere in the chrome, and put big art on the cards */
  function replace() {
    /* header buttons */
    const set = (sel, icon) => { const el = document.querySelector(sel); if (el) el.innerHTML = svg(icon, 24); };
    set('#b-sound', 'sound'); set('#b-voice', 'voice'); set('#b-help', 'help'); set('#b-home', 'home');
    const chips = document.querySelectorAll('#g-stars, #g-streak');
    if (chips[0]) chips[0].innerHTML = `${svg('star', 18)} <span>${(chips[0].textContent.match(/\d+/) || ['0'])[0]}</span>`;
    if (chips[1]) chips[1].innerHTML = `${svg('streak', 18)} <span>${(chips[1].textContent.match(/\d+/) || ['0'])[0]}</span>`;
    /* the template rewrites these on every round, so decorate after each paint */
    const paint = () => {
      const st = document.querySelector('#g-stars'); const sk = document.querySelector('#g-streak');
      if (st && !st.querySelector('svg')) st.innerHTML = `${svg('star', 18)} <span>${(st.textContent.match(/\d+/) || ['0'])[0]}</span>`;
      if (sk && !sk.querySelector('svg')) sk.innerHTML = `${svg('streak', 18)} <span>${(sk.textContent.match(/\d+/) || ['0'])[0]}</span>`;
      const home = document.querySelector('#g-level');
      if (home) walk(home);
      const btns = [['#b-sound', 'sound'], ['#b-voice', 'voice']];
      btns.forEach(([sel, icon]) => { const el = document.querySelector(sel); if (el && !el.querySelector('svg') && el.textContent.trim()) el.innerHTML = svg(icon, 24); });
      /* level and learn cards */
      document.querySelectorAll('.card .ic').forEach((ic) => {
        const em = ic.textContent.trim();
        if (em && !ic.querySelector('svg')) ic.innerHTML = big(em, 58);
      });
      /* a choice of A/B/C/D letters reads better as four square tiles in one row */
      document.querySelectorAll('.opts').forEach((o) => {
        const kids = [...o.children];
        const lettersOnly = kids.length > 1 && kids.every((k) => /^[A-D]$/.test(k.textContent.trim()) && !k.querySelector('svg'));
        o.classList.toggle('short', lettersOnly);
      });
      /* the CUBES strip: "C⭕ Circle the numbers" → the letter plus an icon. It is rebuilt by the engine on
         every think round and is not in the text list below, so it needs its own pass. */
      document.querySelectorAll('.trail span').forEach((sp) => {
        if (sp.querySelector('svg')) return;
        const b = sp.querySelector('b');
        const letter = b ? b.textContent : '';
        const words = sp.textContent.replace(/^[A-Z]/, '').replace(/[\u2190-\u21ff\u2300-\u27bf\u2b00-\u2bff\u25a0-\u25ff\u2600-\u26ff\u{1F000}-\u{1FAFF}\s]+/u, ' ').trim();
        const glyph = (sp.textContent.replace(/^[A-Z]/, '').match(EMOJI) || [])[0];
        const ic = glyph && name(glyph);
        if (!ic || !words) return;
        /* only the glyph is replaced: an inner <span> would nest inside the strip's own span and break the grid */
        sp.innerHTML = sp.innerHTML.replace(glyph, svg(ic, 18));
      });
      /* keypad keys, the Check button and a star row are drawn by the engine as raw symbols; a missing glyph
         font turns them into boxes on a Chromebook, so they get icon markup too */
      document.querySelectorAll('.pad button, .cbtn.go, .dlg .stars, .card .st').forEach((el) => {
        if (el.querySelector('svg')) return;
        const t = el.textContent.trim();
        if (t === '⌫') { el.innerHTML = svg('backspace', 22); return; }
        if (/^check\s*✓$/i.test(t)) { el.innerHTML = `${t.replace(/✓/, '')}${svg('check', 18)}`; return; }
        if (/^[★☆\s]+$/.test(t) && t) {
          el.innerHTML = t.replace(/[★☆]/g, (c) => {
            const star = '<svg class="g1i" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true" focusable="false" style="color:inherit">';
            return star + (c === '★'
              ? '<path d="M32 8l7.6 15.4 17 2.5-12.3 12 2.9 17-15.2-8-15.2 8 2.9-17-12.3-12 17-2.5Z" fill="#f0b429"/>'
              : '<path d="M32 8l7.6 15.4 17 2.5-12.3 12 2.9 17-15.2-8-15.2 8 2.9-17-12.3-12 17-2.5Z" fill="none" stroke="#c9b083" stroke-width="3.5" stroke-linejoin="round"/>') + '</svg>';
          });
          el.style.display = 'flex'; el.style.gap = '4px'; el.style.justifyContent = 'center';
        }
      });
      /* the title-bar emoji is hidden by the theme, but its glyph is still in the DOM; draw the icon there so no
         raw emoji character survives anywhere in the page (same guard as the dialog picture below) */
      const ge = document.querySelector('#g-emoji');
      if (ge && !ge.querySelector('svg') && ge.textContent.trim()) {
        const drawn = big(ge.textContent.trim(), 26);
        if (drawn) ge.innerHTML = drawn;
      }
      /* the code chip and coach face are text; leave the coach SVG alone */
      /* the coach's mood badge is drawn by the engine as <text>💡</text> (or ✓ / !) inside its own face SVG;
         an SVG <text> cannot be replaced by a nested <svg>, so swap the symbol for a stroked path instead */
      document.querySelectorAll('#coach-face text').forEach((t) => {
        const glyph = t.textContent.trim();
        if (!name(glyph)) return;
        const paths = {
          bulb: '<path d="M50 12a4 4 0 0 1 3 6c-1 1-1 2-1 3h-4c0-1 0-2-1-3a4 4 0 0 1 3-6Z" fill="#f5c33d" stroke="#8a5a1f" stroke-width="1"/><path d="M49 22h2" stroke="#8a5a1f" stroke-width="1.4" stroke-linecap="round"/>',
          check: '<path d="M47 15l3 3 6-7" fill="none" stroke="#2f8a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
          cross: '<path d="M49 13l8 8M57 13l-8 8" stroke="#c62828" stroke-width="2.6" stroke-linecap="round"/>',
        };
        const d = paths[name(glyph)];
        if (d) t.innerHTML = d;
        else t.textContent = '';
      });
      /* the celebration burst is eight fixed-position spans the engine builds from ⭐ ✨ 🌟 and removes after
         0.9 s; drawing them as icons keeps the reward and loses the raw glyphs */
      document.querySelectorAll('.burst').forEach((b) => {
        if (b.querySelector('svg')) return;
        const g = b.textContent.trim();
        const ic = name(g) || 'sparkle';
        b.innerHTML = svg(ic === 'star' ? 'star' : 'sparkle', 30);
      });
      /* "🧠 Think first — CUBES" is a bare <b>, not a .prompt — give it the same treatment */
      document.querySelectorAll('.think > b, .think > p > b, #coach-say b').forEach((b) => walk(b));
      const say = document.querySelectorAll('#coach-say, .prompt, .ttext, .tcard p, .dlg .dh, .dlg h2, .dlg .di, .opt, .cbtn, .path li, .picked span, .home p, .home h2, .card, .model text');
      document.querySelectorAll('.cbtn').forEach((b) => { if (!b.querySelector('svg')) walk(b); });
      document.querySelectorAll('.home > div:first-child').forEach((d) => { if (!d.querySelector('svg') && d.textContent.trim()) d.innerHTML = big(d.textContent.trim(), 96); });
      say.forEach((el) => { if (!el.querySelector('svg')) walk(el); });
      const di = document.querySelector('.dlg .di');
      if (di && !di.querySelector('svg') && di.textContent.trim()) {
        /* big() returns '' for an emoji with no icon: writing that back would replace the node with its
           own markup, fire the observer again and loop forever, so the assignment is guarded. */
        const drawn = big(di.textContent.trim(), 68);
        if (drawn) di.innerHTML = drawn;
      }
    };
    paint();
    new MutationObserver(() => paint()).observe(document.body, { childList: true, subtree: true });
    setTimeout(paint, 60);
    setTimeout(paint, 260);
  }
  return { svg, inline, big, replace, name };
})();

    'g4-dune-place': () => `<svg viewBox="0 0 480 230" role="img" aria-label="layered dunes in the shape of a place-value chart">${sky('#fdf1e2', '#fffaf2')}${sun(400, 46, 26, '#e8a33f')}${[0, 1, 2, 3].map((i) => `<path d="M0 ${132 + i * 24}q120-26 240-10t240-8v${240 - (132 + i * 24)}H0Z" fill="${['#f0dcb4', '#e6cd9c', '#dcc088', '#cfae74'][i]}"/>`).join('')}<path d="M0 208h480v22H0Z" fill="#b3762a" opacity=".25"/>${[96, 176, 256, 336].map((x) => `<path d="M${x} 96v112" stroke="#b3762a" stroke-width="2" opacity=".45" stroke-dasharray="5 7"/>`).join('')}</svg>`,
    'g4-pigeon-loft': () => `<svg viewBox="0 0 480 230" role="img" aria-label="a pigeon loft with birds circling above">${sky('#eaf2f8', '#f8fbfe')}${sun(400, 42, 24)}${ground('#e4dcc8')}<rect x="176" y="76" width="128" height="116" rx="6" fill="#48607a"/><path d="M168 78l72-42 72 42Z" fill="#33506b"/><rect x="212" y="124" width="56" height="68" rx="4" fill="#f0e4cf"/><path d="M240 124v68" stroke="#48607a" stroke-width="3"/><circle cx="240" cy="100" r="9" fill="#f0e4cf"/><path d="M0 190h480v40H0Z" fill="#d6cdb8"/>${[0, 1, 2, 3].map((i) => `<g transform="translate(${92 + i * 104} ${58 + (i % 2) * 22})"><path d="M-12 0c6-8 18-8 24 0-6 8-18 8-24 0Z" fill="#fff" stroke="#b9c6d1" stroke-width="2"/><path d="M-12 0l-8-4" stroke="#b9c6d1" stroke-width="2"/></g>`).join('')}</svg>`,
  };

  return {
    for: (id) => (ART[id] ? ART[id]() : ART2[id] ? ART2[id]() : ART2B[id] ? ART2B[id]() : ART3[id] ? ART3[id]() : ART4[id] ? ART4[id]() : fallback(id)),
    has: (id) => !!(ART[id] || ART2[id] || ART2B[id] || ART3[id] || ART4[id]),
  };
})();

const G1THEME = (() => {
  function start() {
    const g = (typeof GAME !== 'undefined' && GAME) || {};
    const root = document.documentElement;
    if (g.accent) {
      root.style.setProperty('--accent', g.accent);
      root.style.setProperty('--accent-deep', g.accentDeep || g.accent);
      root.style.setProperty('--paper', g.paper || '#fffaf0');
      root.style.setProperty('--sky-a', g.skyA || '#eaf8fb');
      root.style.setProperty('--sky-b', g.skyB || '#cdeaf1');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', g.accent);
    }
    /* the hero picture replaces the template's single emoji on the home screen */
    const paintHero = () => {
      const home = document.querySelector('#stage .home');
      if (!home || home.querySelector('.hero')) return;
      const first = home.firstElementChild;
      if (first && /font-size:\s*64px/.test(first.getAttribute('style') || '')) {
        first.className = 'hero';
        first.setAttribute('style', '');
        first.innerHTML = G1HERO.for(g.id);
      }
    };
    paintHero();
    const obs = new MutationObserver(() => paintHero());
    obs.observe(document.getElementById('stage') || document.body, { childList: true, subtree: true });
    setTimeout(paintHero, 40);
    setTimeout(paintHero, 400);
    /* icons last, so the chrome is already painted */
    G1ICON.replace();
  }
  return { start };
})();

/* Small game-side helpers shared by the Grade 1 lesson games. No engine code lives here. */
const G1 = {
  /* put a picture above a question, with an optional caption, without ever inventing a total */
  art(svg, caption) {
    return `<div style="display:grid;gap:6px;margin-bottom:6px">${svg}${caption ? `<p style="margin:0;text-align:center;font-size:15px;font-weight:700;color:#6b5a3a">${caption}</p>` : ''}</p></div>`;
  },
  /* 3 hints, strategy → step → near answer. The answer itself is never one of them. */
  hints: (a, b, c) => (c ? [a, b, c] : [a, b]),
  /* a distinct multiple-choice list that always contains the key */
  opts(answer, pool, n) {
    const out = [String(answer)];
    pool.forEach((v) => { const s = String(v); if (!out.includes(s) && out.length < (n || 4)) out.push(s); });
    return out;
  },
  /* pick a distractor set that is genuinely plausible for the skill */
  near(answer, deltas) { return deltas.map((d) => answer + d).filter((v) => v >= 0); },
  sayNum: (n, one, many) => `${n} ${n === 1 ? one : many}`,
};

/* scenes-2.js */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 2 PICTURE LIBRARY — place value, regrouping, money and arrays.
   Same rules as scenes.js: every picture is generated from the numbers the question asks about, so a caption
   can never disagree with the drawing. Nothing here fetches, and no picture prints a total the child is
   supposed to work out (blocks and notes are unnumbered; digits are only printed where the question gives them).
   ══════════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE2 = (() => {
  const INK = '#4a2f15', BRAND = '#0e7c86', PAPER = '#fffaf0';
  const FLAT = '#2a8b9c', ROD = '#4faa63', UNIT = '#e0a93f';
  const wrap = (w, h, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const blank = (w, h, fill) => `<rect x="2" y="2" width="${w - 4}" height="${h - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5"/>`;
  const label = (txt, x, y, size, color) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 16}" font-weight="800" fill="${color || INK}">${txt}</text>`;

  /* ---- base-ten pieces: a flat is 100, a rod is 10, a unit is 1 ---- */
  function flat(x, y, k, color) {
    const s = 42 * k;
    let g = `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${4 * k}" fill="${color || FLAT}" opacity=".92"/>`;
    for (let i = 1; i < 10; i++) {
      g += `<line x1="${x + (i * s) / 10}" y1="${y}" x2="${x + (i * s) / 10}" y2="${y + s}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".55"/>`;
      g += `<line x1="${x}" y1="${y + (i * s) / 10}" x2="${x + s}" y2="${y + (i * s) / 10}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".55"/>`;
    }
    return g + `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${4 * k}" fill="none" stroke="${INK}" stroke-width="${1.6 * k}"/>`;
  }
  function rod(x, y, k, color) {
    const w = 9 * k, h = 42 * k;
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${3 * k}" fill="${color || ROD}"/>`;
    for (let i = 1; i < 10; i++) g += `<line x1="${x}" y1="${y + (i * h) / 10}" x2="${x + w}" y2="${y + (i * h) / 10}" stroke="#fff" stroke-width="${0.9 * k}" opacity=".6"/>`;
    return g + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${3 * k}" fill="none" stroke="${INK}" stroke-width="${1.4 * k}"/>`;
  }
  function unit(x, y, k, color) {
    const s = 9 * k;
    return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${2 * k}" fill="${color || UNIT}" stroke="${INK}" stroke-width="${1.3 * k}"/>`;
  }

  /* hundreds flats, tens rods and ones units laid out in three tidy groups */
  function baseTen(h, t, o, opts) {
    opts = opts || {};
    const W = 620, H = opts.h || 250;
    /* scale the blocks up so a handful of tens or ones still fills the frame: a 2-rod picture at k=1 is a
       speck in a 620-wide box, which reads as "nothing to count" to a seven-year-old */
    const natural = (h * 46) + (Math.min(t, 10) * 13) + (Math.min(o, 10) * 13) + 52;
    const k = opts.k || Math.max(1, Math.min(2.2, (W * 0.56) / Math.max(natural, 1)));
    const groups = [];
    if (h > 0) groups.push({ n: h, kind: 'flat' });
    if (t > 0) groups.push({ n: t, kind: 'rod' });
    if (o > 0) groups.push({ n: o, kind: 'unit' });
    if (!groups.length) groups.push({ n: 0, kind: 'unit' });
    /* group widths drive the layout so 9 flats and 2 rods both look balanced */
    const widths = groups.map((g) => (g.kind === 'flat' ? 5 * 44 * k : g.kind === 'rod' ? g.n * 13 * k : Math.min(g.n, 10) * 13 * k));
    const gap = 26, total = widths.reduce((a, b) => a + b, 0) + gap * (groups.length - 1);
    let x = (W - total) / 2;
    let body = blank(W, H, opts.fill || '#f4fbfc');
    /* centre the block rows vertically, leaving room for the place labels along the bottom */
    const heights = groups.map((g) => (g.kind === 'flat' ? (Math.ceil(g.n / 5) * 46 - 4) * k : g.kind === 'rod' ? 42 * k : (Math.ceil(g.n / 10) * 13) * k));
    const tallest = Math.max(...heights);
    const contentTop = 18 + (H - 44 - tallest) / 2;
    groups.forEach((g, gi) => {
      const top = contentTop + (tallest - heights[gi]) / 2;
      for (let i = 0; i < g.n; i += 1) {
        if (g.kind === 'flat') {
          const perRow = Math.min(g.n, 5);
          body += flat(x + (i % perRow) * 46 * k, top + Math.floor(i / perRow) * 46 * k, k);
        } else if (g.kind === 'rod') {
          body += rod(x + i * 13 * k, top, k);
        } else {
          body += unit(x + (i % 10) * 13 * k, top + Math.floor(i / 10) * 13 * k, k);
        }
      }
      const names = { flat: 'hundreds', rod: 'tens', unit: 'ones' };
      body += label(names[g.kind], x + widths[gi] / 2, H - 14, 15, '#55647a');
      x += widths[gi] + gap;
    });
    const say = `${h} hundreds, ${t} tens and ${o} ones drawn in base-ten blocks`;
    return wrap(W, H, opts.label || say, body, opts.max);
  }

  /* a place-value chart: three columns; a digit is printed only when the question supplies it */
  function placeChart(h, t, o, opts) {
    opts = opts || {};
    const W = 520, H = 200, cols = ['Hundreds', 'Tens', 'Ones'], vals = [h, t, o];
    const cw = 150, x0 = (W - cw * 3) / 2;
    let body = blank(W, H, opts.fill || '#f7f4ff');
    for (let i = 0; i < 3; i += 1) {
      const x = x0 + i * cw;
      body += `<rect x="${x + 6}" y="26" width="${cw - 12}" height="120" rx="14" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
      body += label(cols[i], x + cw / 2, 18, 15, '#55647a');
      const v = vals[i];
      body += label(v == null || v === '' ? '?' : String(v), x + cw / 2, 106, 46, v == null ? '#c9d6dd' : '#24303f');
    }
    const say = opts.label || 'a place-value chart with hundreds, tens and ones columns';
    return wrap(W, H, say, body, opts.max);
  }

  /* two groups side by side, for comparing */
  function compareHi(a, b, opts) {
    opts = opts || {};
    const W = 560, H = 190;
    let body = blank(W, H, '#fff8ee');
    [[a, 132, 'A'], [b, 428, 'B']].forEach(([n, cx, tag]) => {
      body += `<rect x="${cx - 104}" y="34" width="208" height="96" rx="16" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
      body += label(String(n), cx, 106, 56, '#24303f');
      body += label(tag, cx, 166, 18, '#55647a');
    });
    body += label(opts.mid || '?', W / 2, 100, 40, '#e2564a');
    return wrap(W, H, opts.label || `two number cards, A is ${a} and B is ${b}`, body, opts.max);
  }

  /* Japanese-yen style note/coin art is wrong here: Saudi riyals — notes 1, 5, 10, 50 and halala coins */
  function note(x, y, value, k) {
    const w = 96 * k, h = 46 * k;
    const cols = { 1: '#a7c7a1', 5: '#c9a86a', 10: '#8fb4d9', 50: '#c58f9e', 100: '#9bb3c7' };
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${5 * k}" fill="${cols[value] || '#c9a86a'}" stroke="${INK}" stroke-width="${1.6 * k}"/>`
      + `<rect x="${x + 5 * k}" y="${y + 5 * k}" width="${w - 10 * k}" height="${h - 10 * k}" rx="${3 * k}" fill="none" stroke="${INK}" stroke-width="${1 * k}" opacity=".45"/>`
      + `<text x="${x + w / 2}" y="${y + h / 2 + 8 * k}" text-anchor="middle" font-size="${20 * k}" font-weight="800" fill="${INK}">${value}</text>`
      + `<text x="${x + w - 12 * k}" y="${y + h - 8 * k}" text-anchor="end" font-size="${10 * k}" font-weight="800" fill="${INK}" opacity=".7">SAR</text></g>`;
  }
  function coin(x, y, value, k) {
    const r = 15 * k;
    return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="#e8dcc0" stroke="${INK}" stroke-width="${1.6 * k}"/>`
      + `<circle cx="${x}" cy="${y}" r="${r - 4 * k}" fill="none" stroke="${INK}" stroke-width="${1 * k}" opacity=".45"/>`
      + `<text x="${x}" y="${y + 4 * k}" text-anchor="middle" font-size="${11 * k}" font-weight="800" fill="${INK}">${value}</text></g>`;
  }
  /* notes and coins: `notes` is a list of note values, `coins` a list of halala values */
  function money(notes, coins, opts) {
    opts = opts || {};
    const W = 560, H = notes.length ? 190 : 120;
    let body = blank(W, H, opts.fill || '#fffaf0');
    let x = 34, y = 40;
    notes.forEach((v) => {
      if (x + 96 > W - 24) { x = 34; y += 60; }
      body += note(x, y, v, 1);
      x += 108;
    });
    if (coins && coins.length) {
      const cy = notes.length ? y + 66 : 84;
      coins.forEach((v, i) => { body += coin(46 + i * 40, cy, v, 1.1); });
      body += label('halalas', 46 + coins.length * 40 + 10, cy - 22, 14, '#55647a');
    }
    body += label(opts.caption || '', W / 2, H - 12, 15, '#55647a');
    return wrap(W, H, opts.label || 'Saudi riyal notes and halala coins', body, opts.max);
  }

  /* an array of crates: rows × columns, with the row and column counts labelled (not the total) */
  function array(rows, cols, opts) {
    opts = opts || {};
    const W = 560, H = 300, cell = Math.min(52, 330 / Math.max(rows, cols)), gx = cell * 0.9;
    const x0 = (W - cols * gx) / 2 + gx / 2, y0 = (H - rows * gx) / 2 + gx / 2 - 6;
    let body = blank(W, H, opts.fill || '#fff6e8');
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const x = x0 + c * gx, y = y0 + r * gx, s = cell * 0.72;
        body += `<rect x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}" rx="${s * 0.2}" fill="${opts.color || '#c9703f'}" stroke="${INK}" stroke-width="1.6"/>`;
        body += `<path d="M${x - s / 2} ${y} h${s} M${x} ${y - s / 2} v${s}" stroke="#fff" stroke-width="1.4" opacity=".65"/>`;
      }
    }
    body += `<path d="M${x0 - gx / 2} ${y0 + (rows - 0.5) * gx + 12} h${cols * gx}" stroke="#8a6a3d" stroke-width="2" stroke-dasharray="5 5"/>`;
    /* `bare` hides the row / column captions: used when the picture is itself an answer option, where
       printing "5 rows" would tell the child what to count instead of letting them count it */
    if (!opts.bare) {
      body += label(`${rows} rows`, W / 2, y0 + (rows - 0.5) * gx + 34, 15, '#6b5a3a');
      body += label(`${cols} in each row`, W / 2, 26, 16, '#6b5a3a');
    }
    return wrap(W, H, opts.label || `an array of crates, ${rows} rows with ${cols} in each row`, body, opts.max);
  }

  /* a skip-counting track: some numbers printed, the last slot empty */
  function skipTrack(start, step, shown, opts) {
    opts = opts || {};
    const W = 600, H = 150, n = shown, stepX = Math.min(86, (W - 60) / n);
    const x0 = (W - (n - 1) * stepX) / 2;
    let body = blank(W, H, '#effaf9');
    for (let i = 0; i < n; i += 1) {
      const x = x0 + i * stepX, v = start + i * step, last = i === n - 1;
      body += `<circle cx="${x}" cy="72" r="${stepX * 0.34}" fill="${last ? '#fff' : '#fff'}" stroke="${INK}" stroke-width="${last ? 3 : 2}" ${last ? 'stroke-dasharray="7 5"' : ''}/>`;
      body += label(last && opts.hideLast !== false ? '?' : String(v), x, 82, last ? 24 : 22, last ? INK : '#24303f');
      if (i < n - 1) body += `<path d="M${x + stepX * 0.34} 72 h${stepX * 0.32}" stroke="#b9a888" stroke-width="2" stroke-dasharray="4 4"/>`;
    }
    body += label(opts.caption || '', W / 2, H - 14, 15, '#6b5a3a');
    return wrap(W, H, opts.label || `a skip-counting track starting at ${start}`, body, opts.max);
  }

  /* a clock face at any five-minute mark. The Grade 1 scene only draws :00 and :30, which cannot show the
     five-minute marks this grade reads, so the hour hand is placed proportionally between hours. */
  function clockAt(hour, minutes, size) {
    const W = size || 230, c = W / 2, R = c - 12, k = W / 220;
    const pt = (deg, len) => [c + Math.cos(((deg - 90) * Math.PI) / 180) * len, c + Math.sin(((deg - 90) * Math.PI) / 180) * len];
    let body = `<circle cx="${c}" cy="${c}" r="${R}" fill="#fffdf6" stroke="${INK}" stroke-width="${6 * k}"/>`;
    for (let i = 1; i <= 12; i += 1) {
      const [x, y] = pt(i * 30, R * 0.78);
      body += label(i, x, y + 5 * k, 19 * k, '#3b2814');
    }
    /* ticks for every five-minute mark, longer on the quarters */
    for (let m = 0; m < 60; m += 5) {
      const [x1, y1] = pt(m * 6, R * 0.93), [x2, y2] = pt(m * 6, R * (m % 15 === 0 ? 0.84 : 0.88));
      body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b9a888" stroke-width="${2 * k}" stroke-linecap="round"/>`;
    }
    const [mx, my] = pt(minutes * 6, R * 0.72);
    const [hx, hy] = pt(((hour % 12) + minutes / 60) * 30, R * 0.46);
    body += `<line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="${BRAND}" stroke-width="${5.5 * k}" stroke-linecap="round"/>`;
    body += `<line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="#d26542" stroke-width="${8.5 * k}" stroke-linecap="round"/>`;
    body += `<circle cx="${c}" cy="${c}" r="${6.5 * k}" fill="${INK}"/>`;
    const say = `clock showing ${hour} ${minutes ? 'past ' + String(minutes).padStart(2, '0') : "o'clock"}`;
    return wrap(W, W, say, body, W);
  }

  /* a picture graph whose key and columns are the question's own — the shared scene hard-codes "1 vote",
     which would contradict a Grade 2 question about a key of 2 or 5. One circle still equals one key unit. */
  function graphKeyed(vals, opts) {
    opts = opts || {};
    const names = opts.names || ['Ibex', 'Hyrax', 'Baboons'];
    const cols = opts.colors || ['#c87839', '#4d8f7d', '#8a5fa8'];
    const W = 520, H = 258, base = 200, maxV = Math.max(4, ...vals);
    let body = blank(W, H, '#fff6e8');
    body += label(opts.key || 'each circle = 2 animals', 392, 30, 15, '#6b5a3a');
    body += `<line x1="40" y1="${base}" x2="482" y2="${base}" stroke="#b9a888" stroke-width="3" stroke-linecap="round"/>`;
    for (let r = 1; r < maxV; r += 1) body += `<line x1="58" y1="${base - r * 30}" x2="466" y2="${base - r * 30}" stroke="#e6d8c4" stroke-width="1.5" stroke-dasharray="4 6"/>`;
    vals.forEach((v, i) => {
      const cx = 122 + i * 148;
      for (let j = 0; j < v; j += 1) body += `<circle cx="${cx}" cy="${base - 14 - j * 30}" r="12.5" fill="${cols[i % cols.length]}"/>`;
      body += label(names[i] || '', cx, base + 32, 16, INK);
    });
    const say = `picture graph, key ${opts.keyValue || 2} per circle: ${names.map((n, i) => `${n} ${vals[i]} circles`).join(', ')}`;
    return wrap(W, H, say, body, opts.max);
  }

  return { baseTen, placeChart, compareHi, money, array, skipTrack, clockAt, graphKeyed, note, coin, flat, rod, unit, wrap, label };
})();

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   LESSONS / LESSON_UNITS — the ten-section نبع/موازي frame, keyed by game id.
   ──────────────────────────────────────────────────────────────────────────────────────────────────────
   Structure mirrors the curriculum documents rather than inventing an anchor per game:

     LESSON_UNITS   a verse and a set of Quranic roots anchor the UNIT (as in G04-U01-MAT-L01, where ح-س-ب /
             ق-د-ر / ع-د-د and [الأنعام: ١٦٠] belong to the unit, not to each lesson inside it).
     LESSONS  each game points at its unit and supplies the lesson-specific parts: story, five
             objectives, the three stations, time blocks, exit card, homework, reflection.

   Honesty rules applied here:
     • Only verses whose wording is well established in the Uthmani mushaf are used. A verse is reused
       across units where the meaning genuinely fits, instead of manufacturing forty unique citations.

    if (!base) {
      return {
        code: g.code, title: g.title, story: g.welcome, objectives: [g.objective].filter(Boolean),
        note: null, roots: [], verse: null, stations: [], exit: [], homework: [], reflect: null, blocks: [],
      };
    }

    const unitId = base.unit || (inline && inline.unit) || null;
    const unit = (unitId && units[unitId]) || {};
    const merged = Object.assign({}, unit, base);
    /* the unit's verse/roots/note win only where the lesson did not override them */
    if (!merged.verse && unit.verse) merged.verse = unit.verse;
    if ((!merged.roots || !merged.roots.length) && unit.roots) merged.roots = unit.roots;
    if (!merged.note && unit.note) merged.note = unit.note;
    if (!merged.code) merged.code = g.code;
    if (!merged.title) merged.title = g.title;
    return merged;
  }

  /* ---------- the shell, rendered as a panel at the foot of the home screen ---------- */
  function panel() {
    const L = read();
    /* The frame is teacher/parent-facing, so it sits BELOW the play cards and collapsed. The child reaches
       the game immediately; the adult can open the plan. The P2 claim boundary stays outside the fold and is
       always visible — it must never be something you have to expand to discover. */
    const shell = el('section', { class: 'lesson-shell', 'aria-label': 'إطار الدرس' });

    const p2 = el('p', { class: 'ls-p2', text: P2 });
    shell.appendChild(p2);

    const details = el('details', { class: 'ls-details' });
    const summary = el('summary', { class: 'ls-summary' });
    summary.appendChild(el('span', { class: 'ls-sum-ic', text: '📋' }));
    summary.appendChild(el('b', { text: 'إطار الدرس' }));
    if (L.code) summary.appendChild(el('span', { class: 'ls-code', text: L.code }));
    if (L.title) summary.appendChild(el('span', { class: 'ls-title', text: L.title }));
    summary.appendChild(el('span', { class: 'ls-chev', text: '▾' }));
    details.appendChild(summary);

    const wrap = el('div', { class: 'ls-body' });
    details.appendChild(wrap);
    shell.appendChild(details);

    /* ── الآية + الجذور ── */
    if (L.verse || (L.roots && L.roots.length)) {
      const v = el('div', { class: 'ls-sec ls-verse' });
      v.appendChild(el('h4', { text: 'الآية والجذور' }));
      if (L.verse) {
        v.appendChild(el('p', { class: 'ls-ayah', text: L.verse.text }));
        v.appendChild(el('p', { class: 'ls-ref', text: L.verse.ref }));
      }
      if (L.roots && L.roots.length) {
        const r = el('div', { class: 'ls-roots' });
        r.appendChild(el('span', { class: 'ls-lbl', text: 'الجذور القرآنية' }));
        L.roots.forEach((x) => r.appendChild(el('span', { class: 'ls-root', text: x })));
        v.appendChild(r);
      }
      /* the anti-overreach caution — this is the rule the source documents insist on */
      if (L.note) v.appendChild(el('p', { class: 'ls-note', text: L.note }));
      wrap.appendChild(v);
    }

    /* ── القصة + الأهداف ── */
    const o = el('div', { class: 'ls-sec' });
    o.appendChild(el('h4', { text: 'الأهداف' }));
    if (L.story) o.appendChild(el('p', { class: 'ls-story', text: L.story }));
    if (L.objectives && L.objectives.length) {
      const ol = el('ol', { class: 'ls-objs' });
      L.objectives.forEach((x) => ol.appendChild(el('li', { text: x })));
      o.appendChild(ol);
    }
    wrap.appendChild(o);

    /* ── المحطات: the levels, reframed ── */
    const lv = (typeof GAME !== 'undefined' && GAME.levels) || [];
    if (lv.length) {
      const s = el('div', { class: 'ls-sec' });
      s.appendChild(el('h4', { text: 'المحطات — ثلاث مستويات تمايز' }));
      const grid = el('div', { class: 'ls-stations' });
      lv.forEach((L2, i) => {
        const note = (L.stations && L.stations[i]) || L2.blurb || '';
        const c = el('div', { class: 'ls-station' });
        c.appendChild(el('b', { text: `المحطة ${['١', '٢', '٣', '٤', '٥'][i] || i + 1} · ${L2.name || ''}` }));
        if (note) c.appendChild(el('small', { text: note }));
        grid.appendChild(c);
      });
      s.appendChild(grid);
      if (L.blocks && L.blocks.length) {
        s.appendChild(el('p', { class: 'ls-blocks', text: 'التسلسل الزمني: ' + L.blocks.join(' ← ') }));
      }
      wrap.appendChild(s);
    }

    /* ── الخروج ── */
    if (L.exit && L.exit.length) {
      const x = el('div', { class: 'ls-sec' });
      x.appendChild(el('h4', { text: 'بطاقة الخروج' }));
      const ol = el('ol', { class: 'ls-exit' });
      L.exit.forEach((item) => {
        const li = el('li');
        li.appendChild(el('span', { class: 'ls-grade', text: (item.grade || '') }));
        li.appendChild(el('span', { text: item.text }));
        ol.appendChild(li);
      });
      x.appendChild(ol);
      if (L.criterion) x.appendChild(el('p', { class: 'ls-crit', text: 'معيار النجاح: ' + L.criterion }));
      wrap.appendChild(x);
    }

    /* ── الواجب + المراجعة ── */
    if ((L.homework && L.homework.length) || L.reflect) {
      const hw = el('div', { class: 'ls-sec' });
      if (L.homework && L.homework.length) {
        hw.appendChild(el('h4', { text: 'الواجب — بلا شاشات' }));
        const ul = el('ul', { class: 'ls-hw' });
        L.homework.forEach((t) => ul.appendChild(el('li', { text: t })));
        hw.appendChild(ul);
      }
      if (L.reflect) {
        hw.appendChild(el('h4', { text: 'المراجعة' }));
        hw.appendChild(el('p', { class: 'ls-reflect', text: L.reflect }));
      }
      wrap.appendChild(hw);
    }

    return shell;
  }

  /* ---------- mount on every home render ---------- */
  function mount() {
    const home = document.querySelector('#stage .home');
    if (!home || home.querySelector('.lesson-shell')) return;
    home.appendChild(panel());
  }

  function start() {
    mount();
    const stage = document.getElementById('stage');
    if (stage && !start.__obs) {
      start.__obs = new MutationObserver(() => { try { mount(); } catch (e) { /* never break the game */ } });
      start.__obs.observe(stage, { childList: true, subtree: true });
    }
    setTimeout(() => { try { mount(); } catch (e) { /* fine */ } }, 60);
    setTimeout(() => { try { mount(); } catch (e) { /* fine */ } }, 420);
  }

  return { start, panel, P2 };
})();

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1LESSON.start(); } catch (e) { /* never break the game */ } }, 0));
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 2 · Caravan Compare · comparing 3-digit numbers with < > = (2.NBT.A.4)
   Mechanic = the thinking: two caravans carry different numbers of water jars and the child places the right
   sign. Level 1 compares a number with a near neighbour (tens vs ones), level 2 has one number hidden inside a
   pack of blocks, level 3 uses measurement lengths so the comparison is not just "biggest digits".
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const GAME = {
  id: 'g2-caravan-compare', code: 'G02-MAT-03', title: 'Caravan Compare', emoji: '🐪',
  accent: '#b4703a', accentDeep: '#8e5528', skyA: '#fdf5ec', skyB: '#f6e4cf',
  topic: 'Comparing to 1,000', band: 'g35', lang: 'en',
  objective: 'I can <b>compare</b> two numbers to 1,000 and use <b>&lt; &gt; =</b> correctly.',
  welcome: 'Two caravans meet on the dunes. Which one carries more water jars? 🐪',
  learnBlurb: 'Compare the hundreds first. If they match, look at the tens.',
  how: {
    what: 'To compare, read the biggest place first. Only move to the next place if the first one matches.',
    steps: ['🐪 Compare the hundreds digit.', '🐪 Same? Compare the tens.', '✅ Then the ones. The open side of the sign faces the bigger number.'],
  },

  learn: [
    { say: 'Caravan A has <b>342</b> jars, Caravan B has <b>324</b>. Which sign belongs between them?',
      draw(el) { el.append(UI.h('div', { html: SCENE2.compareHi(342, 324, { mid: '?' }) })); } },
    { say: 'Both have <b>3</b> hundreds, so look at the tens: <b>4</b> tens beats <b>2</b> tens. So <b>342 &gt; 324</b>.',
      draw(el) {
        el.append(UI.h('div', { html: SCENE2.compareHi(342, 324, { mid: '>' }) }));
        el.append(UI.h('p', { class: 'prompt', style: 'font-size:17px', html: 'Hundreds are the same (3 = 3) → compare tens: 4 &gt; 2.' }));
      } },
    { say: 'Your turn: <b>507</b> and <b>570</b>. Which is bigger?', wait: true,
      draw(el, L) {
        el.append(UI.h('div', { html: SCENE2.compareHi(507, 570, { mid: '?' }) }));
        const row = UI.h('div', { class: 'opts' });
        [['570', true], ['507', false], ['They are equal', false]].forEach(([t, ok]) => row.append(UI.h('button', {
          class: 'opt', text: t,
          onclick: (e) => ok ? (e.target.classList.add('good'), L.ok('Yes — same hundreds, but 7 tens beats 0 tens.'))
            : (UI.shake(e.target), SFX.play('wrong'), COACH.say(t === '507' ? 'Look at the tens place, not the last digit.' : 'Are the tens the same?', 'bad')),
        })));
        el.append(row);
      } },
    { say: 'Ghubar says <b>507 &gt; 570</b> because 7 is bigger than 5. What should he compare first?', wait: true,
      draw(el, L) {
        GHUBAR.pop('Seven beats five. So 507 wins!', 5000);
        const row = UI.h('div', { class: 'opts' });
        [['The hundreds, then the tens — the last digit is the smallest place.', true], ['The last digit only.', false], ['The number of digits in each number.', false]].forEach(([t, ok]) => row.append(UI.h('button', {
          class: 'opt', text: t,
          onclick: (e) => ok ? (e.target.classList.add('good'), L.ok('Right — the tens place is worth 10× the ones place.'))
            : (UI.shake(e.target), SFX.play('wrong'), COACH.say('Both numbers have three digits. Which place is worth the most?', 'bad')),
        })));
        el.append(UI.h('div', { html: SCENE2.compareHi(507, 570, { mid: '?' }) }), row);
      } },
  ],

  levels: [
    { name: 'Pick the sign', icon: '🐪', blurb: 'Choose <, > or =.', rounds: 4, think: false,
      say: '🐪 Which sign belongs in the middle?',
      round() {
        const h = UI.rint(1, 9);
        const style = UI.rint(0, 2);
        let a, b;
        if (style === 0) { a = h * 100 + UI.rint(10, 99); b = h * 100 + UI.rint(10, 99); if (a === b) b += 10; }
        else if (style === 1) { a = h * 100 + UI.rint(1, 9) * 10 + UI.rint(0, 9); b = h * 100 + (a % 100) % 10 * 10 + (a % 10); if (a === b) b -= 1; }
        else { a = h * 100 + UI.rint(10, 99); b = a; }
        const key = a > b ? '>' : a < b ? '<' : '=';
        return {
          type: 'choice', prompt: G1.art(SCENE2.compareHi(a, b, { mid: '?' }), `Compare ${a} and ${b}.`),
          options: ['<', '>', '='], answer: key,
          why: (v) => v === '=' && a !== b ? 'Equal means the same value. Are they the same?'
            : v === '>' && a < b ? 'The open side of the sign faces the bigger number.'
            : 'Compare the hundreds first, then the tens.',
          hints: ['Cover the last two digits and compare the hundreds.', `Hundreds: ${Math.floor(a / 100)} and ${Math.floor(b / 100)}.`, 'Only if the hundreds match, compare the tens.'],
          solution: `${a} ${key} ${b}.`,
        };
      } },
    { name: 'Blocks against a number', icon: '🧺', blurb: 'One side is drawn in base-ten blocks.', rounds: 4, think: false,
      say: '🧺 Count the blocks, then compare.',
      round() {
        const h = UI.rint(1, 5), t = UI.rint(0, 9), o = UI.rint(0, 9);
        const blocks = h * 100 + t * 10 + o;
        const other = UI.pick([blocks + UI.rint(1, 20), blocks - UI.rint(1, 20), blocks]);
        return {
          type: 'choice', prompt: G1.art(SCENE2.baseTen(h, t, o, { max: 460, h: 220 }), `Compare the blocks with ${other}.`),
          options: ['<', '>', '='], answer: blocks > other ? '>' : blocks < other ? '<' : '=',
          why: () => `Count the blocks by place: ${h} hundreds, ${t} tens, ${o} ones.`,
          hints: [`The blocks show ${h} hundreds, ${t} tens, ${o} ones.`, 'Write that as one number first.', `Then compare it with ${other}.`],
          solution: `The blocks show ${blocks}, and ${blocks} ${blocks > other ? '>' : blocks < other ? '<' : '='} ${other}.`,
        };
      } },
    { name: 'Caravan measures', icon: '📏', blurb: 'Compare lengths in centimetres.', rounds: 4, think: true,
      say: '📏 Think first: read both lengths.',
      round(i) {
        const a = 120 + i * 47, b = a + (i % 2 ? -1 : 1) * (5 + i * 3);
        return {
          type: 'choice',
          problem: {
            sentences: [`Caravan A's banner is ${a} cm long.`, 'The banners are made of wool.', `Caravan B's banner is ${b} cm long.`, 'Which banner is longer?'],
            question: 3, keys: ['longer'], extras: [1],
          },
          prompt: `Which is longer: ${a} cm or ${b} cm?`,
          options: [`${a} cm`, `${b} cm`, 'They are the same'], answer: a > b ? `${a} cm` : `${b} cm`,
          why: () => 'Compare the hundreds first, then the tens.',
          hints: ['Both are more than 100 cm.', 'Compare the hundreds digit.', 'If the hundreds match, compare the tens.'],
          solution: `${Math.max(a, b)} cm is longer — ${a} ${a > b ? '>' : a < b ? '<' : '='} ${b}.`,
        };
      } },
  ],

  ghubar: ['The last digit is the biggest digit. Trust it.', 'Equal hundreds means equal numbers.', 'I compare by looking at the shape of the digits.'],
  praise: ['Sign placed right!', 'Biggest place first!', 'Tens decided it!', 'Caravan order correct!'],
  finale: 'Both caravans counted — you can compare any number to 1,000! 🐪',
};

/* the engine boots on DOMContentLoaded; theme + icons run just after it so they can decorate its chrome */
window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1THEME.start(); } catch (e) { /* never break the game for a missing icon */ } }, 0));
window.addEventListener('DOMContentLoaded', () => setTimeout(() => { try { G1LESSON.start(); } catch (e) { /* never break the game for a missing lesson shell */ } }, 0));
</script>

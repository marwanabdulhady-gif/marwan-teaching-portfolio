<!--
╔══════════════════════════════════════════════════════════════════════════════════════════════════════════╗
║  FIKR LESSON GAME — COMPLETE HTML TEMPLATE + INSTRUCTIONS FOR THE AI AGENT THAT BUILDS NEW GAMES        ║
╚══════════════════════════════════════════════════════════════════════════════════════════════════════════╝

READ ALL OF THIS BEFORE YOU CHANGE ANYTHING.

0. WHAT THIS FILE IS
   One self-contained, offline lesson game (HTML + CSS + JS, no libraries, no network, no image files).
   The ENGINE (top of the <script>) is finished and shared by every game. To make a NEW lesson game you
   edit ONLY the `GAME` object at the very bottom (section "✏️ YOUR GAME"). Do not edit the engine unless
   the task explicitly says so; if you must, keep every public API below working.

   The example inside is Grade 4 · Lesson 6-3 "Model Multi-Step Problems" (enVision), Saudi context,
   the book's own numbers: 8 buses × 24 and 6 vans × 15 → 102 fewer.

1. THE STUDENT'S JOURNEY (what the engine already does)
   Home screen → 🎓 Learn (guided slides) → Level 1 → Level 2 → Level 3 → 🏆 finale.
   Every round:  (word problem?) 🧠 THINK FIRST (CUBES) → the round → ✓ right / ✗ wrong + "why" → next.
   Hints: 💡 reveals the next hint (strategy → step → near-answer). After 2 misses: 👀 "Show me".
   Stars per level = first-try accuracy (3 ★ ≥ 90 %, 2 ★ ≥ 70 %, 1 ★ otherwise).
   Mastery = overall first-try score ≥ 70 %. Progress is saved (localStorage) and can be resumed.

2. THE CHARACTERS (built into the engine as inline SVG — never use copyrighted characters)
   • RAWI — the guide (friendly storyteller with a ghutra). Moods: 'idle', 'good', 'bad', 'hint', 'cheer'.
     Speaks every instruction in the coach bar. Use COACH.say(html, mood).
   • GHUBAR — the dusty mischief-maker who makes the COMMON MISTAKES. He never mocks the student; he makes
     the mistake himself so the student can catch it. Use GHUBAR.pop(html) for a short pop-in bubble,
     and put his lines in GAME.ghubar (one per misconception). Learn slides should include one
     "Ghubar says … what went wrong?" slide.
   Tone: warm, short sentences (≤ 18 words), never "Wrong!" alone — always say WHY.

3. THE HINT SYSTEM (rules)
   • Every round sets `hints: [strategy, step, near-answer]` — exactly 2–3 hints, from general to specific.
   • Hint 1 = a strategy question ("What must you find first?"). Hint 2 = the next step with numbers.
     Hint 3 = almost the answer ("192 − 90 = ?"). NEVER put the final answer in a hint.
   • `solution` (html) is what 👀 Show me displays after 2 misses; it shows the full worked answer.
   • `why(value)` returns a sentence for a SPECIFIC wrong answer (predict the misconceptions!):
       why: v => v === 282 ? 'You added — the question asks how many FEWER.' : 'Check each hidden question.'
   • The engine logs every why-category for the teacher (postMessage 'lesson:mistakes').

4. POP-UP DIALOGS (DIALOG.open) — use them, don't invent new modals
   DIALOG.open({ icon:'🏆', title:'…', html:'…', buttons:[{label:'Next ▸', value:'next', primary:true}] })
   → returns a Promise with the clicked button's value. Esc / backdrop = the first non-primary button.
   Built-in dialogs: How to play (❓ button), level complete (stars), finale, resume, Ghubar's story card.
   Dialogs are focus-trapped, keyboard accessible and read aloud when read-aloud is on.

5. SOUND (SFX) AND READ-ALOUD (VOICE)
   • SFX.play('right'|'wrong'|'tap'|'pop'|'star'|'level'|'win'|'hint') — Web Audio tones, no files.
   • 🔊 button mutes/unmutes (saved). Never autoplay before the first tap (browsers block it; engine handles it).
   • VOICE.say(text) reads aloud (speechSynthesis; 'en-GB' or 'ar-SA'). 🗣 button toggles read-aloud;
     ON by default for GAME.band 'k2' and 'g35'. Every coach line and dialog is read when it is on.

6. THE WORD-PROBLEM SYSTEM (our method + the book's method, ONE path, same everywhere)
   Path shown on screen:  1 🧠 CUBES → 2 🔍 Hidden question → 3 📊 Bars → 4 ✅ Answer
   (steps 2–4 are the "S — Solve" of CUBES; never present them as a different method).

   A round becomes a word problem when it has `problem:` (an object, NOT a string):
     problem: {
       sentences: ['For the trip, 8 buses carry 24 fourth graders each.',   // one array item = one sentence
                   'The school also books a photographer.',                  // ← an EXTRA sentence
                   '6 vans carry 15 third graders each.',
                   'How many fewer third graders than fourth graders go?'],
       question: 3,                    // index of the question sentence (to underline)
       keys: ['each', 'fewer'],        // key words to box (exact words that appear in the text)
       extras: [1]                     // indexes of sentences that do not help (to cross out) — may be []
     }
   The engine runs CUBES automatically before the round:
     C ⭕ tap every number  → U 〰 tap the question sentence → B 🔲 tap the key words →
     E ✂ decide "I need it / Cross out" for each other sentence → S 🧮 "Solve it ▸".
   Wrong taps shake and Rawi explains; after the marks, the marked problem stays visible during the round.
   Set `think:false` on a level (or round) to skip CUBES (e.g. pure computation or an equation level).

   For multi-step lessons, structure the 3 levels as the book's steps (as the example does):
     L1 🔍 choose the HIDDEN QUESTION (type 'choice')
     L2 📊 BARS: a bar model is drawn for every hidden question with LETTERS (never the hidden answers),
         the student types the answer to the ORIGINAL question (type 'bars')
     L3 ✅ choose the ONE EQUATION, e.g. S = (8 × 24) − (6 × 15) (type 'choice', think:false)

7. ROUND TYPES (what `round(i)` may return)
   { type:'choice', prompt, options:[…], answer, why, hints, solution, problem? }
   { type:'number', prompt, answer, prefix?, suffix?, decimal?, why, hints, solution, problem? }   → keypad
   { type:'bars',   prompt, answer, model:{rows:[…], final:{…}}, why, hints, solution, problem? }   → bars + keypad
       model.rows:  [{ letter:'F', label:'fourth graders', n:8, each:24, color:'#ffd23f' }, …]
       model.final: { kind:'compare'|'sum'|'part', letter:'S', total?:282 }  (part = a known total minus rows)
   { type:'order',  prompt, items:[first…last] (correct order), why, hints, solution }           → tap in order
   `round(i)` receives the round index (0-based) so stories can cycle; return a NEW object every call.

8. LEARN SLIDES (GAME.learn)
   [{ say:'html', draw(el, L){…}, wait?:true }] — `wait:true` locks "Next" until the slide calls L.ok(msg).
   Recipe: hook → model (one example, step by step) → your turn (wait) → Ghubar's mistake (wait).
   Helpers for drawing: UI.h(tag, attrs, …children), UI.bars(model, {reveal:true}), UI.steps(n).

9. DATA CONTRACT (the games page listens; keep it)
   parent.postMessage({v:1, type:'lesson:ready', id}) on load
   {type:'lesson:progress', id, stars, done, total} each round · {type:'lesson:level', id, level, stars}
   {type:'lesson:mistakes', id, level, list:[{detail, n}]} · {type:'lesson:done', id, score, total}
   Sent only when embedded in an iframe. Never send names or free text the student typed.

10. ACCESSIBILITY + LOCAL CONTEXT (non-negotiable)
   • Touch targets ≥ GAME band size (k2 72px, g35 56px, g68 44px, g912 40px); every action works by keyboard.
   • Never colour alone (✓ ✗ icons + words). aria-live on the coach. prefers-reduced-motion respected.
   • Arabic: set GAME.lang:'ar' → dir="rtl", Arabic voice; wrap mixed text in <bdi>.
   • Saudi contexts (Jeddah, AlUla, Riyadh, SAR, dates, souq…); keep the TEXTBOOK'S NUMBERS when asked.

11. HOW TO BUILD A NEW GAME — STEP BY STEP (do this, in this order)
   1. Copy this file to `<lesson-code>-<slug>.html`.
   2. Fill GAME.id/code/title/emoji/topic/band/lang/objective/how/welcome.
   3. Write 3–6 Learn slides (section 8). One must be Ghubar's mistake with wait:true.
   4. Write 3 levels — concrete/picture → representational → abstract — each `round(i)` returning a type
      from section 7 with hints (3), why(v) for every predictable mistake, and a full solution.
   5. Word problems: use `problem:{sentences, question, keys, extras}`; include an extra sentence in at
      least some rounds so ✂ has something to cross out.
   6. GAME.ghubar: 3 lines, one per top misconception. GAME.praise: 4–6 short cheers. GAME.finale: one line.
   7. TEST (section 12). Open the file directly in a browser: no console errors, every level finishes.

12. TEST CHECKLIST (the agent must run it before delivering)
   □ Open the file → home screen, ❓ How to play dialog works, 🔊 and 🗣 toggle.
   □ Learn: every slide, the wait slides unlock only after the right action.
   □ Each level: right answer → ✓ + sound + next; wrong → why + shake; 💡 hints in order; 👀 Show me after 2 misses.
   □ CUBES: numbers, question, key words, extras all behave; the marks stay during the round.
   □ Level complete dialog shows stars; finale shows score; reload → resume offered.
   □ Keyboard only: Tab/Enter can finish a round. Arabic (GAME.lang 'ar'): the layout flips.
   □ Automated: window.GAME_TEST.level(0); GAME_TEST.skipThink(); GAME_TEST.pass() … GAME_TEST.state.
   DON'T: load external fonts/scripts/images, use alert()/prompt(), put the answer in a hint, show the
   hidden answers inside the bar model before the student solves them, or exceed 18 words per coach line.
-->
<style>
  :root{
    --ink:#1d1408; --paper:#fffaf0; --panel:#fbf1de; --line:#4a2f15; --brand:#0e7c86; --brand-ink:#095a61;
    --good:#2f8a4f; --good-bg:#e3f4e8; --bad:#c62828; --bad-bg:#fde9e4; --hint:#c98a12; --hint-bg:#fff3c4;
    --c1:#ffd23f; --c2:#7bdff2; --c3:#b6e3a1; --q:#c2521d; --target:56px; --r:16px;
    --font:"Segoe UI","Noto Sans","Noto Sans Arabic",system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:600 17px/1.45 var(--font);color:var(--ink);background:linear-gradient(170deg,#f6e2b4,#e3c48c 60%,#c99d5f);display:flex;flex-direction:column;min-height:100vh}
  button{font:inherit;cursor:pointer;color:inherit} button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#3b2814;color:#fff3d6;box-shadow:0 3px 0 #0003;flex-wrap:wrap}
  .bar h1{margin:0;font-size:18px;flex:1;min-width:150px}.bar small{display:block;font-size:12px;opacity:.75;font-weight:600}
  .chip{background:#ffffff1f;border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap}
  .dots{display:flex;gap:4px}.dots i{width:11px;height:11px;border-radius:50%;background:#ffffff33;display:block}.dots i.on{background:#ffd23f}.dots i.miss{background:#ff8a7a}
  .ibtn{min-width:40px;height:40px;border-radius:12px;border:0;background:#ffffff22;color:#fff;font-size:18px}.ibtn[aria-pressed="false"]{opacity:.5}
  main{flex:1;width:min(980px,100%);margin:0 auto;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px}
  .stage{flex:1;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:320px}
  .prompt{width:100%;font-size:clamp(18px,2.4vw,24px);font-weight:800;text-align:center;margin:0;line-height:1.5}
  .path{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;list-style:none;margin:0;padding:0}
  .path li{padding:4px 12px;border-radius:999px;background:#efe3c8;font-size:13px;font-weight:800;color:#7a6040}
  .path li.done{background:#d8f0dc;color:#1f6b35}.path li.now{background:#ffd23f;color:#3b2814;box-shadow:0 0 0 2px var(--line)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
  .opt{min-height:var(--target);border:3px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 16px;font-size:18px;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .08s}
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.opt.good{background:var(--good-bg);border-color:var(--good)}.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
  .pad{display:grid;grid-template-columns:repeat(3,minmax(var(--target),76px));gap:8px;justify-content:center}
  .pad .disp{grid-column:1/-1;min-height:56px;border-radius:14px;background:#2a1a0c;color:#ffd23f;font-size:30px;font-weight:900;display:grid;place-items:center;letter-spacing:2px}
  .pad button{min-height:var(--target);border-radius:14px;border:3px solid var(--line);background:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--line)}
  .pad .go{grid-column:1/-1;background:var(--brand);color:#fff;border-color:var(--brand-ink)}
  .split{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;width:100%;align-items:start}@media (max-width:720px){.split{grid-template-columns:1fr}}
  .model{background:#fbf1de;border:2.5px solid var(--line);border-radius:16px;padding:10px;width:100%}.model svg{width:100%;height:auto;display:block}
  .model text{font-family:var(--font);font-weight:900;text-anchor:middle}.m-l{font-size:15px;fill:#4a2f15}.m-n{font-size:15px;fill:#1d1408}.m-q{font-size:17px;fill:var(--q)}
  .order{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.order .opt{min-width:160px}.order .opt.used{opacity:.35;pointer-events:none}.picked{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px}.picked span{padding:8px 12px;border-radius:12px;background:var(--good-bg);border:2px solid var(--good);font-weight:800}
  /* coach bar */
  .coach{display:flex;align-items:center;gap:12px;background:#fffaf0;border:3px solid var(--line);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
  .coach .face{width:64px;height:64px;flex:none}.coach .say{flex:1;font-size:16px;min-height:44px;display:flex;align-items:center}
  .coach.good{background:var(--good-bg)}.coach.bad{background:var(--bad-bg)}.coach.hint{background:var(--hint-bg)}
  .cbtn{min-height:44px;border-radius:12px;border:3px solid var(--line);background:#fff;padding:6px 14px;font-weight:900;box-shadow:0 3px 0 var(--line)}.cbtn.hint{background:var(--hint-bg)}.cbtn.show{background:#e9ddff}.cbtn.go{background:var(--brand);color:#fff;border-color:var(--brand-ink)}.cbtn[disabled]{opacity:.45;cursor:default}
  /* characters */
  .bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
  .face.good .mouth{d:path("M24 44 Q32 52 40 44")}.face.bad .brow{transform:rotate(8deg);transform-origin:center}
  .ghubar{position:fixed;inset-inline-end:18px;bottom:110px;z-index:30;display:flex;align-items:flex-end;gap:8px;max-width:min(420px,calc(100% - 36px));animation:gin .35s ease-out}
  .ghubar .gb{background:#fff;border:3px solid #6b5a4a;border-radius:18px 18px 4px 18px;padding:10px 14px;font-weight:800;box-shadow:0 6px 18px #0003}
  @keyframes gin{from{transform:translateY(30px);opacity:0}}
  /* think (CUBES) */
  .think{width:100%;display:flex;flex-direction:column;gap:10px}
  .trail{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.trail span{border-radius:12px;background:#efe3c8;text-align:center;padding:6px 4px;font-size:12px;font-weight:800;color:#7a6040}
  .trail span b{display:block;font-size:20px}.trail span.now{background:#ffd23f;color:#3b2814;box-shadow:0 0 0 2px var(--line)}.trail span.done{background:#d8f0dc;color:#1f6b35}
  .ttext{font-size:clamp(18px,2.4vw,23px);line-height:2;padding:12px 16px;border-radius:16px;background:#fff;border:2.5px solid var(--line)}
  .w{border-radius:6px;padding:1px 2px;cursor:pointer}.w:hover{background:#0001}
  .w.num.on{border:3px solid #d6402a;border-radius:50%;padding:0 6px}.w.key.on{outline:3px solid var(--good);outline-offset:1px}
  .s.q.on{text-decoration:underline;text-decoration-color:#2f6fd1;text-decoration-thickness:3px;text-underline-offset:5px}.s.x{text-decoration:line-through;text-decoration-color:var(--bad);opacity:.5}
  .tcard{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#f6efe0;border:2px solid #d9c29b}.tcard p{flex:1;margin:0;min-width:200px}
  .shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .burst{position:fixed;pointer-events:none;font-size:30px;z-index:50;animation:burst .8s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
  /* home */
  .home{width:100%;display:grid;gap:14px;justify-items:center;text-align:center}.home h2{margin:0;font-size:clamp(26px,4vw,40px)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:100%}
  .card{border:3px solid var(--line);border-radius:18px;background:#fff;padding:14px;box-shadow:0 5px 0 var(--line);display:grid;gap:4px;justify-items:center;min-height:150px}
  .card .ic{font-size:36px}.card b{font-size:17px}.card small{color:#6b5a3a}.card .st{color:#c98a12;letter-spacing:2px}.card.lock{opacity:.55}
  /* dialog */
  .dlg-back{position:fixed;inset:0;background:#1d140899;z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
  .dlg{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 10px 0 var(--line),0 20px 40px #0006;padding:18px 20px;text-align:center;animation:pop .25s ease-out}
  .dlg .di{font-size:48px;line-height:1}.dlg h2{margin:6px 0}.dlg .dh{text-align:start;font-weight:600}.dlg .db{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .dlg ol{text-align:start}.stars{font-size:40px;letter-spacing:6px;color:#c98a12}
  @keyframes pop{from{transform:scale(.85);opacity:0}}@keyframes fade{from{opacity:0}}
  .toast{position:fixed;left:50%;top:70px;translate:-50% 0;z-index:60;background:#3b2814;color:#fff3d6;padding:8px 16px;border-radius:12px;font-weight:800}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  [dir="rtl"] .ghubar .gb{border-radius:18px 18px 18px 4px}
</style>

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 1 · THEME — authored for six-year-olds. Injected AFTER the engine stylesheet, so it overrides
   the template's look without touching a line of the engine.
   Palette comes from GAME.accent / GAME.paper (set by G1THEME.start), so each game has its own place.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  --accent: #0e7c86;
  --accent-deep: #0a5960;
  --paper: #fffaf0;
  --sky-a: #eaf8fb;
  --sky-b: #cdeaf1;
  --ink: #24303f;
  --ink-soft: #55647a;
  --line: #16232f;
  --sun: #ffc93c;
  --good: #2fa45a;
  --bad: #e2564a;
  --hint: #f6a723;
  --shadow: 0 6px 0 rgba(22, 35, 47, .16), 0 14px 30px rgba(22, 35, 47, .10);
  --font: "Fredoka1", "Fredoka2", "Segoe UI", "Noto Sans", system-ui, sans-serif;
  --target: 72px;
}

/* ---------- page ground: sky, sun, sand. Calm, wide, no clutter behind text. ---------- */
html, body { height: auto; min-height: 100%; }
body { min-height: 100vh; display: flex; flex-direction: column; }
body {
  font: 500 18px/1.5 var(--font) !important;
  color: var(--ink) !important;
  background:
    radial-gradient(1200px 420px at 82% -12%, #ffe9a8 0%, rgba(255, 233, 168, 0) 62%),
    linear-gradient(175deg, var(--sky-a) 0%, var(--sky-b) 58%, #ffeec9 100%) !important;
  background-attachment: fixed !important;
  padding-bottom: 18px;
}
body::after {
  content: "";
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  height: 92px;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(120% 100% at 18% 100%, color-mix(in srgb, var(--accent) 26%, #fff) 0 42%, transparent 43%),
    radial-gradient(140% 100% at 88% 100%, color-mix(in srgb, var(--accent) 18%, #fff) 0 48%, transparent 49%);
  opacity: .55;
}
main { position: relative; z-index: 1; width: min(940px, 100%) !important; padding: 16px 14px 18px !important; gap: 14px !important; flex: 1; justify-content: center; }

/* ---------- header: bright, chunky, rounded; icons are SVG so no emoji font is needed ---------- */
.bar {
  background: linear-gradient(160deg, var(--accent) 0%, var(--accent-deep) 100%) !important;
  color: #fff !important;
  padding: 10px 16px !important;
  gap: 12px !important;
  border-radius: 0 0 22px 22px;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 38%, transparent) !important;
  position: relative;
  z-index: 2;
}
.bar h1 { font-size: 21px !important; font-weight: 600 !important; letter-spacing: .1px !important; }
.bar small { font-size: 12.5px !important; opacity: .92 !important; font-weight: 500 !important; letter-spacing: .3px; }
.bar #g-emoji { display: none; }
.chip {
  background: rgba(255, 255, 255, .22) !important;
  color: #fff !important;
  font-weight: 600 !important;
  font-size: 14.5px !important;
  padding: 6px 12px !important;
  border-radius: 999px !important;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(2px);
}
.dots i { width: 12px !important; height: 12px !important; background: rgba(255, 255, 255, .38) !important; }
.dots i.on { background: var(--sun) !important; box-shadow: 0 0 0 3px rgba(255, 201, 60, .25); }
.ibtn {
  min-width: 46px !important; height: 46px !important;
  border-radius: 14px !important;
  background: rgba(255, 255, 255, .18) !important;
  color: #fff !important;
  display: grid; place-items: center;
  border: 0;
  transition: transform .12s ease, background .12s ease;
}
.ibtn:hover { background: rgba(255, 255, 255, .3) !important; transform: translateY(-1px); }
.ibtn:active { transform: translateY(1px) scale(.98); }
.ibtn[aria-pressed="false"] { opacity: .55 !important; }

/* ---------- the stage: a big soft card that centres its content ---------- */
.stage {
  background: var(--paper) !important;
  border: 0 !important;
  border-radius: 28px !important;
  box-shadow: var(--shadow) !important;
  padding: 22px 22px 18px !important;
  justify-content: center;
  gap: 16px !important;
  flex: 0 1 auto !important;
  min-height: 430px;
}
.prompt {
  font: 600 clamp(20px, 2.5vw, 27px)/1.45 var(--font) !important;
  color: var(--ink) !important;
  letter-spacing: .1px !important;
}
.prompt b { color: var(--accent-deep); }
/* picture art gets the room it deserves — the template caps scene SVGs at their drawn size */
/* picture art (never the little inline icons) grows to fill the stage */
/* picture art fills a centred column: the div gets the width, the svg keeps its aspect ratio inside it */
.stage > div:not(.home) { width: 100%; max-width: 660px; margin-inline: auto; }
.stage svg:not(.g1i) { width: 100% !important; height: auto !important; max-width: 660px !important; max-height: 420px !important; object-fit: contain; margin-inline: auto; display: block; }
.stage .split svg:not(.g1i), .stage .model svg:not(.g1i) { max-height: 320px !important; }
.stage .split { align-items: center; }
.model { background: #fff !important; border: 3px solid color-mix(in srgb, var(--accent) 16%, #fff) !important; border-radius: 20px !important; padding: 12px !important; box-shadow: inset 0 0 0 6px #fff; }
/* the bar model is a 640-wide drawing shown at about half that, so its labels are drawn large */
.model text { font-family: var(--font) !important; }
.model .m-l { font-size: 26px !important; fill: #55647a !important; font-weight: 600 !important; }
.model .m-n { font-size: 27px !important; fill: #24303f !important; font-weight: 600 !important; }
.model .m-q { font-size: 28px !important; fill: var(--accent-deep) !important; font-weight: 600 !important; }
/* bars: the model takes the full width, the keypad sits centred underneath */
/* side by side on a wide screen: the model is readable and the keypad stays in reach */
/* flex instead of the template's 1.5fr/1fr grid: the model takes the free space, the pad keeps its size */
.stage .split { display: flex !important; gap: 20px !important; width: 100%; align-items: center !important; justify-content: center; }
.stage .split > div:first-child { flex: 1 1 0; min-width: 0; }
.stage .split > .pad { flex: 0 0 auto; }
.stage .model { max-width: 100%; }
.stage .model svg:not(.g1i) { max-height: none !important; }
@media (max-width: 720px) { .stage .split { grid-template-columns: 1fr !important; } }

/* ---------- home: four playful picture cards ---------- */
.home { gap: 18px !important; }
.home > div:first-child { line-height: 1 !important; }
.home h2 { font: 600 clamp(30px, 4.6vw, 46px)/1.1 var(--font) !important; color: var(--ink) !important; letter-spacing: .1px; }
.home p { color: var(--ink-soft) !important; font-size: 17px !important; max-width: 60ch; }
.cards { gap: 14px !important; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)) !important; }
.card {
  border: 0 !important;
  border-radius: 24px !important;
  background: #fff !important;
  box-shadow: 0 5px 0 rgba(22, 35, 47, .10), 0 16px 28px rgba(22, 35, 47, .10) !important;
  padding: 18px 14px 16px !important;
  min-height: 190px !important;
  gap: 8px !important;
  position: relative;
  overflow: hidden;
  transition: transform .16s cubic-bezier(.2, .7, .3, 1.2), box-shadow .16s ease;
}
.card::before {
  content: "";
  position: absolute; inset-inline: 0; top: 0; height: 6px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #fff));
}
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 0 rgba(22, 35, 47, .12), 0 22px 34px rgba(22, 35, 47, .14) !important; }
.card:active { transform: translateY(0) scale(.99); }
.card .ic { width: 64px; height: 64px; display: grid; place-items: center; font-size: 0 !important; }
.card .ic svg { width: 58px; height: 58px; }
.card b { font: 600 18.5px/1.25 var(--font) !important; color: var(--ink); }
.card small { font-size: 14.5px !important; color: var(--ink-soft) !important; font-weight: 500 !important; }
.card .st { font-size: 17px !important; color: var(--sun) !important; letter-spacing: 2px !important; }

/* ---------- options: big friendly buttons, one clear idea each ---------- */
.opts { gap: 14px !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; max-width: 720px; width: 100%; }
.opts:has(> .opt:nth-child(3):last-child) { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
.opts:has(> .opt:nth-child(5)) { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
/* short letter answers (A/B/C/D) sit in one row of four square tiles */
.opts.short { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; max-width: 620px; }
.opts.short .opt { font-size: 26px !important; min-height: 84px !important; }
.opt {
  min-height: var(--target) !important;
  border: 3px solid color-mix(in srgb, var(--accent) 24%, #fff) !important;
  border-radius: 22px !important;
  background: #fff !important;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 16%, #fff) !important;
  font: 600 20px/1.35 var(--font) !important;
  color: var(--ink) !important;
  padding: 14px 16px !important;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  overflow: hidden;
}
.opt:hover { border-color: var(--accent) !important; transform: translateY(-2px); }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 16%, #fff) !important; }
.opt.good {
  background: #e8f8ee !important;
  border-color: var(--good) !important;
  box-shadow: 0 5px 0 #bfe6cc !important;
  color: #17512f !important;
}
.opt.bad {
  background: #fdecea !important;
  border-color: var(--bad) !important;
  box-shadow: 0 5px 0 #f6cdc7 !important;
  color: #8a2b22 !important;
}
.opt b { font-weight: 600; }
.opt svg:not(.g1i) { display: block; margin: 0 auto 2px; width: 100% !important; max-width: 100% !important; height: auto; }
.opt b, .opt > span { display: block; }
.opt .lab, .opt > div > b:first-child { font-size: 13px; color: var(--ink-soft); letter-spacing: .6px; }

/* ---------- keypad: chunky, tactile, thumb-sized ---------- */
.pad { gap: 10px !important; grid-template-columns: repeat(3, minmax(var(--target), 84px)) !important; }
.pad .disp {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep)) !important;
  color: #fff !important;
  font: 600 34px/1.1 var(--font) !important;
  border-radius: 20px !important;
  min-height: 66px !important;
  letter-spacing: 1px !important;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .16);
  padding: 4px 10px;
}
.pad button {
  border: 0 !important;
  border-radius: 18px !important;
  background: #fff !important;
  color: var(--ink) !important;
  font: 600 24px/1 var(--font) !important;
  min-height: var(--target) !important;
  box-shadow: 0 5px 0 rgba(22, 35, 47, .14), 0 8px 18px rgba(22, 35, 47, .08) !important;
  transition: transform .1s ease, box-shadow .1s ease;
}
.pad button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(22, 35, 47, .14) !important; }
.pad .go {
  background: linear-gradient(160deg, var(--good), #237d45) !important;
  color: #fff !important;
  font-size: 20px !important;
  min-height: 62px !important;
  box-shadow: 0 6px 0 #1b6136 !important;
}

/* ---------- coach: Rawi in a ring, speech in a bubble ---------- */
.coach {
  background: #fff !important;
  border: 0 !important;
  border-radius: 26px !important;
  box-shadow: var(--shadow) !important;
  padding: 12px 18px 12px 12px !important;
  gap: 14px !important;
  align-items: center !important;
  margin-bottom: 14px !important;
}
.coach .face {
  width: 74px !important; height: 74px !important;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 12%, #fff);
  display: grid; place-items: center;
  flex: none;
}
.coach .face svg { width: 66px; height: 66px; }
.coach .say { display: block !important; font: 500 18.5px/1.45 var(--font) !important; color: var(--ink) !important; }
.coach .say > span { display: inline !important; }
.coach .say b { font-weight: 600 !important; }
.coach { position: relative; }
.coach::before {
  content: ""; position: absolute; inset-inline-start: 62px; top: -9px;
  width: 20px; height: 20px; background: inherit; border: 0;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  background: #fff;
}
.coach.good::before { background: #f0fbf4; } .coach.bad::before { background: #fff3f1; } .coach.hint::before { background: #fff8e6; }
.coach.good { background: #f0fbf4 !important; }
.coach.bad { background: #fff3f1 !important; }
.coach.hint { background: #fff8e6 !important; }
.cbtn {
  min-height: 48px !important;
  border: 0 !important;
  border-radius: 16px !important;
  background: #fff !important;
  color: var(--ink) !important;
  font: 600 15.5px/1 var(--font) !important;
  padding: 10px 16px !important;
  box-shadow: 0 4px 0 rgba(22, 35, 47, .14) !important;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .1s ease, box-shadow .1s ease;
}
.cbtn:hover { transform: translateY(-1px); }
.cbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(22, 35, 47, .14) !important; }
.cbtn.hint { background: #fff2cf !important; }
.cbtn.show { background: #efe6ff !important; }
.cbtn.go {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep)) !important;
  color: #fff !important;
  box-shadow: 0 4px 0 var(--accent-deep) !important;
  font-size: 16.5px !important;
}
.cbtn[disabled] { opacity: .45 !important; box-shadow: none !important; }

/* ---------- the CUBES path and the think-first card ---------- */
.path li {
  background: color-mix(in srgb, var(--accent) 10%, #fff) !important;
  color: var(--ink-soft) !important;
  border-radius: 999px !important;
  font: 600 13px/1.2 var(--font) !important;
  padding: 7px 13px !important;
  display: inline-flex; align-items: center; gap: 6px;
}
.path li.now { background: var(--sun) !important; color: #4a3406 !important; box-shadow: 0 0 0 3px rgba(255, 201, 60, .3) !important; }
.path li.done { background: #dff6e6 !important; color: #1c5c37 !important; }
.think { gap: 12px !important; }
.trail span { background: color-mix(in srgb, var(--accent) 9%, #fff) !important; color: var(--ink-soft) !important; border-radius: 14px !important; font: 600 12.5px/1.25 var(--font) !important; padding: 8px 4px !important; }
.trail span b { font: 600 22px/1.1 var(--font) !important; }
.trail span.now { background: var(--sun) !important; color: #4a3406 !important; box-shadow: 0 0 0 3px rgba(255, 201, 60, .3) !important; }
.trail span.done { background: #dff6e6 !important; color: #1c5c37 !important; }
.ttext {
  background: #fff !important;
  border: 3px solid color-mix(in srgb, var(--accent) 20%, #fff) !important;
  border-radius: 20px !important;
  font: 500 clamp(18px, 2.2vw, 22px)/1.95 var(--font) !important;
  padding: 14px 18px !important;
}
.tcard { background: #fffaf0 !important; border: 3px dashed color-mix(in srgb, var(--accent) 30%, #fff) !important; border-radius: 18px !important; }
.w.num.on { border-color: var(--bad) !important; background: #fdecea; }
.w.key.on { outline-color: var(--good) !important; background: #e8f8ee; }
.s.q.on { text-decoration-color: #2f6fd1 !important; }

/* ---------- Ghubar ---------- */
/* Ghubar floats over the board for a few seconds; it must never eat a tap meant for the keypad */
.ghubar { bottom: 118px !important; pointer-events: none; max-width: min(330px, calc(100% - 36px)) !important; z-index: 25 !important; }
.ghubar .gb {
  border: 3px solid #8a755f !important;
  border-radius: 22px 22px 8px 22px !important;
  background: #fffdf7 !important;
  font: 600 16px/1.4 var(--font) !important;
  box-shadow: 0 10px 26px rgba(22, 35, 47, .18) !important;
  padding: 12px 16px !important;
}
.ghubar svg { width: 62px; height: 62px; }

/* ---------- dialogs ---------- */
.dlg-back { background: rgba(20, 32, 44, .55) !important; backdrop-filter: blur(3px); }
.dlg {
  background: var(--paper) !important;
  border: 0 !important;
  border-radius: 28px !important;
  box-shadow: 0 18px 44px rgba(15, 25, 35, .35) !important;
  padding: 24px 24px 20px !important;
}
.dlg .di { font-size: 0 !important; }
.dlg .di svg { width: 68px; height: 68px; }
.dlg h2 { font: 600 clamp(23px, 3vw, 30px)/1.2 var(--font) !important; }
.dlg .dh { font: 500 17px/1.55 var(--font) !important; color: var(--ink); }
.dlg ol { padding-inline-start: 22px; }
.dlg ol li { margin: 6px 0; }
.stars { color: var(--sun) !important; font-size: 44px !important; letter-spacing: 8px !important; text-shadow: 0 3px 0 rgba(0, 0, 0, .08); }
.toast { background: var(--ink) !important; color: #fff !important; border-radius: 14px !important; font: 600 15px/1 var(--font) !important; }

/* ---------- inline icons that replace emoji ---------- */
svg.g1i {
  width: 1.15em; height: 1.15em;
  display: inline-block;
  vertical-align: -0.2em;
  margin-inline-end: 0.28em;
  flex: none;
}
.card .ic svg.g1i, .dlg .di svg.g1i { margin: 0; }

/* ---------- hero art on the home screen ---------- */
.hero { width: min(560px, 100%); margin: 0 auto; }
.hero svg { width: 100%; height: auto; display: block; }

/* ---------- small screens: keep targets big, reduce the chrome ---------- */
@media (max-width: 620px) {
  body { font-size: 17px !important; }
  .bar { padding: 8px 10px !important; gap: 6px !important; border-radius: 0 0 18px 18px; }
  /* one tidy row: the level name shortens instead of pushing the buttons onto a second line */
  .bar { flex-wrap: wrap !important; }
  /* the level name gets its own line under the title rather than being cut to "The missing pla" */
  .bar #g-level { order: 5; flex: 1 0 100%; max-width: none; font-size: 12.5px !important;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .dots { display: none; }
  .bar .bar-spacer { display: none; }
  .chip { font-size: 12px !important; padding: 4px 8px !important; }
  .chip svg.g1i { width: 14px; height: 14px; }
  .ibtn { min-width: 40px !important; height: 40px !important; border-radius: 12px !important; }
  .ibtn svg.g1i { width: 20px; height: 20px; }
  .hero svg { max-height: 170px; }
  .bar h1 { font-size: 17px !important; }
  .bar small { font-size: 11px !important; }
  .chip { font-size: 12.5px !important; padding: 5px 9px !important; }
  .ibtn { min-width: 42px !important; height: 42px !important; }
  .stage { padding: 16px 14px 14px !important; border-radius: 22px !important; }
  .coach { padding: 10px 12px 10px 10px !important; border-radius: 22px !important; }
  .coach .face { width: 56px !important; height: 56px !important; }
  .coach .face svg { width: 50px; height: 50px; }
  .coach .say { font-size: 16.5px !important; }
  .cards { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .card { min-height: 164px !important; padding: 14px 10px !important; }
  .card .ic { width: 50px; height: 50px; }
  .card .ic svg { width: 46px; height: 46px; }
  .opt { font-size: 18px !important; padding: 12px 12px !important; }
}

@media (prefers-reduced-motion: reduce) {
  .card, .opt, .cbtn, .pad button, .ibtn { transition: none !important; }
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   lesson-shell — the نبع/موازي ten-section frame rendered under the home screen (see shared/lesson.js).
   Kept deliberately quiet: paper card, hairline rules, no new accent colours, so it never competes with
   the game's own hero art. Everything is fluid and collapses to one column below 480px.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
.lesson-shell{
  margin:18px auto 6px;max-width:760px;padding:16px 18px;border-radius:16px;
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);
  text-align:start;line-height:1.7;
}
.lesson-shell,.lesson-shell *{box-sizing:border-box}
.ls-details{margin-block-start:8px}
.ls-summary{display:flex;flex-wrap:wrap;align-items:center;gap:7px;cursor:pointer;list-style:none;
  font-size:.86rem;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,transparent);
  border:1px solid var(--line)}
.ls-summary::-webkit-details-marker{display:none}
.ls-summary:hover{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.ls-sum-ic{font-size:.95rem;line-height:1}
.ls-chev{margin-inline-start:auto;color:var(--hint);transition:transform .18s ease}
.ls-details[open] .ls-chev{transform:rotate(180deg)}
.ls-body{padding-block-start:2px}
.ls-code{font-size:.72rem;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent-deep);white-space:nowrap}
.ls-title{font-size:.86rem;color:var(--ink-soft)}
.ls-p2{margin:0;font-size:.72rem;color:var(--hint);
  padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--hint) 9%,transparent);
  border-inline-start:3px solid var(--hint)}
.ls-sec{padding-block:10px;border-block-start:1px solid var(--line)}
.ls-sec h4{margin:0 0 6px;font-size:.82rem;letter-spacing:.01em;color:var(--accent-deep)}
.ls-ayah{margin:0;font-size:1.06rem;line-height:2;text-align:center;color:var(--ink)}
.ls-ref{margin:2px 0 8px;font-size:.74rem;text-align:center;color:var(--ink-soft)}
.ls-note{margin:8px 0 0;font-size:.76rem;color:var(--ink-soft);
  padding-inline-start:9px;border-inline-start:2px solid var(--accent)}
.ls-roots{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-block-start:8px}
.ls-lbl{font-size:.74rem;color:var(--hint)}
.ls-root{font-size:.84rem;padding:3px 9px;border-radius:8px;font-weight:600;
  background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent-deep)}
.ls-story{margin:0 0 6px;font-size:.84rem;color:var(--ink-soft)}
.ls-objs,.ls-exit,.ls-hw{margin:0;padding-inline-start:20px;font-size:.84rem}
.ls-objs li,.ls-hw li{margin-block:3px}
.ls-exit{list-style:none;padding-inline-start:0}
.ls-exit li{display:flex;gap:8px;margin-block:4px;align-items:flex-start}
.ls-grade{flex:0 0 auto;font-weight:700;color:var(--accent-deep);min-width:1.4em}
.ls-crit{margin:8px 0 0;font-size:.78rem;color:var(--ink-soft);font-weight:600}
.ls-stations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ls-station{padding:9px 10px;border-radius:11px;background:color-mix(in srgb,var(--sky-b) 55%,var(--paper));
  border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.ls-station b{font-size:.79rem;color:var(--accent-deep)}
.ls-station small{font-size:.73rem;color:var(--ink-soft);line-height:1.5}
.ls-blocks{margin:8px 0 0;font-size:.74rem;color:var(--hint)}
.ls-reflect{margin:0;font-size:.84rem;color:var(--ink-soft)}
@media (max-width:640px){ .ls-stations{grid-template-columns:1fr} }
@media (max-width:480px){
  .lesson-shell{margin-block-start:14px;padding:13px 13px;border-radius:13px}
  .ls-ayah{font-size:1rem;line-height:1.95}

  /* ---------- 🧠 THINK FIRST: CUBES on a word problem ---------- */
  function think(stage, p, done) {
    const box = UI.h('div', { class: 'think' }), trail = UI.h('div', { class: 'trail' });
    const ST = [['C', '⭕', T('tC')], ['U', '〰', T('tU')], ['B', '🔲', T('tB')], ['E', '✂', T('tE')], ['S', '🧮', T('tS')]];

    const text = UI.h('div', { class: 'ttext' }), head = UI.h('p', { class: 'prompt', style: 'font-size:18px;margin:0' }), extra = UI.h('div', { style: 'display:grid;gap:8px' });

        if (!todo.length) return go(4);

          const i = todo[k], isExtra = (p.extras || []).includes(i), c = UI.h('div', { class: 'tcard' });

            UI.h('button', { class: 'cbtn', text: T('need'), onclick: e => isExtra ? (UI.shake(e.target), SFX.play('wrong'), COACH.say('Look again — does it help answer the question?', 'bad')) : settle(false) }),
            UI.h('button', { class: 'cbtn', text: T('cut'), onclick: e => !isExtra ? (UI.shake(e.target), SFX.play('wrong'), COACH.say('You need this one — it has numbers you use!', 'bad')) : settle(true) }));

        };

      } else {
        head.textContent = '🧮 ' + T('sGo'); COACH.say(T('sGo'), 'good');
        const b = UI.h('button', { class: 'cbtn go', text: T('solve'), onclick: () => { SFX.play('tap'); box.remove(); done(text); } });
        extra.append(b); setTimeout(() => b.focus(), 30);
      }
    };
    text.addEventListener('click', e => {
      const w = e.target.closest('.w'); if (!w) return;
      if (step === 0) { if (w.classList.contains('num')) { if (!w.classList.contains('on')) { w.classList.add('on'); SFX.play('tap'); } if (nums.every(x => x.classList.contains('on'))) later(() => go(1), 350); } else { UI.shake(w); SFX.play('wrong'); COACH.say('That is not a number. Tap the numbers.', 'bad'); } }
      else if (step === 1) { const se = w.closest('.s'); if (+se.dataset.s === p.question) { se.classList.add('on'); SFX.play('right'); later(() => go(2), 350); } else { UI.shake(se); SFX.play('wrong'); COACH.say('That sentence does not ask anything. Find the question.', 'bad'); } }
      else if (step === 2) { if (w.classList.contains('key')) { w.classList.add('on'); SFX.play('tap'); if (keyEls.every(x => x.classList.contains('on'))) later(() => go(3), 350); } else { UI.shake(w); SFX.play('wrong'); COACH.say('Key words tell you WHAT TO DO — like “each” or “fewer”.', 'bad'); } }
    });
    text.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('w')) { e.preventDefault(); e.target.click(); } });
    THINKING = { skip: () => { box.remove(); done(text); } };
    go(0);
  }
  let THINKING = null;

  /* ---------- a ROUND ---------- */
  function round() {
    clearTimers(); THINKING = null;
    const L = GAME.levels[S.li], q = L.round(S.ri), stage = $('#stage');
    stage.innerHTML = ''; bar();
    R = { q, tries: 0, hint: 0, done: false };
    if (L.path != null) stage.append(UI.steps(L.path));
    const useThink = q.problem && L.think !== false && q.think !== false;
    const body = marked => {
      const pr = UI.h('p', { class: 'prompt' });
      if (marked) { pr.append(marked); marked.classList.add('ttext'); marked.style.pointerEvents = 'none'; } else pr.innerHTML = q.prompt || (q.problem ? q.problem.sentences.join(' ') : '');
      stage.append(pr);
      if (marked && q.prompt) stage.append(UI.h('p', { class: 'prompt', style: 'font-size:18px', html: q.prompt }));
      KINDS[q.type || 'choice'](stage, q);
      COACH.say(q.say || L.say || '', ''); hintTools();
    };
    if (useThink) { COACH.tools(); think(stage, q.problem, body); } else body(null);
    tell({ type: 'lesson:progress', stars: S.stars.reduce((a, b) => a + b, 0), done: S.done, total: total() });
  }
  function hintTools() {
    const q = R.q, hb = UI.h('button', { class: 'cbtn hint', text: T('hint'), onclick: () => {
      SFX.play('hint');
      if (R.hint < (q.hints || []).length) COACH.say('💡 ' + q.hints[R.hint++], 'hint'); else COACH.say(T('noHint'), 'hint');
    } });
    const sb = R.tries >= 2 && q.solution ? UI.h('button', { class: 'cbtn show', text: T('show'), onclick: showMe }) : null;
    COACH.tools(q.hints && q.hints.length ? hb : null, sb);
  }
  function showMe() {
    if (R.done) return; R.done = true; SFX.play('pop');
    COACH.say('👀 ' + R.q.solution, 'hint');
    if (R.solve) R.solve();
    COACH.tools(UI.h('button', { class: 'cbtn go', text: T('next'), onclick: nextRound }));
    S.streak = 0; S.done++; S.ri++; save(); bar();
  }
  function right(at) {
    if (R.done) return; R.done = true;
    if (R.tries === 0) S.first++;
    S.streak++; S.best = Math.max(S.best, S.streak); S.done++; S.ri++;
    SFX.play(S.streak > 0 && S.streak % 5 === 0 ? 'star' : 'right'); UI.burst(at);
    COACH.say('✓ ' + UI.pick(GAME.praise || ['Brilliant!']) + (S.streak >= 3 ? ` 🔥 ${S.streak}` : ''), 'good');
    COACH.tools(); save(); bar();
    later(nextRound, 1300);
  }
  function wrong(v, at) {
    if (R.done) return;
    R.tries++; S.streak = 0; SFX.play('wrong'); UI.shake(at);
    const why = R.q.why ? R.q.why(v) : '';
    COACH.say('✗ ' + (why || 'Not quite — look again.'), 'bad');
    if (why) mistakes[why] = (mistakes[why] || 0) + 1;
    if (R.tries === 1 && GAME.ghubar && Math.random() < .35) later(() => GHUBAR.pop(UI.pick(GAME.ghubar)), 900);
    hintTools(); bar();
  }
  function nextRound() {
    clearTimers();
    const L = GAME.levels[S.li];
    if (S.ri < L.rounds) return round();
    finishLevel();
  }
  async function finishLevel() {
    const L = GAME.levels[S.li], acc = S.first / L.rounds, st = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
    S.stars[S.li] = Math.max(S.stars[S.li] || 0, st);
    tell({ type: 'lesson:level', level: S.li, stars: st });
    const list = Object.entries(mistakes).map(([detail, n]) => ({ detail, n })); if (list.length) tell({ type: 'lesson:mistakes', level: S.li, list }); mistakes = {};
    SFX.play('level'); save(); bar();
    const last = S.li >= GAME.levels.length - 1;
    const v = await DIALOG.open({ icon: L.icon || '⭐', title: T('done'), html: `<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div><p style="text-align:center">${L.name} · ${S.first} / ${L.rounds} first try</p>`,
      buttons: [{ label: T('again'), value: 'again' }, { label: last ? '🏆 ' + T('finale') : T('cont'), value: 'next', primary: true }] });
    if (v === 'again') return startLevel(S.li);
    if (last) return finale();
    startLevel(S.li + 1);
  }
  async function finale() {
    const tot = total(), score = Math.round(S.stars.reduce((a, b) => a + b, 0) / (GAME.levels.length * 3) * tot);
    tell({ type: 'lesson:done', score, total: tot });
    SFX.play('win'); UI.burst();
    const pct = Math.round(score / tot * 100);
    await DIALOG.open({ icon: '🏆', title: GAME.finale || T('finale'), html: `<div class="stars">${S.stars.map(s => '★'.repeat(s) + '☆'.repeat(3 - s)).join(' ')}</div><p style="text-align:center">${T('score')}: ${pct}% · ${T('mastery')}: ${pct >= 70 ? '✅' : '🌱'}</p>`,
      buttons: [{ label: T('homeB'), value: 'home', primary: true }] });
    S.li = -1; S.ri = 0; save(); home();
  }
  function startLevel(i) { S.li = i; S.ri = 0; S.first = 0; mistakes = {}; save(); const L = GAME.levels[i]; if (L.intro) COACH.say(L.intro); round(); }

  /* ---------- ROUND KINDS ---------- */
  function keypad(stage, q, onEnter) {
    const pad = UI.h('div', { class: 'pad', role: 'group', 'aria-label': 'number pad' }), disp = UI.h('div', { class: 'disp', 'aria-live': 'polite' });
    let val = '';
    const show = () => { disp.textContent = (q.prefix || '') + (val || '?') + (q.suffix || ''); };
    const press = k => { if (R.done) return; SFX.play('tap'); if (k === '⌫') val = val.slice(0, -1); else if (k === '.' && (!q.decimal || val.includes('.'))) return; else if (val.length < 7) val += k; show(); };
    pad.append(disp);
    ['7', '8', '9', '4', '5', '6', '1', '2', '3', q.decimal ? '.' : '', '0', '⌫'].forEach(k => pad.append(k ? UI.h('button', { text: k, 'aria-label': k === '⌫' ? 'delete' : k, onclick: () => press(k) }) : UI.h('span')));
    const go = UI.h('button', { class: 'go', text: T('check'), onclick: () => { if (!val) return; const v = Number(val); onEnter(v, disp); if (!R.done) { val = ''; show(); } } });
    pad.append(go); show();
    R.keydown = e => { if (/^[0-9.]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Enter') go.click(); };
    R.solve = () => { val = String(q.answer); show(); };
    stage.append(pad); return pad;
  }
  const same = (v, a) => Math.abs(Number(v) - Number(a)) < 1e-9;
  const KINDS = {
    choice(stage, q) {
      const opts = UI.h('div', { class: 'opts' });
      UI.shuffle(q.options.slice()).forEach(o => {
        const b = UI.h('button', { class: 'opt', html: String(o), onclick: () => { if (R.done) return; if (o === q.answer) { b.classList.add('good'); right(b); } else { b.classList.add('bad'); wrong(o, b); } } });
        opts.append(b);
      });
      R.solve = () => opts.querySelectorAll('.opt').forEach(b => { if (b.innerHTML === String(q.answer)) b.classList.add('good'); });
      stage.append(opts);
    },
    number(stage, q) { keypad(stage, q, (v, at) => same(v, q.answer) ? right(at) : wrong(v, at)); },
    bars(stage, q) {
      const wrap = UI.h('div', { class: 'split' }), left = UI.h('div', {});
      left.append(UI.bars(q.model)); wrap.append(left); stage.append(wrap);
      keypad(wrap, q, (v, at) => same(v, q.answer) ? right(at) : wrong(v, at));
      const solve0 = R.solve; R.solve = () => { solve0(); left.innerHTML = ''; left.append(UI.bars(q.model, { reveal: true, answer: q.answer })); };
    },
    order(stage, q) {
      const items = q.items.slice(), got = [], picked = UI.h('div', { class: 'picked' }), pool = UI.h('div', { class: 'order' });
      UI.shuffle(items.slice()).forEach(it => {
        const b = UI.h('button', { class: 'opt', html: it, onclick: () => {
          if (R.done) return;
          if (it === items[got.length]) { got.push(it); b.classList.add('used'); picked.append(UI.h('span', { html: got.length + '. ' + it })); SFX.play('tap'); if (got.length === items.length) right(b); }
          else wrong(it, b);
        } });
        pool.append(b);
      });
      R.solve = () => { picked.innerHTML = items.map((it, i) => `<span>${i + 1}. ${it}</span>`).join(''); };
      stage.append(picked, pool);
    }
  };
  document.addEventListener('keydown', e => { if (R && !R.done && R.keydown && !document.querySelector('.dlg-back')) R.keydown(e); });

  /* ---------- 🎓 LEARN ---------- */
  function learn(i) {
    clearTimers(); S.li = 99; bar();
    const slides = GAME.learn || [], sl = slides[i], stage = $('#stage');
    stage.innerHTML = ''; $('#g-dots').innerHTML = slides.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
    let ready = !sl.wait;
    const last = i === slides.length - 1;
    const next = UI.h('button', { class: 'cbtn go', text: last ? T('ready') : T('next'), onclick: () => { if (!ready) return; SFX.play('tap'); last ? startLevel(0) : learn(i + 1); } });
    const back = i > 0 ? UI.h('button', { class: 'cbtn', text: '◂', 'aria-label': 'back', onclick: () => learn(i - 1) }) : null;
    next.disabled = !ready;
    const Lc = { ok(msg) { ready = true; next.disabled = false; SFX.play('right'); if (msg) COACH.say(msg, 'good'); COACH.tools(back, next); next.focus(); } };
    COACH.say(sl.say, sl.wait ? 'hint' : '');
    COACH.tools(back, next);
    if (sl.draw) sl.draw(stage, Lc);
  }

  /* ---------- 🏠 HOME ---------- */
  function home() {
    clearTimers(); S.li = -1; bar(); R = null;
    const stage = $('#stage'); stage.innerHTML = '';
    const h = UI.h('div', { class: 'home' });
    h.append(UI.h('div', { style: 'font-size:64px', text: GAME.emoji }), UI.h('h2', { text: GAME.title }), UI.h('p', { style: 'margin:0;max-width:640px', html: GAME.objective || '' }));
    const cards = UI.h('div', { class: 'cards' });
    cards.append(UI.h('button', { class: 'card', onclick: () => { SFX.play('tap'); learn(0); } }, UI.h('span', { class: 'ic', text: '🎓' }), UI.h('b', { text: T('learn') }), UI.h('small', { text: GAME.learnBlurb || 'A guided walk-through' })));
    GAME.levels.forEach((L, i) => cards.append(UI.h('button', { class: 'card', onclick: () => { SFX.play('tap'); startLevel(i); } },
      UI.h('span', { class: 'ic', text: L.icon || '⭐' }), UI.h('b', { text: `${T('level')} ${i + 1} · ${L.name}` }), UI.h('small', { text: L.blurb || '' }), UI.h('span', { class: 'st', text: '★'.repeat(S.stars[i] || 0) + '☆'.repeat(3 - (S.stars[i] || 0)) }))));
    h.append(cards); stage.append(h);
    COACH.say(GAME.welcome || '', 'cheer'); COACH.tools();
  }
  function howTo() {
    return DIALOG.open({ icon: '❓', title: T('how'), html: `<p>${GAME.how.what}</p><ol>${GAME.how.steps.map(s => `<li>${s}</li>`).join('')}</ol>` });
  }

  /* ---------- START ---------- */
  function boot() {
    document.documentElement.lang = GAME.lang || 'en'; document.documentElement.dir = GAME.lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.style.setProperty('--target', ({ k2: 72, g35: 56, g68: 44, g912: 40 }[GAME.band] || 56) + 'px');
    document.title = GAME.title; $('#g-emoji').textContent = GAME.emoji; $('#g-title').firstChild.textContent = GAME.title; $('#g-sub').textContent = `${GAME.code} · ${GAME.topic}`;
    const sb = $('#b-sound'), vb = $('#b-voice');
    const sync = () => { sb.setAttribute('aria-pressed', SFX.on); sb.textContent = SFX.on ? '🔊' : '🔇'; vb.setAttribute('aria-pressed', VOICE.on); };
    sb.onclick = () => { SFX.on = !SFX.on; sync(); SFX.play('tap'); }; vb.onclick = () => { VOICE.on = !VOICE.on; sync(); UI.toast(VOICE.on ? '🗣 on' : '🗣 off'); };
    $('#b-help').onclick = howTo; $('#b-home').onclick = home; sync();
    let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY()) || 'null'); } catch (e) { /* new */ }
    if (saved) S = Object.assign(S, saved, { li: saved.li });
    home(); tell({ type: 'lesson:ready' });
    if (saved && saved.li >= 0 && saved.li < GAME.levels.length && saved.ri > 0)
      DIALOG.open({ icon: '💾', title: T('resume'), html: `<p style="text-align:center">${GAME.levels[saved.li].name} · ${saved.ri} / ${GAME.levels[saved.li].rounds}</p>`, buttons: [{ label: T('no'), value: 'no' }, { label: T('yes'), value: 'yes', primary: true }] })
        .then(v => { if (v === 'yes') { S.li = saved.li; S.ri = saved.ri; round(); } else { S.ri = 0; S.li = -1; save(); } });
    else if (!saved) howTo();
  }
  /* ---------- test hooks (automated tests and screenshots) ---------- */
  window.GAME_TEST = {
    get state() { return { li: S.li, ri: S.ri, stars: S.stars.slice(), streak: S.streak, done: S.done, thinking: !!(THINKING && document.querySelector('.think')) }; },
    level: i => startLevel(i), learn: () => learn(0), home: () => home(), reset() { try { localStorage.removeItem(KEY()); } catch (e) { /* fine */ } S = { li: -1, ri: 0, stars: [0, 0, 0], first: 0, streak: 0, best: 0, done: 0 }; home(); },
    skipThink() { if (THINKING && document.querySelector('.think')) THINKING.skip(); },
    pass() { if (!R || R.done) return false; GAME_TEST.skipThink(); if (R.solve) R.solve(); right(); return true; },
    fail(v) { if (R && !R.done) wrong(v == null ? -1 : v); }
  };
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   ✏️ YOUR GAME — authored for this lesson. The engine above is the Fikr lesson-game template, unchanged;
   only this block and the shared theme/icons/art below it are new.
   Source: games/grade2/src/03-caravan-compare.js
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════════════════════════════════
   GRADE 1 PICTURE LIBRARY — game-side help, not engine code.
   Every function returns an HTML string (inline SVG) that a round or Learn slide can put in `prompt`,
   `say` or `UI.h(..., {html})`. Nothing here fetches, and no picture ever states a total the drawing
   does not show: the number and the objects are always produced from the same argument.
   ══════════════════════════════════════════════════════════════════════════════════════════════════════ */
const SCENE = (() => {
  const INK = '#4a2f15', PAPER = '#fffaf0', BRAND = '#0e7c86', C1 = '#ffd23f', C2 = '#7bdff2', C3 = '#b6e3a1';
  const wrap = (w, hgt, label, body, max) =>
    `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="${label}" style="width:100%;max-width:${max || w}px;display:block;margin:0 auto">${body}</svg>`;
  const card = (w, hgt, fill) => `<rect x="2" y="2" width="${w - 4}" height="${hgt - 4}" rx="18" fill="${fill || PAPER}" stroke="${INK}" stroke-width="2.5" opacity=".98"/>`;
  const label = (txt, x, y, size, color) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size || 15}" font-weight="800" fill="${color || INK}">${txt}</text>`;

  /* one fish, drawn so a 6-year-old can point at it */
  const fish = (x, y, col, k) =>
    `<g><ellipse cx="${x}" cy="${y}" rx="${13 * k}" ry="${8.6 * k}" fill="${col}"/><path d="M${x - 11 * k} ${y} l${-9 * k} ${-6 * k} v${12 * k}Z" fill="${col}"/><circle cx="${x + 6 * k}" cy="${y - 2 * k}" r="${1.7 * k}" fill="#123a4d"/></g>`;
  const shell = (x, y, col, k) =>
    `<g><path d="M${x} ${y + 10 * k} q${-11 * k} 0 ${-11 * k} ${-9 * k} q0 ${-9 * k} ${11 * k} ${-9 * k} q${11 * k} 0 ${11 * k} ${9 * k} q0 ${9 * k} ${-11 * k} ${9 * k}Z" fill="${col}" stroke="${INK}" stroke-width="1.6"/><path d="M${x} ${y - 7 * k} v${16 * k}" stroke="${INK}" stroke-width="1.2" opacity=".6"/></g>`;
  const lantern = (x, y, col, out, k) =>
    `<g opacity="${out ? 0.45 : 1}"><path d="M${x} ${y - 13 * k} C${x - 11 * k} ${y + 2 * k} ${x - 7 * k} ${y + 13 * k} ${x} ${y + 13 * k} C${x + 7 * k} ${y + 13 * k} ${x + 11 * k} ${y + 2 * k} ${x} ${y - 13 * k}Z" fill="${out ? '#8f9bb3' : col}" stroke="${INK}" stroke-width="1.6"/>${out ? `<line x1="${x - 8 * k}" y1="${y - 8 * k}" x2="${x + 8 * k}" y2="${y + 8 * k}" stroke="${INK}" stroke-width="2"/>` : `<circle cx="${x}" cy="${y + 1 * k}" r="${3.4 * k}" fill="#fff3b0"/>`}<line x1="${x}" y1="${y - 19 * k}" x2="${x}" y2="${y - 13 * k}" stroke="${INK}" stroke-width="1.6"/></g>`;
  const leaf = (x, y, col, k) =>
    `<g><path d="M${x} ${y + 10 * k} q0 ${-9 * k} 0 ${-16 * k}" stroke="#4e7d52" stroke-width="${2 * k}" fill="none"/><ellipse cx="${x - 4.5 * k}" cy="${y - 4 * k}" rx="${5.5 * k}" ry="${3.2 * k}" fill="${col}" transform="rotate(-24 ${x} ${y})"/><ellipse cx="${x + 4.5 * k}" cy="${y - 8 * k}" rx="${5.5 * k}" ry="${3.2 * k}" fill="${col}" transform="rotate(24 ${x} ${y})"/></g>`;
  const pearl = (x, y, col, r) =>
    `<g><circle cx="${x}" cy="${y}" r="${r || 10}" fill="${col}" stroke="${INK}" stroke-width="1.2"/><circle cx="${x - (r || 10) * 0.3}" cy="${y - (r || 10) * 0.34}" r="${(r || 10) * 0.26}" fill="#ffffff" opacity=".7"/></g>`;

  /* a ten-frame: two rows of five; a second frame starts when the count passes ten */
  function tenFrame(n, opts) {
    opts = opts || {};
    const col = opts.color || BRAND, kind = opts.kind || 'dot', frames = n > 10 ? 2 : 1;
    const W = frames === 2 ? 520 : 300, H = 170;
    let body = card(W, H, opts.fill || '#f2fbfb');
    for (let f = 0; f < frames; f++) {
      const ox = frames === 2 ? 20 + f * 260 : 20;
      for (let c = 0; c < 5; c++) {
        for (let r = 0; r < 2; r++) {
          const cx = ox + 20 + c * 44, cy = 34 + r * 62;
          body += `<rect x="${cx - 19}" y="${cy - 19}" width="38" height="38" rx="6" fill="#fff" stroke="${INK}" stroke-width="1.4" opacity=".55"/>`;
          const i = f * 10 + r * 5 + c;
          if (i >= n) continue;
          body += kind === 'fish' ? fish(cx, cy, col, 1)
            : kind === 'shell' ? shell(cx, cy - 3, col, 1)
            : kind === 'leaf' ? leaf(cx, cy, col, 1)
            : `<circle cx="${cx}" cy="${cy}" r="11" fill="${col}"/>`;
        }
      }
    }
    return wrap(W, H, `${n} objects drawn in a ten-frame`, body);
  }

  /* two trays of pearls, one count each — never a label that disagrees with the dots */
  function trays(a, b, opts) {
    opts = opts || {};
    const W = 520, H = 230, per = 5, rows = 3;
    let body = card(W, H, opts.fill || '#fff6e6');
    [[a, 24, opts.colorA || C2, 'Tray A'], [b, 272, opts.colorB || '#a9577a', 'Tray B']].forEach(([n, ox, col, name]) => {
      body += `<rect x="${ox}" y="18" width="224" height="158" rx="14" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
      /* pearls are spread over three rows and centred in each row, so counting never needs a squint */
      for (let r = 0; r < rows; r++) {
        const inRow = Math.min(per, n - r * per);
        if (inRow <= 0) continue;
        const span = (inRow - 1) * 40;
        for (let c = 0; c < inRow; c++) {
          const x = ox + 112 - span / 2 + c * 40, y = 52 + r * 42;
          body += pearl(x, y, col, 14);
        }
      }
      body += label(name, ox + 112, 202, 17, INK);
    });
    return wrap(W, H, `tray A with ${a} pearls and tray B with ${b} pearls`, body);
  }

  /* lanterns: `lit` of `total` still glow, the rest are crossed out */
  function lanterns(total, lit, opts) {
    opts = opts || {};
    const cols = total <= 6 ? total : total <= 10 ? 5 : 10;
    const W = 520, H = total > 10 ? 190 : 180, gap = W / (cols + 1);
    let body = card(W, H, opts.fill || '#25324a');
    for (let i = 0; i < total; i++) {
      const x = gap + (i % cols) * gap, y = 72 + Math.floor(i / cols) * 66;
      body += lantern(x, y, opts.color || '#e5744d', i >= lit, 1.45);
    }
    return wrap(W, H, `${total} lanterns, ${lit} of them still glowing`, body);
  }

  /* two joining groups: `a` then `b`, with a plus between them */
  function join(a, b, opts) {
    opts = opts || {};
    const W = 520, H = 200, kind = opts.kind || 'leaf';
    let body = card(W, H, opts.fill || '#f2fbef');
    [[a, 24, opts.colorA || C3, 'first group'], [b, 292, opts.colorB || BRAND, 'then this group']].forEach(([n, ox, col, name]) => {
      body += `<rect x="${ox}" y="24" width="204" height="120" rx="14" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
      for (let i = 0; i < n; i++) {
        const x = ox + 26 + (i % 4) * 44, y = 54 + Math.floor(i / 4) * 42;
        body += kind === 'shell' ? shell(x, y, col, 1) : leaf(x, y, col, 1);
      }
      body += label(name, ox + 102, 172, 13, INK);
    });
    body += label('+', 260, 100, 36, '#8a97ad');
    return wrap(W, H, `${a} objects and ${b} more objects`, body);
  }

  /* coral tiles: a repeating unit, then a dashed slot for "what comes next" */
  function tiles(seq, opts) {
    opts = opts || {};
    const W = 560, H = 200, n = seq.length, slots = n + (opts.next === false ? 0 : 1);
    const step = Math.min(88, (W - 60) / slots), size = step * 0.78;
    const x0 = (W - slots * step) / 2 + step / 2, y = H / 2 - size / 2 + 6;
    const cols = { A: '#e66f61', B: '#428caa', C: '#e0a93f' };
    let body = card(W, H, opts.fill || '#eefaf8');
    seq.forEach((k, i) => {
      const x = x0 + i * step;
      body += `<rect x="${x - size / 2}" y="${y}" width="${size}" height="${size}" rx="18" fill="${cols[k] || cols.A}" stroke="${INK}" stroke-width="2.5"/>${label(k, x, y + size / 2 + 8, size * 0.46, '#fff')}`;
    });
    if (opts.next !== false) {
      const x = x0 + n * step;
      body += `<rect x="${x - size / 2}" y="${y}" width="${size}" height="${size}" rx="18" fill="#fff" stroke="${INK}" stroke-width="3" stroke-dasharray="8 6"/>${label('?', x, y + size / 2 + 9, size * 0.5, INK)}`;
    }
    return wrap(W, H, opts.label || 'a repeating tile pattern with one empty slot', body);
  }

  /* four flat shapes, lettered A–D, so a choice can answer with a letter */
  function shapes(opts) {
    opts = opts || {};
    const names = ['triangle', 'square', 'rectangle', 'circle'], cols = ['#e0693f', '#7656b8', '#2a8b91', '#4d8f5c'];
    const order = opts.order || names, rot = opts.rot || 0;
    const W = 520, H = 190, cell = 118;
    let body = card(W, H, opts.fill || '#f7f1fb');
    order.forEach((nm, i) => {
      const cx = 68 + i * 128, cy = 88, r = 33;
      body += `<rect x="${cx - 52}" y="26" width="104" height="112" rx="12" fill="#fff" stroke="#d9cfe8" stroke-width="2"/>`;
      const tf = `transform="rotate(${rot + (opts.spin || 0) * i} ${cx} ${cy})"`;
      if (nm === 'triangle') body += `<polygon points="${cx},${cy - r} ${cx - r},${cy + r * 0.78} ${cx + r},${cy + r * 0.78}" fill="${cols[i % 4]}" ${tf}/>`;
      else if (nm === 'square') body += `<rect x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}" fill="${cols[i % 4]}" ${tf}/>`;
      else if (nm === 'rectangle') body += `<rect x="${cx - r * 1.25}" y="${cy - r * 0.72}" width="${2.5 * r}" height="${1.44 * r}" fill="${cols[i % 4]}" ${tf}/>`;
      else body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${cols[i % 4]}" ${tf}/>`;
      body += label('ABCD'[i], cx, 168, 15, INK);
    });
    return wrap(W, H, opts.label || 'four flat shapes labelled A B C D', body);
  }

  /* a shell measured with same-sized blocks that touch */
  /* a shell and the same-sized blocks that cover it: blocks stay under the shell, edge to edge */
  function blocks(n, opts) {
    opts = opts || {};
    const W = 520, H = 200, units = Math.max(2, Math.min(10, n)), unit = Math.min(58, 430 / units);
    const start = (W - units * unit) / 2, end = start + units * unit, mid = W / 2, hgt = 58;
    let body = card(W, H, opts.fill || '#effaf9');
    /* fan-shaped pearl shell: a dome with ribs, its span exactly on the blocks below it */
    body += `<path d="M${start} 84a${units * unit / 2} ${hgt} 0 0 1 ${units * unit} 0Z" fill="#f6d7b0" stroke="${INK}" stroke-width="2.5"/>`;
    for (let i = 1; i < 6; i++) {
      const a = Math.PI - (i * Math.PI) / 6;
      body += `<line x1="${mid}" y1="84" x2="${mid + Math.cos(a) * (units * unit / 2)}" y2="${84 - Math.sin(a) * hgt}" stroke="#c99a63" stroke-width="2"/>`;
    }
    for (let i = 0; i < units; i++) {
      /* no numbers on the blocks: the child counts them, the picture must not do it for them */
      body += `<rect x="${start + i * unit + 1.5}" y="90" width="${unit - 3}" height="34" rx="6" fill="${i % 2 ? BRAND : '#0b5f66'}" stroke="#fff" stroke-width="1.5"/>`;
    }
    body += label(opts.caption || 'equal blocks, touching, no gaps', W / 2, 160, 15, '#6b5a3a');
    return wrap(W, H, `${units} equal blocks cover the shell`, body);
  }

  /* two measured shells, for "how many blocks longer" */
  function blocksCompare(nA, nB) {
    const W = 520, H = 240, unit = 40, x = 128;
    let body = card(W, H, '#effaf9');
    [[nA, 46, 'Shell A'], [nB, 140, 'Shell B']].forEach(([n, y, name]) => {
      const span = n * unit, mid = x + span / 2;
      body += `<path d="M${x} ${y + 16}a${span / 2} 34 0 0 1 ${span} 0Z" fill="#f6d7b0" stroke="${INK}" stroke-width="2.5"/>`;
      for (let i = 1; i < 4; i++) {
        const a = Math.PI - (i * Math.PI) / 4;
        body += `<line x1="${mid}" y1="${y + 16}" x2="${mid + Math.cos(a) * (span / 2)}" y2="${y + 16 - Math.sin(a) * 34}" stroke="#c99a63" stroke-width="2"/>`;
      }
      for (let i = 0; i < n; i++) body += `<rect x="${x + i * unit + 1.5}" y="${y + 22}" width="${unit - 3}" height="30" rx="6" fill="${i % 2 ? BRAND : '#0b5f66'}"/>`;
      body += label(name, 54, y + 44, 16, INK);
    });
    body += label('equal blocks, edge to edge', W / 2, H - 12, 14, '#6b5a3a');
    return wrap(W, H, 'two shells measured with equal blocks, A first then B', body);
  }

  /* an analogue clock face; hour hand respects half past */
  function clock(hour, half, size) {
    const W = size || 220, c = W / 2, R = c - 12, k = W / 220;
    const pt = (deg, len) => [c + Math.cos(((deg - 90) * Math.PI) / 180) * len, c + Math.sin(((deg - 90) * Math.PI) / 180) * len];
    let body = `<circle cx="${c}" cy="${c}" r="${R}" fill="#fffdf6" stroke="${INK}" stroke-width="${6 * k}"/>`;
    for (let i = 1; i <= 12; i++) { const [x, y] = pt(i * 30, R * 0.78); body += label(i, x, y + 5 * k, 19 * k, '#3b2814'); }
    const [mx, my] = pt(half ? 180 : 0, R * 0.72), [hx, hy] = pt((hour % 12) * 30 + (half ? 15 : 0), R * 0.46);
    body += `<line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="${BRAND}" stroke-width="${5.5 * k}" stroke-linecap="round"/>`;
    body += `<line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="#d26542" stroke-width="${8.5 * k}" stroke-linecap="round"/>`;
    body += `<circle cx="${c}" cy="${c}" r="${6.5 * k}" fill="${INK}"/>`;
    return wrap(W, W, `clock showing ${hour} ${half ? 'thirty' : "o'clock"}`, body, W);
  }

  /* four lettered clocks for a matching round */
  function clockRow(times, ask) {
    const W = 560, H = 230;
    let body = card(W, H, '#fffaf0');
    times.forEach((t, i) => {
      const x = 14 + i * 136;
      body += `<g transform="translate(${x},18)">${clock(t[0], t[1], 128).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`;
      body += label('ABCD'[i], x + 64, 214, 15, INK);
    });
    return wrap(W, H, ask || 'four clocks labelled A B C D', body);
  }

  /* a picture graph where each circle is one vote */
  function graph(vals, opts) {
    opts = opts || {};
    const names = opts.names || ['Dates', 'Figs', 'Oranges'], cols = ['#c87839', '#4d8f7d', '#8a5fa8'];
    const W = 520, H = 250, base = 196, maxV = Math.max(4, ...vals);
    let body = card(W, H, '#fff6e8');
    body += label('each circle = 1 vote', 400, 28, 14, '#6b5a3a');
    body += `<line x1="40" y1="${base}" x2="482" y2="${base}" stroke="#b9a888" stroke-width="3" stroke-linecap="round"/>`;
    vals.forEach((v, i) => {
      const cx = 122 + i * 148;
      /* faint rungs, so children can match circles across the columns instead of guessing */
      for (let r = 1; r < maxV; r++) body += `<line x1="58" y1="${base - r * 32}" x2="466" y2="${base - r * 32}" stroke="#e6d8c4" stroke-width="1.5" stroke-dasharray="4 6"/>`;
      for (let j = 0; j < v; j++) body += `<circle cx="${cx}" cy="${base - 15 - j * 32}" r="13" fill="${cols[i]}"/>`;
      body += label(names[i], cx, base + 30, 16, INK);
    });
    return wrap(W, H, `picture graph: ${names.map((n, i) => `${n} ${vals[i]}`).join(', ')}`, body);
  }

  /* a lettered group for options: the picture fills the tile, the caption is a letter only */
  function group(n, opts) {
    opts = opts || {};
    const kind = opts.kind || 'dot', W = 240, H = 190;
    const cols = n > 10 ? 5 : (n > 6 ? 4 : 3), rows = Math.ceil(n / cols) || 1;
    const pad = 22, top = 20, boxTop = 8, boxH = H - 58;
    const cellW = (W - pad * 2) / cols, cellH = (boxH - top) / rows;
    const k = Math.min(1.25, Math.min(cellW / 36, cellH / 36));
    let body = `<rect x="4" y="${boxTop}" width="${W - 8}" height="${boxH}" rx="18" fill="${opts.fill || '#fff'}" stroke="#c9d6dd" stroke-width="3"/>`;
    for (let i = 0; i < n; i++) {
      const x = pad + cellW * ((i % cols) + .5), y = boxTop + top / 2 + cellH * (Math.floor(i / cols) + .5);
      body += kind === 'fish' ? fish(x, y, opts.color || BRAND, k)
        : kind === 'shell' ? shell(x, y - 2, opts.color || '#c87839', k)
        : kind === 'leaf' ? leaf(x, y, opts.color || '#3f8f57', k)
        : kind === 'pearl' ? pearl(x, y, opts.color || '#a9577a', 9 * k)
        : `<circle cx="${x}" cy="${y}" r="${10 * k}" fill="${opts.color || BRAND}"/>`;
    }
    /* the caption is a letter, never the count — otherwise the option gives the answer away */
    if (opts.label != null) body += `<text x="${W / 2}" y="${H - 12}" text-anchor="middle" font-size="26" font-weight="800" fill="#55647a">${opts.label}</text>`;
    return wrap(W, H, `${n} ${kind === 'dot' ? 'objects' : kind + 's'} in a group${opts.label != null ? ', choice ' + opts.label : ''}`, body, opts.max || W);
  }
  const nextTiles = (unit, count) => Array.from({ length: count }, (_, i) => unit[i % unit.length]);
  return { tenFrame, group, trays, lanterns, join, tiles, shapes, blocks, blocksCompare, clock, clockRow, graph, nextTiles, label };
})();

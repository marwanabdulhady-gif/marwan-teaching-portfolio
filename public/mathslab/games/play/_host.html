<!doctype html><meta charset="utf-8"><title>game test host</title>
<style>html,body{margin:0;height:100%}iframe{display:block;width:100%;height:100vh;border:0}</style>
<iframe id="f"></iframe>
<script>
  window.msgs = [];
  addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data || {};
    if (m.v !== 1) return;
    msgs.push(m);
  });
  window.openGame = (src) => { document.getElementById("f").src = src; };
  const want = new URLSearchParams(location.search).get("g");
  if (want) window.openGame(want);
</script>

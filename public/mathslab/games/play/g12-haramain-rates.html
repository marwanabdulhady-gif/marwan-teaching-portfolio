<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🚄 Haramain Rates · Fikr lesson game</title>
<meta name="description" content="The derivative as a rate of change — Grade 12 lesson game.">
<style>/* ==========================================================================
   Fikr lesson-game kit — the chrome every K–12 game shares.
   One look, one loop: home → Learn → three levels → level card → trophy.
   Built from the Fikr design guide (fikr-game-design-guide.md §1).
   ========================================================================== */

:root {
  --fk-ink: #10172a;
  --fk-ink2: #475467;
  --fk-muted: #8a94a6;
  --fk-line: #e4e8f0;
  --fk-accent: #6f5bf0;
  --fk-accent-ink: #4a35c9;
  --fk-accent-2: #ffb020;
  --fk-good: #15803d;
  --fk-bad: #c2410c;
  --fk-panel: #ffffff;
  --fk-bg: #eef1f7;
  --fk-target: 56px;
  --fk-radius: 18px;
  --fk-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body.fk {
  font: 500 17px/1.45 var(--fk-font);
  color: var(--fk-ink);
  background: var(--fk-bg);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
body.fk.rtl { direction: rtl; }

.fk-app { max-width: 1040px; margin: 0 auto; padding: 0 14px 28px; }

/* ---------- the top bar ---------- */
.fk-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; margin: 0 -14px 14px;
  background: var(--fk-ink); color: #fff;
  position: sticky; top: 0; z-index: 40;
}
.fk-bar .fk-emoji { font-size: 22px; }
.fk-bar .fk-title { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.fk-bar .fk-topic { font-weight: 500; font-size: 12.5px; opacity: .72; }
.fk-bar .fk-grow { flex: 1; }
.fk-dots { display: flex; gap: 5px; align-items: center; }
.fk-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  background: #ffffff33; display: block;
  transition: background .2s, transform .2s;
}
.fk-dots i.on { background: var(--fk-accent-2); transform: scale(1.15); }
.fk-count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
.fk-count b { color: var(--fk-accent-2); }
.fk-icobtn {
  appearance: none; border: 0; cursor: pointer;
  width: 38px; height: 38px; border-radius: 11px;
  background: #ffffff1a; color: #fff; font-size: 17px; line-height: 1;
  display: grid; place-items: center;
}
.fk-icobtn:hover { background: #ffffff2e; }
.fk-icobtn:focus-visible { outline: 3px solid var(--fk-accent-2); outline-offset: 2px; }

/* ---------- screens ---------- */
.fk-screen { display: none; }
.fk-screen.on { display: block; animation: fk-in .28s ease both; }
@keyframes fk-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.fk-card {
  background: var(--fk-panel);
  border-radius: var(--fk-radius);
  box-shadow: 0 10px 26px -18px #10172a55, 0 2px 0 #10172a0d;
  padding: 18px;
}

/* ---------- home ---------- */
.fk-hero { position: relative; overflow: hidden; border-radius: var(--fk-radius);
  background: linear-gradient(160deg, #f2efff, #e7f4f8); min-height: 190px; }
.fk-hero svg { display: block; width: 100%; height: auto; }
.fk-home-h { display: flex; align-items: flex-start; gap: 14px; margin: 4px 2px 14px; }
.fk-home-h h1 { font: 800 clamp(22px, 4vw, 30px)/1.1 var(--fk-font); margin: 0 0 6px; letter-spacing: -.02em; }
.fk-home-h p { margin: 0; color: var(--fk-ink2); font-size: 15px; max-width: 62ch; }
.fk-how { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: #f7f8fc; border: 1px solid var(--fk-line); }
.fk-how b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--fk-accent-ink); margin-bottom: 6px; }
.fk-how ol { margin: 0; padding-inline-start: 20px; color: var(--fk-ink2); font-size: 14.5px; }
.fk-how li { margin: 2px 0; }

.fk-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.fk-lv {
  text-align: start; cursor: pointer; appearance: none;
  border: 2px solid var(--fk-line); background: #fff; border-radius: 16px; padding: 14px;
  font: inherit; color: inherit; min-height: 96px;
  display: flex; flex-direction: column; gap: 4px;
  transition: transform .12s, border-color .12s, box-shadow .12s;
}
.fk-lv:hover { transform: translateY(-2px); border-color: #c9bffb; box-shadow: 0 12px 22px -18px #4a35c9aa; }
.fk-lv:focus-visible { outline: 3px solid var(--fk-accent); outline-offset: 2px; }
.fk-lv .fk-lv-top { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.fk-lv .fk-lv-top em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fk-muted); }
.fk-lv .fk-lv-blurb { color: var(--fk-ink2); font-size: 13.5px; }
.fk-lv .fk-lv-stars { color: var(--fk-accent-2); letter-spacing: 2px; font-size: 15px; }
.fk-btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* ---------- buttons ---------- */
.fk-btn {
  appearance: none; cursor: pointer; font: 700 15px/1 var(--fk-font);
  border-radius: 13px; padding: 13px 18px; min-height: 46px;
  border: 2px solid transparent; color: #fff; background: var(--fk-accent);
  box-shadow: 0 2px 0 #0000001a;
  transition: transform .1s, filter .15s, background .15s;
}
.fk-btn:hover { filter: brightness(1.06); }
.fk-btn:active { transform: translateY(1px); }
.fk-btn:focus-visible { outline: 3px solid var(--fk-accent-2); outline-offset: 2px; }
.fk-btn.ghost { background: #fff; color: var(--fk-ink); border-color: var(--fk-line); }
.fk-btn.ghost:hover { border-color: #c9c2f5; }
.fk-btn.good { background: var(--fk-good); }
.fk-btn.warm { background: var(--fk-accent-2); color: #3d2a00; }
.fk-btn[disabled] { opacity: .45; cursor: default; }

/* ---------- play ---------- */
.fk-stage { min-height: 300px; }
.fk-prompt { font: 800 clamp(19px, 3.2vw, 25px)/1.25 var(--fk-font); margin: 2px 0 12px; letter-spacing: -.01em; }
.fk-sub { color: var(--fk-ink2); font-size: 14.5px; margin: -6px 0 12px; }
.fk-art { display: grid; place-items: center; margin: 4px 0 14px; }
.fk-art svg { max-width: 100%; height: auto; }

.fk-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.fk-opt {
  appearance: none; cursor: pointer; font: 800 clamp(17px, 2.6vw, 22px)/1.2 var(--fk-font);
  color: var(--fk-ink); background: #fff; border: 3px solid var(--fk-line);
  border-radius: 16px; padding: 14px 12px; min-height: var(--fk-target);
  transition: transform .1s, border-color .12s, background .12s;
}
.fk-opt:hover { border-color: #c9bffb; background: #faf9ff; }
.fk-opt:focus-visible { outline: 3px solid var(--fk-accent); outline-offset: 2px; }
.fk-opt.tap { border-color: var(--fk-accent); background: #f4f1ff; }
.fk-opt.ok { border-color: var(--fk-good); background: #e9f8ef; }
.fk-opt.no { border-color: var(--fk-bad); background: #fdeee8; }

.fk-tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.fk-tile {
  appearance: none; cursor: pointer; font: 800 19px/1 var(--fk-font);
  color: var(--fk-ink); background: #fff; border: 3px solid var(--fk-line);
  border-radius: 14px; min-width: var(--fk-target); min-height: var(--fk-target);
  padding: 12px 16px;
}
.fk-tile.on { border-color: var(--fk-accent); background: #f4f1ff; }
.fk-tile.ok { border-color: var(--fk-good); background: #e9f8ef; }
.fk-tile.no { border-color: var(--fk-bad); background: #fdeee8; }

.fk-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 330px; }
.fk-key {
  appearance: none; cursor: pointer; font: 800 21px/1 var(--fk-font);
  background: #fff; color: var(--fk-ink); border: 3px solid var(--fk-line);
  border-radius: 14px; min-height: 58px;
}
.fk-key:hover { border-color: #c9bffb; }
.fk-key.enter { background: var(--fk-accent); color: #fff; border-color: var(--fk-accent); }
.fk-entry {
  font: 800 30px/1.1 var(--fk-font); letter-spacing: .06em;
  min-height: 48px; padding: 8px 14px; border-radius: 12px;
  border: 3px dashed var(--fk-line); background: #fbfcfe; min-width: 130px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.fk-entry.filled { border-style: solid; border-color: #c9bffb; background: #fff; }
.fk-sliders { display: grid; gap: 12px; margin: 6px 0 12px; }
.fk-sl { display: grid; grid-template-columns: 128px 1fr 62px; align-items: center; gap: 10px; font-size: 14px; color: var(--fk-ink2); }
.fk-sl input[type=range] { width: 100%; accent-color: var(--fk-accent); height: 30px; }
.fk-sl b { font-variant-numeric: tabular-nums; color: var(--fk-ink); text-align: end; }

/* ---------- coach ---------- */
.fk-coach {
  display: flex; gap: 12px; align-items: flex-start;
  margin-top: 14px; padding: 12px 14px; border-radius: 16px;
  background: #fff8e6; border: 1px solid #f2e2b8;
  font-size: 15px; min-height: 56px;
}
.fk-coach .fk-face { font-size: 26px; line-height: 1; }
.fk-coach .fk-say { flex: 1; }
.fk-coach.good { background: #e9f8ef; border-color: #bfe3cb; }
.fk-coach.bad { background: #fdeee8; border-color: #f2c9b8; }
.fk-coach.hint { background: #f2f1ff; border-color: #d9d2ff; }
.fk-say b { color: var(--fk-accent-ink); }

.fk-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.fk-tool {
  appearance: none; cursor: pointer; font: 700 13.5px/1 var(--fk-font);
  border: 1.5px solid var(--fk-line); background: #fff; color: var(--fk-ink2);
  border-radius: 11px; padding: 10px 13px;
}
.fk-tool:hover { border-color: #c9bffb; color: var(--fk-ink); }
.fk-tool:focus-visible { outline: 3px solid var(--fk-accent); outline-offset: 2px; }
.fk-tool.hot { border-color: var(--fk-accent); color: var(--fk-accent-ink); background: #f6f4ff; }

/* ---------- learn ---------- */
.fk-learn { }
.fk-learn .fk-slide-body { min-height: 210px; display: grid; align-content: center; gap: 12px; }
.fk-learn h2 { font: 800 clamp(19px, 3vw, 24px)/1.25 var(--fk-font); margin: 0; }
.fk-learn p { margin: 0; color: var(--fk-ink2); }
.fk-learn .fk-tip { font-size: 14px; color: var(--fk-muted); }
.fk-learn-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.fk-learn-nav .fk-grow { flex: 1; }
.fk-prog { height: 8px; border-radius: 99px; background: var(--fk-line); overflow: hidden; }
.fk-prog i { display: block; height: 100%; background: var(--fk-accent); width: 0; transition: width .3s; }

/* ---------- level card / finale ---------- */
.fk-card-big { text-align: center; padding: 26px 18px; }
.fk-card-big h2 { font: 800 clamp(22px, 4vw, 30px)/1.15 var(--fk-font); margin: 6px 0; }
.fk-stars { font-size: 40px; letter-spacing: 6px; color: var(--fk-accent-2); line-height: 1; }
.fk-stars .off { color: #e2e6ef; }
.fk-metric { display: flex; justify-content: center; gap: 22px; margin: 16px 0 4px; flex-wrap: wrap; }
.fk-metric div { font-size: 14px; color: var(--fk-ink2); }
.fk-metric b { display: block; font: 800 24px/1.2 var(--fk-font); color: var(--fk-ink); }
.fk-trophy { font-size: 64px; line-height: 1; animation: fk-pop .5s ease both; }
@keyframes fk-pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* ---------- streaks + bursts ---------- */
.fk-streak {
  position: fixed; inset-block-start: 64px; inset-inline: 0; margin: 0 auto;
  width: max-content; padding: 10px 18px; border-radius: 99px;
  background: var(--fk-ink); color: #fff; font-weight: 800; font-size: 15px;
  pointer-events: none; z-index: 60; animation: fk-streak 1.5s ease forwards;
}
@keyframes fk-streak {
  0% { transform: translateY(10px) scale(.9); opacity: 0; }
  20% { transform: none; opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(-12px); opacity: 0; }
}
.fk-burst { position: fixed; pointer-events: none; z-index: 55; width: 10px; height: 10px; border-radius: 50%; }
.fk-shake { animation: fk-shake .36s ease; }
@keyframes fk-shake { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } 100% { transform: none; } }

/* ---------- scene animations (SVG worlds) ---------- */
.fk-bob { animation: fk-bob 3.4s ease-in-out infinite; transform-origin: center; }
@keyframes fk-bob { 50% { transform: translateY(-6px); } }
.fk-drift { animation: fk-drift 26s linear infinite; }
@keyframes fk-drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
.fk-sway { animation: fk-sway 5s ease-in-out infinite; transform-origin: bottom center; }
@keyframes fk-sway { 50% { transform: rotate(2.4deg); } }
.fk-flap { animation: fk-flap 1.6s ease-in-out infinite; transform-origin: center; }
@keyframes fk-flap { 50% { transform: scaleY(.82); } }
.fk-glow { animation: fk-glow 2.6s ease-in-out infinite; }
@keyframes fk-glow { 50% { opacity: .55; } }
.fk-run { animation: fk-run 9s linear infinite; }
@keyframes fk-run { from { transform: translateX(-10%); } to { transform: translateX(110%); } }

@media (prefers-reduced-motion: reduce) {
  .fk-bob, .fk-drift, .fk-sway, .fk-flap, .fk-glow, .fk-run, .fk-streak, .fk-trophy { animation: none !important; }
  .fk-shake { animation: none !important; }
  .fk-screen.on { animation: none; }
}

/* ---------- narrow screens ---------- */
@media (max-width: 560px) {
  body.fk { font-size: 16px; }
  .fk-app { padding: 0 10px 22px; }
  .fk-bar { margin: 0 -10px 12px; gap: 8px; }
  .fk-bar .fk-topic { display: none; }
  .fk-card { padding: 14px; }
  .fk-opts { grid-template-columns: repeat(2, 1fr); }
  .fk-sl { grid-template-columns: 96px 1fr 54px; font-size: 13px; }
  .fk-keypad { max-width: none; }
}

/* high-contrast / forced colours keep the icons legible */
@media (forced-colors: active) {
  .fk-opt, .fk-tile, .fk-key, .fk-btn { border: 3px solid CanvasText; }
}
</style>
</head>
<body class="fk">
<script>/* ==========================================================================
   Fikr lesson-game kit — LK
   One learning loop for every K–12 game: home → Learn → 3 levels → trophy.
   An author writes only the world, the Learn slides and the rounds.

     LK.start({ id, title, emoji, topic, grade, band, world, how, learn,
                levels:[{name, icon, blurb, rounds, round(R,i)}],
                praise, finale })
   Round API (R): el, level, index, rounds, hints, say, right, wrong,
                  solve, later, every, on, sfx, fx, ease
   UI (LK.ui):   choice, tiles, keypad, sliders
   Test hooks:   LK.test.pass() · fail() · state() · level(i)   (never shown to a pupil)
   ========================================================================== */
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";

  /* ---------------- helpers ---------------- */
  function h(tag, attrs, kids) {
    const n = document.createElement(tag);
    apply(n, attrs);
    (kids || []).forEach((k) => k && n.append(k));
    return n;
  }
  function apply(n, attrs) {
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style") n.setAttribute("style", v);
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    });
  }
  function s(tag, attrs, kids) {
    const n = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.setAttribute("class", v);
      else if (k === "fill" || k === "stroke") n.style[k] = v;
      else n.setAttribute(k, v);
    });
    (kids || []).forEach((k) => k && n.append(k));
    return n;
  }
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = (n, d) => {
    const v = Math.abs(n) < 1e-12 ? 0 : n;
    return d == null ? String(Math.round(v * 1e6) / 1e6) : v.toFixed(d);
  };
  const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- sound, without files ---------------- */
  let AC = null;
  function tone(freq, ms, type, gain) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = gain == null ? 0.07 : gain;
      o.connect(g).connect(AC.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (ms || 120) / 1000);
      o.stop(AC.currentTime + (ms || 120) / 1000);
    } catch (e) { /* audio is a bonus, never a requirement */ }
  }
  const sfx = {
    right: () => { tone(660, 110); setTimeout(() => tone(880, 120), 90); },
    wrong: () => tone(170, 200, "square", 0.05),
    tap: () => tone(520, 60, "sine", 0.04),
    streak: () => { [660, 830, 990].forEach((f, i) => setTimeout(() => tone(f, 110), i * 80)); },
    level: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 150), i * 110)); },
  };

  /* ---------------- storage: best stars per game, per level ---------------- */
  const KEY = "fikr:stars:v1";
  function store() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function bestOf(id, lv) { const t = store(); return (t[id] && t[id][lv]) || 0; }
  function saveBest(id, lv, stars) {
    try {
      const t = store();
      t[id] = t[id] || {};
      if ((t[id][lv] || 0) < stars) t[id][lv] = stars;
      localStorage.setItem(KEY, JSON.stringify(t));
    } catch (e) { /* private mode */ }
  }

  /* ---------------- talk to the host page (the message contract) ---------------- */
  const EMBED = window.parent && window.parent !== window;
  function tell(msg) {
    if (!EMBED) return;
    const out = Object.assign({ v: 1 }, msg);
    try { window.parent.postMessage(out, location.origin === "null" ? "*" : location.origin); } catch (e) { /* ignore */ }
  }

  /* ---------------- read aloud ---------------- */
  let voiceOn = false;
  function speak(text, lang) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g, " "));
      u.lang = lang || "en-GB";
      u.rate = 0.92;
      speechSynthesis.speak(u);
    } catch (e) { /* no voice */ }
  }

  /* ---------------- the app ---------------- */
  function start(def) {
    const G = Object.assign({
      praise: ["Yes!", "That's it.", "Exactly.", "Well spotted."],
      finale: "You finished the whole lesson!",
      coach: "🦉",
      band: "g35",
    }, def);
    const BAND = { k2: { target: 72, rounds: 4 }, g35: { target: 56, rounds: 6 }, g68: { target: 48, rounds: 7 }, g912: { target: 44, rounds: 8 } }[G.band] || { target: 56, rounds: 6 };
    document.documentElement.style.setProperty("--fk-target", BAND.target + "px");

    const totalRounds = G.levels.reduce((a, l) => a + l.rounds, 0);
    const st = {
      screen: "home", li: 0, ri: 0, stars: 0, firstTry: 0, tries: 0, done: 0,
      streak: 0, best: 0, mistakes: {}, running: false, timers: [],
    };
    if (G.rtl) document.body.classList.add("rtl");

    /* the skeleton */
    const app = h("div", { class: "fk-app" });
    const bar = h("div", { class: "fk-bar" });
    const screens = { home: h("section", { class: "fk-screen on", id: "fk-home" }), learn: h("section", { class: "fk-screen", id: "fk-learn" }), play: h("section", { class: "fk-screen", id: "fk-play" }), end: h("section", { class: "fk-screen", id: "fk-end" }) };
    app.append(bar, screens.home, screens.learn, screens.play, screens.end);
    document.body.append(app);

    const barBits = {
      emoji: h("span", { class: "fk-emoji", text: G.emoji || "🎮" }),
      title: h("div", {}, [h("div", { class: "fk-title", text: G.title }), h("div", { class: "fk-topic", text: G.topic || "" })]),
      grow: h("span", { class: "fk-grow" }),
      dots: h("span", { class: "fk-dots" }),
      count: h("span", { class: "fk-count" }),
      voice: h("button", { class: "fk-icobtn", type: "button", title: "Read it aloud", "aria-label": "Read it aloud", text: "🔊" }),
      home: h("button", { class: "fk-icobtn", type: "button", title: "Back to the start", "aria-label": "Back to the start", text: "⌂" }),
      close: h("button", { class: "fk-icobtn", type: "button", title: "Close", "aria-label": "Close", text: "✕" }),
    };
    bar.append(barBits.emoji, barBits.title, barBits.grow, barBits.dots, barBits.count, barBits.voice, barBits.home, barBits.close);
    barBits.voice.addEventListener("click", () => {
      voiceOn = !voiceOn;
      barBits.voice.classList.toggle("hot", voiceOn);
      barBits.voice.textContent = voiceOn ? "🔊" : "🔈";
      if (voiceOn) speak(currentSpeech());
      else if ("speechSynthesis" in window) speechSynthesis.cancel();
    });
    barBits.home.addEventListener("click", () => goHome());
    barBits.close.addEventListener("click", () => {
      tell({ type: "lesson:close", id: G.id });
      if (EMBED) window.parent.postMessage({ type: "lesson:close", v: 1, id: G.id }, "*");
      else goHome();
    });

    function currentSpeech() {
      const c = screens.play.querySelector(".fk-say");
      return c ? c.textContent : "";
    }
    function show(which) {
      Object.entries(screens).forEach(([k, n]) => n.classList.toggle("on", k === which));
      st.screen = which;
      window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
    }
    function barPlay(on) {
      barBits.dots.style.display = on ? "" : "none";
      barBits.count.style.display = on ? "" : "none";
    }
    barPlay(false);

    /* ---------------- home ---------------- */
    function goHome() {
      clearTimers();
      st.running = false;
      barPlay(false);
      const lv = screens.home.querySelector(".fk-levels");
      if (lv) paintLevelCards();
      show("home");
      speak(G.welcome || G.topic || G.title);
    }
    function paintLevelCards() {
      const wrap = screens.home.querySelector(".fk-levels");
      if (!wrap) return;
      wrap.innerHTML = "";
      G.levels.forEach((l, i) => {
        const b = bestOf(G.id, i);
        const card = h("button", { class: "fk-lv", type: "button" });
        card.innerHTML = `
          <span class="fk-lv-top"><span>${l.icon || "◆"}</span><span>${escapeHtml(l.name)}</span><em>level ${i + 1}</em></span>
          <span class="fk-lv-blurb">${escapeHtml(l.blurb || "")}</span>
          <span class="fk-lv-stars" aria-label="${b} of 3 stars">${"★".repeat(b)}${"☆".repeat(3 - b)}</span>`;
        card.addEventListener("click", () => startLevel(i));
        wrap.append(card);
      });
    }
    function escapeHtml(t) {
      return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function buildHome() {
      const hero = h("div", { class: "fk-hero" });
      if (G.world) { try { G.world(hero); } catch (e) { /* a broken world must not break the game */ } }
      const head = h("div", { class: "fk-home-h" });
      head.innerHTML = `<div>
        <h1>${G.emoji || "🎮"} ${escapeHtml(G.title)}</h1>
        <p>${escapeHtml(G.topic || "")}${G.grade ? " · " + escapeHtml(G.grade) : ""}</p></div>`;
      screens.home.append(hero, h("div", { class: "fk-card", style: "margin-top:14px" }), );
      const card = screens.home.querySelector(".fk-card");
      card.append(head);
      if (G.how) {
        const how = h("div", { class: "fk-how" });
        how.innerHTML = "<b>How it works</b><ol>" + (G.how.steps || []).map((x) => `<li>${x}</li>`).join("") + "</ol>";
        card.append(how);
    }
      const levels = h("div", { class: "fk-levels" });
      card.append(levels);
      const row = h("div", { class: "fk-btnrow" });
      if (G.learn && G.learn.length) {
        const lb = h("button", { class: "fk-btn warm", type: "button", text: "🎓 Learn first" });
        lb.addEventListener("click", () => startLearn());
        row.append(lb);
      }
      const first = h("button", { class: "fk-btn", type: "button", text: "▶ Play level 1" });
      first.addEventListener("click", () => startLevel(0));
      row.append(first);
      card.append(row);
      paintLevelCards();
    }

    /* ---------------- Learn ---------------- */
    const learn = { i: 0, unlocked: false, ok: false };
    function startLearn() {
      learn.i = 0; learn.ok = false;
      show("learn");
      paintLearn();
    }
    function paintLearn() {
      const wrap = screens.learn;
      wrap.innerHTML = "";
      const slide = G.learn[learn.i];
      const card = h("div", { class: "fk-card fk-learn" });
      const body = h("div", { class: "fk-slide-body" });
      const prog = h("div", { class: "fk-prog" });
      prog.innerHTML = `<i style="width:${(learn.i / G.learn.length) * 100}%"></i>`;
      card.append(h("div", { class: "fk-tip", text: `Learn · ${learn.i + 1} of ${G.learn.length}` }), prog, body);
      const nav = h("div", { class: "fk-learn-nav" });
      const back = h("button", { class: "fk-btn ghost", type: "button", text: "← Back" });
      back.addEventListener("click", () => { if (learn.i > 0) { learn.i--; learn.ok = false; paintLearn(); } else goHome(); });
      const skip = h("button", { class: "fk-btn ghost", type: "button", text: "Skip to the game" });
      skip.addEventListener("click", () => startLevel(0));
      const next = h("button", { class: "fk-btn", type: "button", text: learn.i === G.learn.length - 1 ? "Play ▶" : "Next →" });
      next.addEventListener("click", () => {
        if (slide.wait && !learn.ok) { say(screens.learn, "Try it first — then we move on.", "hint"); return; }
        if (learn.i < G.learn.length - 1) { learn.i++; learn.ok = false; paintLearn(); }
        else startLevel(0);
      });
      nav.append(back, h("span", { class: "fk-grow" }), skip, next);
      card.append(nav);
      wrap.append(card);
      /* one coach bubble holds the slide's line; a drawing follows it */
      const c = h("div", { class: "fk-coach" });
      c.innerHTML = `<span class="fk-face">${G.coach || "🦉"}</span><span class="fk-say">${slide.say || ""}</span>`;
      if (slide.say) body.append(c);
      const L = {
        ok(msg) {
          learn.ok = true;
          if (msg) c.className = "fk-coach good", c.innerHTML = `<span class="fk-face">🎉</span><span class="fk-say">${msg}</span>`;
          sfx.right();
          next.classList.remove("ghost");
          next.focus();
        },
        say(msg, mood) {
          c.className = "fk-coach " + (mood || "");
          c.innerHTML = `<span class="fk-face">${G.coach || "🦉"}</span><span class="fk-say">${msg}</span>`;
          speak(String(msg).replace(/<[^>]+>/g, " "));
        },
        h,
      };
      if (slide.draw) { try { slide.draw(body, L); } catch (e) { body.append(h("p", { text: "…" })); } }
      if (slide.wait) next.classList.add("ghost");
      speak(slide.say || "");
    }
    function say(scope, html, mood) {
      const c = scope.querySelector(".fk-coach");
      if (!c) return;
      c.className = "fk-coach " + (mood || "");
      c.innerHTML = `<span class="fk-face">${mood === "good" ? "🎉" : mood === "bad" ? (G.coach || "🦉") : (G.coach || "🦉")}</span><span class="fk-say">${html}</span>`;
      speak(String(html).replace(/<[^>]+>/g, " "));
    }

    /* ---------------- play ---------------- */
    function clearTimers() {
      st.timers.forEach((t) => clearTimeout(t));
      st.timers = [];
    }
    function startLevel(i) {
      st.li = i; st.ri = 0; st.firstTry = 0; st.tries = 0; st.mistakes = {};
      st.running = true;
      barPlay(true);
      show("play");
      tell({ type: "lesson:progress", id: G.id, stars: st.stars, streak: st.streak, done: st.done, total: totalRounds });
      round();
    }
    function paintBar() {
      const n = G.levels[st.li].rounds;
      barBits.dots.innerHTML = Array.from({ length: n }, (_, k) => `<i class="${k < st.ri ? "on" : ""}"></i>`).join("");
      barBits.count.innerHTML = `<b>${st.stars}</b> ★`;
    }
    let R = null;

    function round() {
      clearTimers();
      const li = st.li, ri = st.ri;
      const level = G.levels[li];
      const wrap = screens.play;
      wrap.innerHTML = "";
      const card = h("div", { class: "fk-card" });
      const stage = h("div", { class: "fk-stage" });
      const coach = h("div", { class: "fk-coach", "aria-live": "polite" });
      const tools = h("div", { class: "fk-tools" });
      const hintBtn = h("button", { class: "fk-tool", type: "button", text: "💡 Hint" });
      const showBtn = h("button", { class: "fk-tool", type: "button", text: "👀 Show me" });
      const nextBtn = h("button", { class: "fk-btn good", type: "button", text: "Next ▸" });
      nextBtn.style.display = "none";
      tools.append(hintBtn, showBtn);
      card.append(h("div", { class: "fk-tip", text: `${level.icon || "◆"} ${level.name} · round ${ri + 1} of ${level.rounds}` }), stage, tools, nextBtn, coach);
      wrap.append(card);
      paintBar();

      const ctx = {
        el: stage, level: li, index: ri, rounds: level.rounds, hints: [], ease: 0,
        done: false, tries: 0, answer: null, whyLines: [],
        say(text, mood) { coach.className = "fk-coach " + (mood || ""); coach.innerHTML = `<span class="fk-face">${G.coach || "🦉"}</span><span class="fk-say">${text}</span>`; speak(String(text).replace(/<[^>]+>/g, " ")); },
        right(opts) {
          if (ctx.done) return;
          ctx.done = true;
          st.done += 1;
          st.streak += 1;
          if (ctx.tries === 0) { st.firstTry += 1; st.stars += 1; }
          st.best = Math.max(st.best, st.streak);
          sfx.right();
          burst();
          ctx.say(pick(G.praise) + (ctx.tries === 0 ? "" : " (with a nudge)"), "good");
          if (st.streak === 3 || st.streak === 5 || st.streak === 10) {
            sfx.streak();
            const b = h("div", { class: "fk-streak", text: `🔥 ${st.streak} in a row!` });
            document.body.append(b);
            st.timers.push(setTimeout(() => b.remove(), 1600));
          }
          paintBar();
          tell({ type: "lesson:progress", id: G.id, stars: st.stars, streak: st.streak, done: st.done, total: totalRounds });
          const wait = opts && opts.wait === "button";
          if (wait) { nextBtn.style.display = ""; nextBtn.focus(); }
          else st.timers.push(setTimeout(afterRound, 950));
        },
        wrong(why, opts) {
          if (ctx.done) return;
          ctx.tries += 1;
          st.tries += 1;
          st.streak = 0;
          const cat = (opts && opts.cat) || "other";
          st.mistakes[cat] = (st.mistakes[cat] || 0) + 1;
          sfx.wrong();
          if (opts && opts.at && !reduced()) { opts.at.classList.remove("fk-shake"); void opts.at.offsetWidth; opts.at.classList.add("fk-shake"); }
          ctx.say(why || "Not quite — look again.", "bad");
          if (ctx.tries >= 2) showBtn.classList.add("hot");
          if ((opts && opts.hint) || st.tries >= 5) hintBtn.classList.add("hot");
        },
        later(fn, ms) { const t = setTimeout(fn, ms); st.timers.push(t); return t; },
        every(fn, ms) { const t = setInterval(fn, ms); st.timers.push(t); return t; },
        on(fn) { st.timers.push(0); return fn; },
        sfx, fx: { burst, shake: (n) => { if (n && !reduced()) { n.classList.remove("fk-shake"); void n.offsetWidth; n.classList.add("fk-shake"); } }, pop: burst },
        speak,
      };
      R = ctx;
      try { level.round(ctx, ri); } catch (e) {
        ctx.el.append(h("p", { text: "This round could not be drawn." }));
      }
      hintBtn.addEventListener("click", () => {
        const hints = ctx.hints || [];
        if (!hints.length) { ctx.say("No hint on this one — you have everything you need.", "hint"); return; }
        const i = Math.min(ctx.hintIndex || 0, hints.length - 1);
        ctx.hintIndex = i + 1;
        ctx.say(hints[i], "hint");
        if (i >= hints.length - 1) hintBtn.disabled = true;
      });
      showBtn.addEventListener("click", () => {
        if (ctx.done) return;
        ctx.done = true;
        st.done += 1;
        if (ctx.solve) { try { ctx.solve(ctx); } catch (e) { /* ignore */ } }
        else if (ctx.answer != null) ctx.say(`The answer is <b>${ctx.answer}</b>.`, "hint");
        ctx.say(`Here it is — you have learnt this one. <b>${Array.isArray(ctx.answer) ? ctx.answer.join(", ") : ctx.answer}</b>`, "hint");
        paintBar();
        st.timers.push(setTimeout(afterRound, 1600));
      });
      nextBtn.addEventListener("click", () => afterRound());
      if (!coach.textContent) ctx.say(level.blurb || "Your turn.");
    }
    function afterRound() {
      st.ri += 1;
      if (st.ri < G.levels[st.li].rounds) return round();
      /* level finished */
      const stars = Math.max(1, Math.round((st.firstTry / G.levels[st.li].rounds) * 3));
      saveBest(G.id, st.li, stars);
      const list = Object.entries(st.mistakes).map(([detail, n]) => ({ detail, n }));
      tell({ type: "lesson:level", id: G.id, level: st.li, stars });
      if (list.length) tell({ type: "lesson:mistakes", id: G.id, level: st.li, list });
      levelCard(stars, list);
    }
    function levelCard(stars, list) {
      clearTimers();
      barPlay(false);
      const more = st.li + 1 < G.levels.length;
      const wrap = screens.end;
      wrap.innerHTML = "";
      const card = h("div", { class: "fk-card fk-card-big" });
      card.innerHTML = `
        <div class="fk-stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3 - stars)}</span></div>
        <h2>${more ? "Level " + (st.li + 1) + " done" : "Last level done!"}</h2>
        <p>${escapeHtml(G.levels[st.li].name)} · ${st.firstTry} of ${G.levels[st.li].rounds} first try</p>
        <div class="fk-metric">
          <div><b>${st.stars}</b>stars so far</div>
          <div><b>${st.best}</b>best streak</div>
          <div><b>${st.done}/${totalRounds}</b>rounds</div>
        </div>`;
      const row = h("div", { class: "fk-btnrow", style: "justify-content:center" });
      if (more) {
        const nb = h("button", { class: "fk-btn good", type: "button", text: `Level ${st.li + 2}: ${G.levels[st.li + 1].name} →` });
        nb.addEventListener("click", () => startLevel(st.li + 1));
        row.append(nb);
      } else {
        const fb = h("button", { class: "fk-btn good", type: "button", text: "See the trophy 🏆" });
        fb.addEventListener("click", () => finale());
        row.append(fb);
      }
      const again = h("button", { class: "fk-btn ghost", type: "button", text: "Replay this level" });
      again.addEventListener("click", () => startLevel(st.li));
      row.append(again);
      card.append(row);
      wrap.append(card);
      sfx.level();
      show("end");
    }
    function finale() {
      const wrap = screens.end;
      wrap.innerHTML = "";
      const card = h("div", { class: "fk-card fk-card-big" });
      const pct = Math.round((st.done / totalRounds) * 100);
      const mastered = pct >= 70;
      card.innerHTML = `
        <div class="fk-trophy">${mastered ? "🏆" : "🎖️"}</div>
        <h2>${escapeHtml(G.finale || "You finished!")}</h2>
        <p>${mastered ? "Mastered — that is 70% or better." : "Good effort. Play it again to lock it in."}</p>
        <div class="fk-metric">
          <div><b>${st.stars}/${totalRounds}</b>stars</div>
          <div><b>${pct}%</b>first try</div>
          <div><b>${st.best}</b>best streak</div>
        </div>`;
      const row = h("div", { class: "fk-btnrow", style: "justify-content:center" });
      const again = h("button", { class: "fk-btn", type: "button", text: "Play again ↺" });
      again.addEventListener("click", () => { st.stars = 0; st.done = 0; st.streak = 0; st.best = 0; startLevel(0); });
      const home = h("button", { class: "fk-btn ghost", type: "button", text: "Back to the levels" });
      home.addEventListener("click", () => goHome());
      row.append(again, home);
      card.append(row);
      wrap.append(card);
      tell({ type: "lesson:done", id: G.id, score: st.stars, total: totalRounds });
      show("end");
      sfx.level();
    }

    function burst() {
      if (reduced()) return;
      const n = 12;
      for (let i = 0; i < n; i++) {
        const d = h("div", { class: "fk-burst" });
        const colours = ["#6f5bf0", "#ffb020", "#15803d", "#22b8cf", "#e0502e"];
        d.style.background = colours[i % colours.length];
        d.style.left = 50 + rint(-16, 16) + "vw";
        d.style.top = 46 + rint(-8, 8) + "vh";
        document.body.append(d);
        const dx = rint(-70, 70), dy = rint(-90, -30);
        d.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.3)`, opacity: 0 }],
          { duration: 760 + rint(0, 260), easing: "cubic-bezier(.2,.7,.3,1)" });
        setTimeout(() => d.remove(), 1100);
      }
    }

    /* ---------------- UI primitives (every one sets R.answer and R.submit) ---------------- */
    const ui = {
      choice(R, o) {
        R.answer = o.answer;
        if (o.hint) R.hints = [].concat(o.hint, R.hints || []);
        if (o.art) R.el.append(o.art());
        if (o.prompt) R.el.append(h("h2", { class: "fk-prompt", html: o.prompt }));
        if (o.sub) R.el.append(h("p", { class: "fk-sub", html: o.sub }));
        const wrap = h("div", { class: "fk-opts" });
        /* an option may be a picture: {key:'a', html:'<svg…>'} — the key decides right and wrong */
        const keyOf = (v) => (v && typeof v === "object" && "key" in v ? v.key : v);
        const htmlOf = (v) => (v && typeof v === "object" ? v.html : String(v));
        const opts = shuffle(o.options.slice());
        opts.forEach((v) => {
          const b = h("button", { class: "fk-opt", type: "button", html: htmlOf(v), "data-key": String(keyOf(v)) });
          b.addEventListener("click", () => submit(v, b));
          wrap.append(b);
        });
        R.el.append(wrap);
        function submit(v, node) {
          if (R.done) return;
          if (norm(keyOf(v)) === norm(o.answer)) { if (node) node.classList.add("ok"); R.right(); }
          else {
            if (node) node.classList.add("no");
            R.wrong(typeof o.why === "function" ? o.why(v) : (o.why || "Not that one — read it again."), { at: node, cat: o.cat });
          }
        }
        R.submit = submit;
        R.wrongValue = () => keyOf(opts.find((v) => norm(keyOf(v)) !== norm(o.answer)) || "?");
        R.solve = () => { R.el.querySelectorAll(".fk-opt").forEach((b) => { if (norm(b.getAttribute("data-key")) === norm(o.answer)) b.classList.add("ok"); }); };
      },

      tiles(R, o) {
        R.answer = o.answer;
        R.el.append(h("h2", { class: "fk-prompt", html: o.prompt }));
        if (o.sub) R.el.append(h("p", { class: "fk-sub", html: o.sub }));
        const wrap = h("div", { class: "fk-tiles" });
        const chosen = new Set();
        const nodes = new Map();
        o.tiles.forEach((t) => {
          const b = h("button", { class: "fk-tile", type: "button", html: String(t.label) });
          b.addEventListener("click", () => {
            const key = String(t.label);
            if (chosen.has(key)) { chosen.delete(key); b.classList.remove("on"); }
            else { chosen.add(key); b.classList.add("on"); }
            sfx.tap();
            if (o.instant) check();
          });
          nodes.set(String(t.label), b);
          wrap.append(b);
        });
        R.el.append(wrap);
        const wantAll = o.need !== "any";
        function check() {
          if (R.done) return;
          const need = o.answer.map(String);
          const missing = need.filter((a) => !chosen.has(a));
          const extra = [...chosen].filter((a) => !need.includes(a));
          if (wantAll ? (!missing.length && !extra.length) : chosen.size > 0 && !missing.length) { chosen.forEach((k) => nodes.get(k) && nodes.get(k).classList.add("ok")); R.right(); }
          else {
            extra.forEach((k) => { const n = nodes.get(k); if (n) { n.classList.add("no"); R.wrong(typeof o.why === "function" ? o.why(k) : (o.why || "One of those is not needed."), { at: n, cat: o.cat }); } });
            if (!extra.length && missing.length) R.wrong(o.missWhy || `You have ${need.length - missing.length} of ${need.length} — one more.`, { cat: o.cat });
          }
        }
        R.submit = (v) => {
          chosen.clear();
          [].concat(v).forEach((k) => chosen.add(String(k)));
          check();
        };
        R.wrongValue = () => [o.answer[0] === undefined ? "nope" : (o.tiles.find((t) => String(t.label) !== String(o.answer[0])) || {}).label];
        R.solve = () => { o.answer.forEach((k) => nodes.get(String(k)) && nodes.get(String(k)).classList.add("ok")); };
        if (o.check !== false) {
          const c = h("button", { class: "fk-btn", type: "button", text: o.checkLabel || "Check ✓" });
          c.addEventListener("click", check);
          R.el.append(h("div", { class: "fk-btnrow" }, [c]));
        }
      },

      keypad(R, o) {
        R.answer = o.answer;
        R.el.append(h("h2", { class: "fk-prompt", html: o.prompt }));
        if (o.sub) R.el.append(h("p", { class: "fk-sub", html: o.sub }));
        if (o.art) R.el.append(o.art());
        const row = h("div", { class: "fk-btnrow", style: "align-items:center" });
        const entry = h("div", { class: "fk-entry", "aria-live": "polite", text: "" });
        row.append(entry);
        const pad = h("div", { class: "fk-keypad" });
        let buf = "";
        const paint = () => { entry.textContent = buf; entry.classList.toggle("filled", !!buf); };
        const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", o.neg ? "±" : "0", "0", "⌫", "✓"];
        keys.forEach((k, i) => {
          if (i === 9 && !o.neg) return;
          const b = h("button", { class: "fk-key" + (k === "✓" ? " enter" : ""), type: "button", text: k, "aria-label": k === "✓" ? "submit" : k });
          b.addEventListener("click", () => {
            sfx.tap();
            if (k === "⌫") buf = buf.slice(0, -1);
            else if (k === "±") buf = buf.startsWith("-") ? buf.slice(1) : "-" + buf;
            else if (k === "✓") return check();
            else if (buf.length < (o.max || 5)) buf += k;
            paint();
          });
          pad.append(b);
        });
        R.el.append(row, pad);
        function check() {
          if (R.done || buf === "") return;
          const v = o.decimal ? parseFloat(buf) : parseInt(buf, 10);
          submit(v);
          if (!R.done) { buf = ""; paint(); }
        }
        function submit(v) {
          if (R.done) return;
          const ok = o.tol != null ? Math.abs(v - o.answer) <= o.tol : String(v) === String(o.answer);
          if (ok) R.right();
          else R.wrong(typeof o.why === "function" ? o.why(v) : (o.why || "Not that number — work it out step by step."), { at: entry, cat: o.cat });
        }
        R.submit = submit;
        R.wrongValue = () => (typeof o.answer === "number" ? o.answer + (o.answer === 0 ? 1 : 1) : "x");
        R.solve = () => { buf = String(o.answer); paint(); };
      },

      sliders(R, o) {
        R.answer = o.answer;
        R.el.append(h("h2", { class: "fk-prompt", html: o.prompt }));
        if (o.sub) R.el.append(h("p", { class: "fk-sub", html: o.sub }));
        if (o.art) R.el.append(o.art(R));
        const wrap = h("div", { class: "fk-sliders" });
        const vals = o.controls.map((c) => c.value);
        o.controls.forEach((c, i) => {
          const lab = h("label", { class: "fk-sl" });
          lab.innerHTML = `<span>${c.label}</span>`;
          const inp = h("input", { type: "range", min: c.min, max: c.max, step: c.step || 1, value: String(c.value), "aria-label": c.label });
          const out = h("b", { text: String(c.value) });
          inp.addEventListener("input", () => { vals[i] = Number(inp.value); out.textContent = String(inp.value); if (o.onInput) o.onInput(vals, R); });
          lab.append(inp, out);
          wrap.append(lab);
        });
        R.el.append(wrap);
        const check = h("button", { class: "fk-btn", type: "button", text: "Lock it in ✓" });
        check.addEventListener("click", () => { if (R.done) return; const ok = o.test(vals); if (ok) R.right(); else R.wrong(typeof o.why === "function" ? o.why(vals) : (o.why || "Not matching yet — look at the whole picture."), { cat: o.cat }); });
        R.el.append(h("div", { class: "fk-btnrow" }, [check]));
        R.submit = (v) => { const target = Array.isArray(v) ? v : [v]; if (o.test(target)) R.right(); else R.wrong(o.why || "Not matching yet.", { cat: o.cat }); };
        R.wrongValue = () => (o.controls[0].value === o.answer[0] ? [o.answer[0] + 1].concat(o.answer.slice(1)) : [o.controls[0].value].concat(o.answer.slice(1)));
        R.solve = () => { R.say(`The matching values are <b>${[].concat(o.answer).join(" and ")}</b>.`, "hint"); };
      },
    };
    const norm = (v) => String(v).replace(/<[^>]+>/g, "").replace(/[\s,]/g, "").replace(/−/g, "-").toLowerCase();

    /* ---------------- build + boot ---------------- */
    /* the kit's helpers exist before the world is drawn */
    window.LK = window.LK || {};
    window.LK.ui = ui;
    window.LK.h = h;
    window.LK.s = s;
    window.LK.rint = rint;
    window.LK.pick = pick;
    window.LK.shuffle = shuffle;
    window.LK.fmt = fmt;
    window.LK.speak = speak;
    window.LK.state = st;
    window.LK.game = G;
    buildHome();
    tell({ type: "lesson:ready", id: G.id, total: G.levels.reduce((n, l) => n + (l.rounds || 0), 0) });
    document.title = (G.emoji ? G.emoji + " " : "") + G.title;

    window.LK.test = {
      state: () => ({ screen: st.screen, level: st.li, index: st.ri, rounds: G.levels[st.li] ? G.levels[st.li].rounds : 0, stars: st.stars, done: st.done, streak: st.streak, firstTry: st.firstTry, tries: st.tries, mistakes: Object.assign({}, st.mistakes), answer: R ? R.answer : null, id: G.id }),
      pass: () => { if (!R || R.done) return false; if (!R.submit) return false; R.submit(R.answer); return true; },
      fail: () => { if (!R || R.done) return false; if (!R.submit) return false; R.submit(R.wrongValue()); return true; },
      show: () => { const b = screens.play.querySelector(".fk-tool.hot"); if (b) b.click(); return !!b; },
      next: () => { const b = [...screens.play.querySelectorAll(".fk-btn")].find((x) => x.style.display !== "none"); if (b) { b.click(); return true; } return false; },
      level: (i) => startLevel(i),
      card: () => { const b = screens.end.querySelector(".fk-btn"); if (b) { b.click(); return true; } return false; },
      learn: () => startLearn(),
      skipLearn: () => startLevel(0),
    };
  }

  function svg(w, hgt, label) {
    const n = s("svg", { viewBox: `0 0 ${w} ${hgt}`, class: "fk-art", role: "img", "aria-label": label || "" });
    n.style.width = "100%";
    n.style.maxWidth = w + "px";
    n.style.display = "block";
    return n;
  }
  window.LK = { start, speak, h, s, svg, rint, pick, shuffle, fmt, clamp, ui: null };
})();
</script>
<script>/* Grade 12 · Haramain Rates — the derivative as a rate of change.
   Mechanic = the thinking: the average speed over an interval is a secant, and
   the only way to the speed at an instant is to shrink the interval. */
(function () {
  const { h, s, svg, rint, pick, shuffle, fmt } = window.LK;

  /* s(t) = t² + 3t  (metres);  v(t) = 2t + 3  (m/s) */
  const sOf = (t) => t * t + 3 * t;
  const vOf = (t) => 2 * t + 3;
  const avg = (t0, h) => (sOf(t0 + h) - sOf(t0)) / h;

  const W = 460, HGT = 290, pad = 34;
  const tMax = 8, sMax = sOf(tMax);
  const X = (t) => pad + (t / tMax) * (W - 2 * pad);
  const Y = (sv) => HGT - pad - (sv / sMax) * (HGT - 2 * pad);

  function track(t0, hh, opts) {
    const o = opts || {};
    const g = svg(W, HGT, o.label || "position against time for the Haramain train");
    g.append(s("rect", { x: 0, y: 0, width: W, height: HGT, fill: "#f6faf8" }));
    for (let t = 0; t <= tMax; t++) {
      g.append(s("line", { x1: X(t), y1: pad, x2: X(t), y2: HGT - pad, stroke: "#e6efe9" }));
      g.append(s("text", { x: X(t), y: HGT - pad + 16, "text-anchor": "middle", "font-size": 10.5, fill: "#7d8c85", text: t + "s" }));
    }
    for (let sv = 0; sv <= sMax; sv += 20) g.append(s("line", { x1: pad, y1: Y(sv), x2: W - pad, y2: Y(sv), stroke: "#eef4f0" }));
    g.append(s("line", { x1: pad, y1: HGT - pad, x2: W - pad, y2: HGT - pad, stroke: "#a9b8b0", "stroke-width": 1.6 }));
    g.append(s("line", { x1: pad, y1: pad, x2: pad, y2: HGT - pad, stroke: "#a9b8b0", "stroke-width": 1.6 }));
    g.append(s("text", { x: W - 12, y: HGT - 8, "text-anchor": "end", "font-size": 11, fill: "#7d8c85", text: "time →" }));
    g.append(s("text", { x: 14, y: 20, "font-size": 11, fill: "#7d8c85", text: "distance (m)" }));
    /* the curve s(t) */
    let d = "";
    for (let i = 0; i <= 200; i++) {
      const t = (i / 200) * tMax;
      d += (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(sOf(t)).toFixed(1);
    }
    g.append(s("path", { d, fill: "none", stroke: "#0f766e", "stroke-width": 2.8 }));
    /* the secant over [t0, t0+h] */
    if (hh != null && hh > 0) {
      const m = avg(t0, hh);
      g.append(s("line", { x1: X(t0 - 1.4), y1: Y(sOf(t0) - m * 1.4), x2: X(t0 + hh + 1.4), y2: Y(sOf(t0) + m * (hh + 1.4)), stroke: "#e0502e", "stroke-width": 2.6 }));
      [[t0, sOf(t0)], [t0 + hh, sOf(t0 + hh)]].forEach(([t, sv]) => g.append(s("circle", { cx: X(t), cy: Y(sv), r: 5, fill: "#e0502e" })));
      g.append(s("text", { x: X(t0 + hh / 2), y: Y(sOf(t0 + hh / 2)) - 14, "text-anchor": "middle", "font-size": 12, fill: "#b03418", text: `average ${fmt(m, 2)} m/s` }));
      /* the gap h, drawn */
      g.append(s("line", { x1: X(t0), y1: Y(sOf(t0)) + 12, x2: X(t0 + hh), y2: Y(sOf(t0)) + 12, stroke: "#94a3b8", "stroke-width": 1.4 }));
      g.append(s("text", { x: X(t0 + hh / 2), y: Y(sOf(t0)) + 26, "text-anchor": "middle", "font-size": 11, fill: "#64748b", text: `h = ${hh}s` }));
    }
    /* the tangent at t0 (the truth) */
    const m0 = vOf(t0);
    g.append(s("line", { x1: X(t0 - 1.6), y1: Y(sOf(t0) - m0 * 1.6), x2: X(t0 + 1.6), y2: Y(sOf(t0) + m0 * 1.6), stroke: "#6f5bf0", "stroke-width": 2, "stroke-dasharray": "7 5" }));
    g.append(s("text", { x: 12, y: 38, "font-size": 11.5, fill: "#4a35c9", text: "dashed = the tangent (the instant)" }));
    return g;
  }

  LK.start({
    id: "g12-haramain-rates",
    title: "Haramain Rates",
    emoji: "🚄",
    topic: "The derivative as a rate of change",
    grade: "Grade 12 · age 17–18",
    band: "g912",
    coach: "🚉",
    how: {
      steps: [
        "Average speed = change in distance ÷ change in time: that is a <b>secant</b> slope.",
        "Shrink h. The secant swings towards the tangent, and the average becomes the instantaneous.",
        "The limit of (s(t+h) − s(t)) / h as h → 0 is the derivative — with units, m/s.",
      ],
    },
    world(el) {
      el.append(track(4, 2, { label: "average speed over two seconds, and the tangent at one instant" }));
    },
    learn: [
      {
        say: "The Haramain train runs between Makkah and Madinah. Here is its distance against time; the average speed over 2 s is the slope of the red secant.",
        draw(el) { el.append(track(4, 2)); },
      },
      {
        say: "Shrink the interval: over 1 s, then 0.5 s. The red line swings onto the dashed tangent — that slope is the speed <b>at that instant</b>.",
        draw(el) { el.append(track(4, 1)); },
      },
      {
        say: "Your turn: averages are 13, 12, 11.5, 11.25 m/s as h shrinks. What is the instantaneous speed at t = 4 s?",
        wait: true,
        draw(el, L) {
          el.append(track(4, 0.5));
          const wrap = h("div", { class: "fk-tiles" });
          ["11 m/s", "13 m/s", "0 m/s"].forEach((t) => {
            const b = h("button", { class: "fk-tile", type: "button", text: t });
            b.addEventListener("click", () => (t === "11 m/s" ? L.ok("The averages are heading for 11 — that is the tangent.") : L.say("Look at where the averages are going as h shrinks.", "bad")));
            wrap.append(b);
          });
          el.append(wrap);
        },
      },
      {
        say: "Ghubar says “the train's speed at t = 4 is 30 m/s because it travelled 28 m”. What did he do?",
        wait: true,
        draw(el, L) {
          const wrap = h("div", { class: "fk-tiles" });
          [["He used total distance — that is an average pace, not the instant.", true], ["Nothing, distance = speed.", false]].forEach(([t, ok]) => {
            const b = h("button", { class: "fk-tile", type: "button", html: t });
            b.addEventListener("click", () => (ok ? L.ok("Right — a rate needs a change in time, and the interval has to shrink.") : L.say("Speed is distance per second, at one instant.", "bad")));
            wrap.append(b);
          });
          el.append(track(4, 2), wrap);
        },
      },
    ],
    levels: [
      {
        name: "Shrink the interval",
        icon: "🔎",
        blurb: "Slide h down until the average is within 0.3 m/s of the instant.",
        rounds: 4,
        round(R) {
          const t0 = rint(2, 5);
          const truth = vOf(t0);
          const art = track(t0, 2, { label: "secant and tangent" });
          const redraw = (hh) => {
            const fresh = track(t0, hh);
            art.innerHTML = "";
            while (fresh.firstChild) art.append(fresh.firstChild);
          };
          LK.ui.sliders(R, {
            prompt: `t = ${t0} s. The tangent (dashed) is the true speed. Shrink h until the secant is within <b>0.3 m/s</b> of it.`,
            art: () => art,
            controls: [{ label: "interval h (s)", min: 0.25, max: 2, step: 0.25, value: 2 }],
            answer: [0.25],
            test: (v) => Math.abs(avg(t0, v[0]) - truth) <= 0.3,
            cat: "average-for-instant",
            why: (v) => `With h = ${v[0]} s the average is ${fmt(avg(t0, v[0]), 2)} m/s — still the secant. Shrink it further.`,
            hint: "Smaller h, smaller gap between secant and tangent.",
            onInput: (v, RR) => {
              redraw(v[0]);
              RR.say(`average over ${v[0]} s = <b>${fmt(avg(t0, v[0]), 2)} m/s</b> · the tangent is ${fmt(truth, 2)} m/s`, "hint");
            },
          });
          R.solve = () => { redraw(0.25); R.say(`As h → 0 the average → <b>${fmt(truth, 2)} m/s</b>.`, "hint"); };
        },
      },
      {
        name: "The limit table",
        icon: "📉",
        blurb: "Four averages. Where are they going?",
        rounds: 5,
        round(R) {
          const t0 = rint(2, 5);
          const rows = [2, 1, 0.5, 0.25].map((hh) => `h = ${hh}: ${fmt(avg(t0, hh), 2)} m/s`);
          LK.ui.choice(R, {
            prompt: `Averages at t = ${t0} s: ${rows.join(" · ")}. What is the speed at that instant?`,
            art: () => track(t0, 0.5),
            answer: String(vOf(t0)),
            options: shuffle([String(vOf(t0)), String(fmt(avg(t0, 2), 0)), String(vOf(t0) + 2)]),
            cat: "average-for-instant",
            why: (v) => (Number(v) === Number(fmt(avg(t0, 2), 0)) ? "That is the average over the widest interval, not the instant."
              : `Every average is heading for ${vOf(t0)} m/s — that is the limit.`),
            hint: "The numbers are closing on one value. Which?",
          });
        },
      },
      {
        name: "By the rules",
        icon: "⚡",
        blurb: "No table now: differentiate and keep the units.",
        rounds: 5,
        round(R) {
          const a = rint(2, 5), b = rint(2, 9);
          const ans = `${2 * a}x − ${b}`;
          LK.ui.choice(R, {
            prompt: `s(t) = ${a}t² − ${b}t. What is ds/dt?`,
            answer: ans,
            options: shuffle([ans, `${a}t − ${b}`, `${2 * a}t² − ${b}t`, `${2 * a}x − ${b}x`]),
            cat: "power-rule",
            why: (v) => (v === `${a}t − ${b}` ? "You did not multiply by the power — d/dt of t² is 2t."
              : v.endsWith("x") ? "The variable is t here, and the unit of ds/dt is m/s."
              : `Power rule: ${a}t² → ${2 * a}t, and −${b}t → −${b}.`),
            hint: "Bring the power down and drop it by one.",
          });
        },
      },
    ],
    praise: ["Secant to tangent — that's the derivative.", "Limit taken.", "Rate with units."],
    finale: "You took a limit on a moving train. That is calculus. 🚄",
  });
})();
</script>
